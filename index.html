<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tasks">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" id="metaThemeL" media="(prefers-color-scheme: light)" content="#F2F2F7">
<meta name="theme-color" id="metaThemeD" media="(prefers-color-scheme: dark)" content="#000000">
<title>Tasks</title>
<style>
/* =========================================================================
   THEME TOKENS — set by applyTheme() at boot; these are the defaults.
   ========================================================================= */
:root{
  --bg:#F2F2F7; --elev:#FFFFFF; --press:#E5E5EA;
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29); --fill:rgba(116,116,128,.12); --fill2:rgba(116,116,128,.08);
  --accent:#007AFF; --accent-rgb:0,122,255;
  --red:#FF3B30; --green:#34C759; --orange:#FF9500;
  --gray:#8E8E93; --purple:#AF52DE; --teal:#30B0C7; --yellow:#FFCC00;
  --navbg:rgba(249,249,249,.82);
  --hatch:rgba(var(--accent-rgb),.10); --hatch2:rgba(var(--accent-rgb),.22);
  --scrim:rgba(255,255,255,0); --sleep:rgba(116,116,128,.10);
}
:root[data-dark="1"]{
  --bg:#000000; --elev:#1C1C1E; --press:#2C2C2E;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
  --accent:#0A84FF; --accent-rgb:10,132,255;
  --red:#FF453A; --green:#30D158; --orange:#FF9F0A;
  --gray:#8E8E93; --purple:#BF5AF2; --teal:#40C8E0; --yellow:#FFD60A;
  --navbg:rgba(30,30,30,.82);
  --scrim:rgba(0,0,0,0); --sleep:rgba(118,118,128,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  background:var(--bg);color:var(--label);font-size:17px;line-height:1.29;
  letter-spacing:-.022em;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea,select{background:none;border:0;outline:none;font-size:17px}
textarea{resize:none;font-family:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* background image layer */
#bgimg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;display:none}
body.hasbg #bgimg{display:block}
body.hasbg #bgimg::after{content:"";position:absolute;inset:0;background:var(--bgdim,rgba(0,0,0,.35))}
body.hasbg{background:transparent}
body.hasbg .group,body.hasbg .cap,body.hasbg .tl,body.hasbg .field,body.hasbg .statcard,
body.hasbg .daywrap,body.hasbg .wkcolwrap,body.hasbg .tfbanner,body.hasbg .selbar{
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%)}
body.hasbg{--elev:rgba(255,255,255,.78);--press:rgba(230,230,235,.85)}
body.hasbg[data-hasdark="1"]{--elev:rgba(28,28,30,.72);--press:rgba(44,44,46,.8)}

#app{display:flex;flex-direction:column;height:100%}
.nav{position:relative;z-index:30;flex:0 0 auto;padding-top:env(safe-area-inset-top);
  background:var(--navbg);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);transition:box-shadow .2s}
.nav.scrolled{box-shadow:0 .33px 0 var(--sep)}
.navbar{height:44px;display:flex;align-items:center;padding:0 8px;gap:2px;position:relative}
.navbar .spacer{flex:1}
.navtitle{font-size:17px;font-weight:600;letter-spacing:-.02em;position:absolute;left:50%;
  transform:translateX(-50%);opacity:0;transition:opacity .2s;pointer-events:none;
  max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.nav.scrolled .navtitle{opacity:1}
.navbtn{color:var(--accent);font-size:17px;padding:6px 8px;min-height:44px;
  display:flex;align-items:center;gap:3px}
.navbtn.icon{padding:6px;min-width:40px;justify-content:center}
.navbtn.back{margin-left:-2px}
.largetitle{font-size:34px;font-weight:700;letter-spacing:.37px;line-height:1.2;padding:0 20px 6px;margin:0}
.subtitle{padding:0 20px 10px;font-size:15px;color:var(--label2)}
.crumbs{padding:0 20px 10px;font-size:13px;color:var(--label2);white-space:nowrap;overflow-x:auto}
.crumbs::-webkit-scrollbar{display:none}
.crumbs button{color:var(--accent);font-size:13px}

#scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#content{padding:6px 0 96px;max-width:760px;margin:0 auto;width:100%}
@media(min-width:760px){#content{padding-bottom:56px}}

/* section headers — v2: clearly delineated */
.sechead{font-size:13px;color:var(--label2);padding:22px 20px 7px;display:flex;
  justify-content:space-between;align-items:baseline;gap:12px}
.sechead .h{font-weight:600;letter-spacing:-.01em}
.sechead button{font-size:13px;color:var(--accent)}
.sechead.big{padding:28px 20px 8px;position:relative}
.sechead.big .h{font-size:15px;font-weight:700;color:var(--label);letter-spacing:-.02em}
.sechead.big::before{content:"";position:absolute;left:20px;right:20px;top:14px;height:.5px;background:var(--sep)}
.sheetbody > .sechead.big:first-child::before{display:none}

.group{background:var(--elev);margin:0 16px;border-radius:10px;overflow:hidden}
.group + .group{margin-top:10px}

.row{position:relative;overflow:hidden;background:var(--elev)}
.row + .row .rowin::before{content:"";position:absolute;left:0;right:0;top:0;height:.33px;background:var(--sep)}
.rowin{position:relative;display:flex;align-items:flex-start;gap:11px;padding:11px 14px 11px 16px;
  min-height:44px;background:var(--elev);transition:transform .24s cubic-bezier(.32,.72,0,1);
  will-change:transform;z-index:1}
.rowin.dragging{transition:none}
.row.pressed .rowin{background:var(--press)}
.mark{flex:0 0 auto;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.circle{width:22px;height:22px;border-radius:50%;border:1.6px solid var(--label3);display:block}
.circle.on{background:var(--accent);border-color:var(--accent)}
.circle.on::after{content:"";display:block;width:11px;height:6px;border-left:2px solid #fff;
  border-bottom:2px solid #fff;transform:rotate(-45deg);margin:5px 0 0 4px}
.circle.gated{border-style:dashed;opacity:.55}
.folder{width:22px;height:22px;color:var(--accent)}
.folder.stalled{color:var(--orange)}
.nodeicon{font-size:17px;line-height:1;width:22px;text-align:center}
.body{flex:1 1 auto;min-width:0;padding-right:4px}
.title{font-size:17px;letter-spacing:-.02em;overflow-wrap:anywhere}
.row.done .title{color:var(--label2);text-decoration:line-through;text-decoration-color:var(--label3)}
.row.dropped .title{color:var(--label3);text-decoration:line-through}
.sub{font-size:13px;color:var(--label2);margin-top:2px;overflow-wrap:anywhere;
  display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dot{color:var(--label3)}
.pill{font-size:11px;font-weight:600;padding:1.5px 6px;border-radius:5px;
  background:var(--fill);color:var(--label2);letter-spacing:0}
.pill.red{background:rgba(255,59,48,.15);color:var(--red)}
.pill.orange{background:rgba(255,149,0,.18);color:var(--orange)}
.pill.blue{background:rgba(var(--accent-rgb),.14);color:var(--accent)}
.pill.gray{background:var(--fill);color:var(--label2)}
.pill.tint{background:var(--fill)}
.trail{flex:0 0 auto;display:flex;align-items:center;gap:7px;color:var(--label2);align-self:center}
.chev{width:9px;height:15px;color:var(--label3);flex:0 0 auto}
.count{font-size:15px;color:var(--label2)}
.flagdot{width:8px;height:8px;border-radius:50%;background:var(--orange);flex:0 0 auto}
.catdot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}

.actions{position:absolute;top:0;right:0;bottom:0;display:flex;z-index:0;opacity:0}
.row.swiping .actions,.row.opened .actions{opacity:1}
.actions button{width:80px;color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;height:100%}
.act-done{background:var(--green)} .act-drop{background:var(--gray)}
.act-del{background:var(--red)} .act-flag{background:var(--orange)}

.empty{text-align:center;padding:56px 40px;color:var(--label2)}
.empty h2{font-size:20px;font-weight:600;color:var(--label);margin:0 0 6px;letter-spacing:-.02em}
.empty p{font-size:15px;margin:0 0 20px;line-height:1.4}
.empty button{color:var(--accent);font-size:17px;padding:10px;text-align:center}

/* capacity */
.cap{margin:4px 16px 0;background:var(--elev);border-radius:10px;padding:13px 16px}
.cap .top{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.cap .top b{font-weight:600}
.cap .bar{height:7px;border-radius:4px;background:var(--fill);margin-top:9px;overflow:hidden;display:flex}
.cap .seg1{background:var(--accent)} .cap .seg2{background:var(--orange)}
.cap .msg{font-size:13px;color:var(--label2);margin-top:8px;line-height:1.35}
.cap .msg.over{color:var(--orange)}

/* timeline list */
.tl{margin:0 16px;background:var(--elev);border-radius:10px;overflow:hidden}
.tlrow{display:flex;gap:12px;padding:11px 16px;align-items:flex-start}
.tlrow + .tlrow{border-top:.33px solid var(--sep)}
.tltime{flex:0 0 62px;font-size:13px;color:var(--label2);padding-top:2px}
.tlbar{flex:0 0 3px;align-self:stretch;border-radius:2px;background:var(--accent);min-height:20px}
.tlbar.ghost{background:var(--hatch2)}

/* month calendar */
.calhead{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px 4px;
  font-size:11px;color:var(--label2);text-align:center;font-weight:600}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px;gap:2px}
.cal{aspect-ratio:1/1.12;border-radius:8px;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding-top:5px;font-size:15px;position:relative;gap:3px;text-align:center}
.cal.out{color:var(--label3)}
.cal.today .num{background:var(--accent);color:#fff;border-radius:50%;
  width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.cal.sel{outline:2px solid var(--accent);outline-offset:-2px}
.cal .num{width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.cal .marks{display:flex;gap:2px;height:5px}
.cal .m{width:5px;height:5px;border-radius:50%}
.m.dl{background:var(--red)} .m.soft{background:var(--orange)} .m.fx{background:var(--accent)}
.caldate{font-size:13px;color:var(--label2);padding:14px 20px 2px;display:flex;justify-content:space-between}

/* timeframe banner */
.tfbanner{margin:0 16px 10px;background:rgba(var(--accent-rgb),.10);border-radius:10px;padding:11px 14px}
.tfbanner .t{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:4px}
.tfitem{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:15px}
.tfitem .needs{margin-left:auto;font-size:13px;color:var(--accent);flex:0 0 auto;padding:4px 0 4px 8px}

/* week strip (Today week toggle) */
.wk{display:flex;gap:6px;padding:0 14px;overflow-x:auto}
.wk::-webkit-scrollbar{display:none}
.wkd{flex:0 0 46px;background:var(--elev);border-radius:9px;padding:8px 0;text-align:center}
.wkd.sel{background:var(--accent);color:#fff}
.wkd .dow{font-size:11px;opacity:.65} .wkd .n{font-size:17px;font-weight:600;margin-top:2px}
.wkd .load{height:3px;border-radius:2px;margin:6px 7px 0;background:var(--fill)}

/* day timeline (calendar day view) */
.daywrap{margin:0 16px;background:var(--elev);border-radius:10px;overflow:hidden;position:relative}
.dayaxis{position:relative}
.dayhour{position:absolute;left:0;right:0;border-top:.33px solid var(--sep);
  font-size:10px;color:var(--label3);padding:1px 0 0 8px}
.dayblock{position:absolute;left:56px;right:10px;border-radius:7px;padding:4px 9px;overflow:hidden;
  font-size:13px;line-height:1.25;background:rgba(var(--accent-rgb),.16);
  border-left:3px solid var(--accent);color:var(--label)}
.dayblock .bt{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayblock .bs{font-size:11px;color:var(--label2)}
.dayblock.proj{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);
  border-left-color:var(--hatch2);border-left-style:dashed;border-left-width:2px}
.dayblock.sleepz{left:0;right:0;border-radius:0;border-left:0;background:var(--sleep);
  color:var(--label3);font-size:11px;display:flex;align-items:center;padding-left:56px}
.nowline{position:absolute;left:48px;right:0;height:0;border-top:1.5px solid var(--red);z-index:5}
.nowline::before{content:"";position:absolute;left:-5px;top:-4.5px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.dayfree{position:absolute;left:56px;right:10px;z-index:1}

/* week calendar columns */
.wkcolwrap{margin:0 10px;background:var(--elev);border-radius:10px;overflow-x:auto;position:relative}
.wkcols{display:flex;min-width:600px;position:relative}
.wkcol{flex:1 1 0;min-width:84px;border-left:.33px solid var(--sep);position:relative}
.wkcol:first-child{border-left:0}
.wkcol .wkhd{position:sticky;top:0;font-size:11px;text-align:center;padding:6px 0 4px;
  background:var(--elev);z-index:4;border-bottom:.33px solid var(--sep)}
.wkcol .wkhd b{display:block;font-size:15px}
.wkcol .wkhd.today b{color:var(--accent)}
.wkblk{position:absolute;left:3px;right:3px;border-radius:5px;font-size:10px;line-height:1.2;
  padding:2px 4px;overflow:hidden;background:rgba(var(--accent-rgb),.16);border-left:2px solid var(--accent)}
.wkblk.proj{background:repeating-linear-gradient(135deg,var(--hatch) 0 5px,transparent 5px 10px);border-left-style:dashed}
.wkblk.sleepz{left:0;right:0;border-radius:0;border-left:0;background:var(--sleep)}

/* tabs */
.tabs{flex:0 0 auto;display:flex;background:var(--navbg);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.33px 0 var(--sep);
  padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tab{flex:1;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--gray);font-size:10px;letter-spacing:0;font-weight:500;position:relative;text-align:center}
.tab svg{width:26px;height:26px} .tab.on{color:var(--accent)}
.tab .badge{position:absolute;top:4px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--red)}

/* floating action button */
.fab{position:fixed;right:20px;bottom:calc(64px + env(safe-area-inset-bottom) + 14px);
  width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;z-index:25;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 16px rgba(0,0,0,.24);transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab svg{width:26px;height:26px}
@media(min-width:760px){.fab{right:calc(50% - 360px)}}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;opacity:0;
  transition:opacity .3s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;top:max(env(safe-area-inset-top),10px);
  background:var(--bg);border-radius:12px 12px 0 0;z-index:51;transform:translateY(100%);
  transition:transform .35s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;overflow:hidden;
  max-width:760px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.sheethead{flex:0 0 auto;display:flex;align-items:center;padding:0 8px;height:52px;
  border-bottom:.33px solid var(--sep)}
.sheethead h3{flex:1;text-align:center;font-size:17px;font-weight:600;margin:0;letter-spacing:-.02em}
.sheethead button{color:var(--accent);font-size:17px;padding:10px;min-width:64px;text-align:center}
.sheethead button.strong{font-weight:600}
.sheetbody{flex:1;overflow-y:auto;padding:14px 0 48px;-webkit-overflow-scrolling:touch}

.field{background:var(--elev);margin:0 16px 16px;border-radius:10px;overflow:hidden}
.field .line{padding:11px 16px;display:flex;align-items:center;gap:12px;min-height:44px;
  width:100%;text-align:left;font-size:17px}
.field .line + .line{border-top:.33px solid var(--sep)}
.field .line label{color:var(--label);flex:0 0 auto;font-size:17px}
.field .line .val{flex:1;text-align:right;color:var(--label2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.field .line .val.set{color:var(--accent)}
.field input.big{font-size:17px;width:100%}
.field textarea{width:100%;font-size:17px;min-height:80px;line-height:1.35;padding:0}
.field button.line.accent{color:var(--accent);justify-content:center;text-align:center}
.field button.line.danger{color:var(--red);justify-content:center;text-align:center}
.field input[type=date],.field input[type=time],.field input[type=number]{
  text-align:right;color:var(--accent);flex:1;min-width:0}
.fieldnote{font-size:13px;color:var(--label2);margin:-10px 20px 16px;line-height:1.38}
.fieldnote.warn{color:var(--orange)}
.fieldnote.inline{margin:0;padding:0 16px 10px}
.seg{display:flex;background:var(--fill2);border-radius:9px;padding:2px;margin:0 16px 16px}
.seg button{flex:1;padding:7px 2px;font-size:14px;font-weight:500;border-radius:7px;color:var(--label);text-align:center}
.seg button.on{background:var(--elev);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.mini{margin:0 16px 10px}
.toggle{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;
  flex:0 0 auto;transition:background .2s}
.toggle.on{background:var(--green)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
  background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{transform:translateX(20px)}
.pickrow{display:flex;align-items:center;gap:10px;padding:12px 16px;width:100%;text-align:left;
  font-size:17px;background:var(--elev)}
.pickrow + .pickrow{border-top:.33px solid var(--sep)}
.pickrow.disabled{color:var(--label3)}
.pickrow .tick{margin-left:auto;color:var(--accent);font-weight:600}
.pickrow .path{font-size:12px;color:var(--label3);display:block;margin-top:1px}
.why{font-size:13px;color:var(--label2);line-height:1.4;padding:12px 20px;
  background:var(--fill2);margin:0 16px 16px;border-radius:10px}

/* collapsible capture sections */
.capsec{margin:0 16px 12px;background:var(--elev);border-radius:10px;overflow:hidden}
.capsec .caphd{display:flex;align-items:center;width:100%;padding:12px 16px;font-size:15px;
  font-weight:600;gap:8px}
.capsec .caphd .n{margin-left:auto;font-weight:400;font-size:13px;color:var(--label2)}
.capsec .caphd .arr{color:var(--label3);transition:transform .2s;font-size:12px}
.capsec.open .caphd .arr{transform:rotate(90deg)}
.capsec .capbd{display:none;border-top:.33px solid var(--sep)}
.capsec.open .capbd{display:block}
.capsec .line{padding:11px 16px;display:flex;align-items:center;gap:12px;min-height:44px;width:100%;font-size:17px}
.capsec .line + .line{border-top:.33px solid var(--sep)}
.capsec .line label{flex:0 0 auto}
.capsec .line .val{flex:1;text-align:right;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.capsec .line .val.set{color:var(--accent)}
.capsec input[type=date],.capsec input[type=time],.capsec input[type=number]{text-align:right;color:var(--accent);flex:1;min-width:0}
.capsec textarea{width:100%;min-height:70px;padding:0}

/* browse selector bar */
.selbar{display:flex;gap:7px;padding:2px 16px 12px;overflow-x:auto}
.selbar::-webkit-scrollbar{display:none}
.selbar button{flex:0 0 auto;font-size:14px;font-weight:500;padding:6px 13px;border-radius:15px;
  background:var(--fill2);color:var(--label);text-align:center}
.selbar button.on{background:var(--accent);color:#fff}
.searchwrap{margin:0 16px 12px;background:var(--fill);border-radius:10px;display:flex;
  align-items:center;padding:7px 12px;gap:7px}
.searchwrap svg{width:16px;height:16px;color:var(--label2);flex:0 0 auto}
.searchwrap input{flex:1;font-size:16px;min-width:0}

/* stats */
.statcard{margin:0 16px 10px;background:var(--elev);border-radius:10px;padding:14px 16px}
.statcard h4{margin:0 0 6px;font-size:15px;font-weight:600}
.statcard p{margin:0;font-size:14px;color:var(--label2);line-height:1.45}
.statrow{display:flex;justify-content:space-between;font-size:15px;padding:4px 0}
.statrow .v{font-weight:600}
.bignum{font-size:28px;font-weight:700;letter-spacing:-.02em}
.chart{width:100%;height:auto;display:block;margin-top:8px}

/* theme picker */
.themegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 16px}
.themecard{border-radius:12px;padding:12px;border:2px solid transparent;background:var(--elev);text-align:left}
.themecard.on{border-color:var(--accent)}
.themecard .sw{display:flex;gap:5px;margin-bottom:8px}
.themecard .sw span{width:22px;height:22px;border-radius:50%;border:.5px solid var(--sep)}
.themecard .nm{font-size:14px;font-weight:600}
.icongrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:12px;background:var(--elev);
  margin:0 16px 16px;border-radius:10px}
.icongrid button{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:22px;
  border-radius:9px}
.icongrid button.on{background:rgba(var(--accent-rgb),.16);outline:2px solid var(--accent)}
.colorrow{display:flex;gap:9px;padding:12px 16px;background:var(--elev);margin:0 16px 16px;
  border-radius:10px;flex-wrap:wrap}
.colorrow button{width:34px;height:34px;border-radius:50%;border:.5px solid var(--sep)}
.colorrow button.on{outline:3px solid var(--accent);outline-offset:2px}

/* in-app banner */
.banner{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:12px;right:12px;z-index:90;
  background:var(--elev);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.28);
  padding:12px 16px;display:flex;gap:11px;align-items:flex-start;transform:translateY(-140%);
  transition:transform .4s cubic-bezier(.32,.72,0,1);max-width:560px;margin:0 auto}
.banner.on{transform:translateY(0)}
.banner .bi{font-size:22px;flex:0 0 auto}
.banner .bt{font-size:15px;font-weight:600}
.banner .bs{font-size:13px;color:var(--label2);margin-top:1px}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));
  transform:translate(-50%,12px);background:rgba(40,40,40,.94);color:#fff;padding:10px 18px;
  border-radius:20px;font-size:15px;z-index:80;opacity:0;transition:opacity .25s,transform .25s;
  pointer-events:none;max-width:82%;text-align:center}
:root[data-dark="1"] .toast{background:rgba(80,80,84,.96)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms !important}}

/* ===== v2.1: motion, sheet nav, clearables, plan, fuzzy blocks ===== */
[hidden]{display:none!important}
@keyframes viewin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
#content.anim{animation:viewin .22s cubic-bezier(.2,.7,.3,1)}
@keyframes shfwd{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes shback{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.sheetbody.fwd{animation:shfwd .2s cubic-bezier(.2,.7,.3,1)}
.sheetbody.back{animation:shback .2s cubic-bezier(.2,.7,.3,1)}
.seg button{transition:background .16s,color .16s,box-shadow .16s}
.tab,.navbtn,.line,.pickrow,.row .rowin,.themecard,.cal{transition:background .14s,opacity .14s}
.toggle{transition:background .18s}.toggle::after{transition:transform .18s}
.fab{transition:transform .16s,box-shadow .16s}.fab:active{transform:scale(.92)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.sheetback{display:flex;align-items:center;gap:2px;min-width:64px;justify-content:flex-start}
.sheetback svg{flex:0 0 auto}
.sheetback span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px}
.clearx{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--fill);color:var(--label2);
  font-size:11px;display:flex;align-items:center;justify-content:center;margin-left:6px}
.clearx:active{background:var(--press)}
/* today plan timeline */
.plan{background:var(--elev);border-radius:12px;margin:0 16px 16px;overflow:hidden}
.planrow{display:flex;gap:12px;padding:11px 14px;align-items:center;position:relative}
.planrow + .planrow{border-top:.33px solid var(--sep)}
.planrow .pt{flex:0 0 66px;text-align:right;font-size:13px;color:var(--label2)}
.planrow .pt b{display:block;color:var(--label);font-size:14px;font-weight:600}
.planrow .pbar{flex:0 0 4px;align-self:stretch;border-radius:2px;background:var(--accent);opacity:.9}
.planrow.ghost .pbar{background:repeating-linear-gradient(180deg,var(--accent) 0 5px,transparent 5px 9px);opacity:.6}
.planrow.fuzzy .pbar{background:linear-gradient(180deg,var(--accent),transparent);opacity:.55}
.planrow.past{opacity:.45}
.planrow .body{flex:1;min-width:0}
.planrow .why{font-size:12px;color:var(--label2);margin-top:1px}
.plannote{padding:10px 16px;font-size:13px;color:var(--label2);border-top:.33px solid var(--sep)}
/* fuzzy calendar blocks: gradient border, soft fill */
.dayblock.fuzzy,.wkblk.fuzzy{border-left-style:none;border:1.4px dashed transparent;
  background:linear-gradient(var(--elev),var(--elev)) padding-box,
    linear-gradient(160deg,var(--accent),rgba(var(--accent-rgb),.06)) border-box;}
.dayblock.fuzzy{border-radius:9px}
.dayblock.plan2,.wkblk.plan2{background:rgba(var(--accent-rgb),.10);border-left:3px dashed var(--accent)}
.dlTick{position:absolute;left:52px;right:6px;height:0;border-top:2px solid var(--red);opacity:.75}
.dlTick::after{content:attr(data-l);position:absolute;right:0;top:-15px;font-size:10px;color:var(--red);font-weight:600}
/* capture parse chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px 2px}
.chip{display:inline-flex;align-items:center;gap:5px;background:rgba(var(--accent-rgb),.13);color:var(--accent);
  font-size:13px;font-weight:500;border-radius:14px;padding:4px 8px 4px 10px;animation:viewin .18s}
.chip b{font-weight:600}
.chip .x{width:15px;height:15px;border-radius:50%;background:rgba(var(--accent-rgb),.22);display:flex;
  align-items:center;justify-content:center;font-size:9px}
/* browse attention card */
.attn{background:var(--elev);border-radius:12px;margin:0 16px 16px;overflow:hidden}
.attn .arow{display:flex;align-items:center;gap:10px;padding:12px 14px;width:100%;text-align:left}
.attn .arow + .arow{border-top:.33px solid var(--sep)}
.attn .aico{flex:0 0 30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.attn .arow .n{margin-left:auto;color:var(--label2);font-size:14px;display:flex;align-items:center;gap:4px}
.unit{color:var(--label2);font-size:15px;flex:0 0 auto;margin-left:6px}
input[type="time"],input[type="date"]{min-height:30px}


/* ===== v2.2: input alignment, lanes, background tasks, plan detail ===== */
html{background:var(--bg)}
/* date & time inputs render as right-aligned iOS-style chips; WebKit centers
   the raw control, so give it an intrinsic-width chip instead of flex:1 */
.field .line input[type=date],.field .line input[type=time],
.capsec .line input[type=date],.capsec .line input[type=time]{
  flex:0 0 auto;width:auto;min-width:0;max-width:46%;
  background:var(--fill);border-radius:8px;padding:5px 10px;min-height:32px;
  color:var(--label);text-align:right}
.field .line label+input[type=date],.field .line label+input[type=time],
.capsec .line label+input[type=date],.capsec .line label+input[type=time]{margin-left:auto}
/* numbers: right-aligned, capped width, pushed to the right edge */
.field .line input[type=number],.capsec .line input[type=number]{
  flex:0 1 64px;min-width:44px;text-align:right;color:var(--accent)}
.field .line label+input[type=number],.capsec .line label+input[type=number]{margin-left:auto}
/* rows never wrap; the ✕ keeps its slot on the same line */
.field .line,.capsec .line{flex-wrap:nowrap}
.clearx{flex:0 0 22px}
.field .line label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex-shrink:1}
/* the plan: checkbox on the LEFT, per-task color on the bar */
.planrow .mark{flex:0 0 24px}
.planrow .pbar{background:var(--pc,var(--accent))}
.planrow.ghost .pbar{background:repeating-linear-gradient(180deg,var(--pc,var(--accent)) 0 5px,transparent 5px 9px);opacity:.6}
.planrow.fuzzy .pbar{background:linear-gradient(180deg,var(--pc,var(--accent)),transparent);opacity:.55}
.planrow.bg{background:var(--fill2)}
.planrow.bg .pbar{background:repeating-linear-gradient(180deg,var(--pc,var(--gray)) 0 3px,transparent 3px 6px);opacity:.5}
.planrow.unavail{opacity:.5}
.planrow.unavail .pbar{background:var(--sleep);border-radius:2px}
.planrow .why{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* background tasks on the calendar: hollow, stitched border, never opaque */
.dayblock.bgtask,.wkblk.bgtask{background:transparent;border:1.4px dashed var(--label3);
  border-left:3px dashed var(--gray);opacity:.85}
.dayblock.unav,.wkblk.unav{left:0;right:0;border-radius:0;border-left:0;
  background:repeating-linear-gradient(45deg,var(--sleep) 0 8px,transparent 8px 16px);
  color:var(--label2);font-size:11px;display:flex;align-items:center;justify-content:center}
.wkblk.unav{font-size:9px}
/* day-of-week chips in the unavailable-time editor */
.daychips{display:flex;gap:6px;padding:0 20px;flex-wrap:wrap}
.daychips button{width:40px;height:40px;border-radius:50%;background:var(--fill);color:var(--label);
  font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s}
.daychips button.on{background:var(--accent);color:#fff}
</style>

<script>
"use strict";
/* ===========================================================================
   TASKS v2 — complete rebuild
   Local-only. IndexedDB on this device. Nothing is ever sent anywhere.
   One node type: group, task and subtask are the same object.
   =========================================================================== */

const DB_NAME="tasks-db", DB_VER=2, UNSORTED="__inbox__", SCHEMA=3;
const MIN=60000, HOUR=3600000, DAY=86400000;

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const nowISO=()=>new Date().toISOString();
function uid(){ try{ if(crypto&&crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return "n"+Date.now().toString(36)+Math.random().toString(36).slice(2,10); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---- dates ---- */
const startOfDay=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x;};
const addDays=(d,n)=>new Date(startOfDay(d).getTime()+n*DAY);
const sameDay=(a,b)=>startOfDay(a).getTime()===startOfDay(b).getTime();
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");};
function fmtDate(iso,opt){ if(!iso)return""; const d=new Date(iso);
  return d.toLocaleDateString(undefined,opt||{month:"short",day:"numeric"}); }
function fmtTime(iso){ if(!iso)return""; return new Date(iso).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
function relDay(iso){
  if(!iso) return "";
  const d=startOfDay(iso), t=startOfDay(new Date());
  const n=Math.round((d-t)/DAY);
  if(n===0) return "Today"; if(n===1) return "Tomorrow"; if(n===-1) return "Yesterday";
  if(n<0) return Math.abs(n)+"d overdue";
  if(n<7) return new Date(iso).toLocaleDateString(undefined,{weekday:"short"});
  return fmtDate(iso);
}
function mins(m){ if(m==null)return""; m=Math.round(m); if(m<60)return m+"m";
  const h=Math.floor(m/60),r=m%60; return r?h+"h "+r+"m":h+"h"; }
function localDT(iso){ if(!iso)return""; const d=new Date(iso);
  const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes()); }
function dateInput(iso){ return iso?localDT(iso).slice(0,10):""; }
function timeInput(iso){ return iso?localDT(iso).slice(11,16):""; }
function hmToMin(hm){ if(!hm)return 0; const [h,m]=hm.split(":").map(Number); return h*60+(m||0); }
function minToHM(m){ m=((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
function fmtHM(hm){ if(!hm)return""; const d=new Date(); const[h,m]=hm.split(":").map(Number);
  d.setHours(h,m,0,0); return d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
function isoWeek(d){ const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=x.getUTCDay()||7; x.setUTCDate(x.getUTCDate()+4-day);
  const y0=new Date(Date.UTC(x.getUTCFullYear(),0,1));
  return x.getUTCFullYear()+"-W"+String(Math.ceil(((x-y0)/DAY+1)/7)).padStart(2,"0"); }

/* ===========================================================================
   PERSISTENCE — nodes, meta, snapshots. DB v2 adds the snapshots store.
   =========================================================================== */
let db=null;
function openDB(){ return new Promise((res,rej)=>{
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=e=>{ const d=e.target.result;
    if(!d.objectStoreNames.contains("nodes")){
      const s=d.createObjectStore("nodes",{keyPath:"id"});
      s.createIndex("parentId","parentId",{unique:false});
      s.createIndex("status","status",{unique:false}); }
    if(!d.objectStoreNames.contains("meta")) d.createObjectStore("meta",{keyPath:"key"});
    if(!d.objectStoreNames.contains("snapshots")) d.createObjectStore("snapshots",{keyPath:"id"}); };
  r.onsuccess=e=>res(e.target.result); r.onerror=()=>rej(r.error); }); }
const tx=(s,m)=>db.transaction(s,m).objectStore(s);
const putNode=n=>new Promise((res,rej)=>{const r=tx("nodes","readwrite").put(n);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
const delNode=i=>new Promise((res,rej)=>{const r=tx("nodes","readwrite").delete(i);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
const allNodes=()=>new Promise((res,rej)=>{const r=tx("nodes","readonly").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});
const putMeta=(key,value)=>new Promise((res,rej)=>{const r=tx("meta","readwrite").put({key,value});r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
const getMeta=key=>new Promise((res,rej)=>{const r=tx("meta","readonly").get(key);r.onsuccess=()=>res(r.result?r.result.value:null);r.onerror=()=>rej(r.error);});
const allMeta=()=>new Promise((res,rej)=>{const r=tx("meta","readonly").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});
const putSnap=s=>new Promise((res,rej)=>{const r=tx("snapshots","readwrite").put(s);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
const delSnap=i=>new Promise((res,rej)=>{const r=tx("snapshots","readwrite").delete(i);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
const allSnaps=()=>new Promise((res,rej)=>{const r=tx("snapshots","readonly").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});

/* ===========================================================================
   MODEL
   One node type. v2 adds: dependsOn, dependencyMode, timeframe, icon, color,
   notify. All optional; a v1 export imports cleanly (newNode fills defaults).
   =========================================================================== */
function newNode(p={}){ return Object.assign({
  id:uid(), parentId:null, order:Date.now(), title:"", notes:"",
  kind:"task", childMode:"parallel",
  status:"available", waitingOn:null, followUpDate:null,
  importance:"normal", importanceOverridden:false,
  deadline:null, deadlineType:null, expiry:null, deferUntil:null,
  durationMode:"none", estMinMinutes:null, estMaxMinutes:null,
  fixedStart:null, fixedEnd:null, actualMinutes:null,
  category:null, deliverable:null, context:null, energy:null,
  flagged:false, bumpCount:0, recurrence:null, links:[],
  dependsOn:[], dependencyMode:"none",
  timeframe:null, icon:null, color:null, notify:null, deadlineHasTime:false, background:false,
  createdAt:nowISO(), touchedAt:nowISO(), completedAt:null },p); }

const PALETTE=["#007AFF","#34C759","#FF9500","#FF3B30","#AF52DE","#30B0C7","#FFCC00","#FF2D55","#8E8E93","#5856D6","#A2845E","#32ADE6"];
const CAT_ICONS=["🏠","💼","❤️","💪","🎓","💰","📋","📚","👥","✈️","🛒","🎨","🔧","🌱","🐾","⚽","🎵","🍽","💊","📱"];
const TASK_ICONS=["✅","📌","📞","✉️","📝","🛒","💡","🔑","🚗","📦","🧾","🩺","🧹","🎁","⏱","📣","🔨","💻","📖","🏦",
  "🗓","☎️","🧠","🪴","🎯","✂️","🖨","🧺","🍳","🚿","💳","🗑","🔋","🧯","🛠","🧳","🐕","👟","🎮","🎬"];

const DEFAULTS={
  categories:[{name:"Home",icon:"🏠",color:"#34C759"},{name:"Work",icon:"💼",color:"#007AFF"},
    {name:"Health",icon:"❤️",color:"#FF3B30"},{name:"Finance",icon:"💰",color:"#FFCC00"},
    {name:"Admin",icon:"📋",color:"#8E8E93"},{name:"Learning",icon:"📚",color:"#AF52DE"},
    {name:"People",icon:"👥",color:"#30B0C7"}],
  deliverables:["Decision","Document","Research","Meeting","Message","Call","Errand","Purchase","Sketch","Habit"],
  contexts:["@anywhere","@phone","@computer","@errand","@home","@out"],
  unavailable:[], deepWindows:[],
  sleep:{bed:"23:00",wake:"07:00",perDay:{},ics:false},
  theme:{id:"system",mode:"auto",hideTaskIcons:false,bgDim:.35,hasBg:false},
  notif:{master:true,offsets:[60],atTime:"09:00",
    quiet:{useSleep:true,from:"22:00",to:"08:00"},
    types:{deadline:true,fixed:true,followup:true,morning:false,weekly:true,backup:true},
    morningAt:"08:30",perCategory:{},perGroup:{}},
  lastExport:null
};
function mergeDefaults(s){
  const out=Object.assign({},DEFAULTS,s||{});
  out.sleep=Object.assign({},DEFAULTS.sleep,(s&&s.sleep)||{});
  out.theme=Object.assign({},DEFAULTS.theme,(s&&s.theme)||{});
  out.notif=Object.assign({},DEFAULTS.notif,(s&&s.notif)||{});
  out.notif.quiet=Object.assign({},DEFAULTS.notif.quiet,(s&&s.notif&&s.notif.quiet)||{});
  out.notif.types=Object.assign({},DEFAULTS.notif.types,(s&&s.notif&&s.notif.types)||{});
  out.notif.perCategory=(s&&s.notif&&s.notif.perCategory)||{};
  out.notif.perGroup=(s&&s.notif&&s.notif.perGroup)||{};
  /* v1 stored categories as plain strings — upgrade them to objects */
  out.categories=(out.categories||[]).map((c,i)=>typeof c==="string"
    ? {name:c,icon:CAT_ICONS[i%CAT_ICONS.length],color:PALETTE[i%PALETTE.length]} : c);
  /* v2.0/v2.1 stored schedule anchors — upgrade to the sleep-derived model */
  for(const k of ["dayStart","dayEnd","deepEnd","shallowStart"])
    if(typeof out[k]==="number") out[k]=String(clamp(Math.round(out[k]),0,23)).padStart(2,"0")+":00";
  if(!Array.isArray(out.unavailable)) out.unavailable=[];
  if(!(s&&Array.isArray(s.deepWindows)))                 /* nothing saved yet */
    out.deepWindows=out.deepEnd?[{from:(out.sleep&&out.sleep.wake)||"07:00",to:out.deepEnd}]
                               :(Array.isArray(out.deepWindows)?out.deepWindows:[]);
  for(const k of ["availableHours","dayStart","dayEnd","deepEnd","shallowStart"]) delete out[k];
  return out;
}
const catByName=n=>state.settings.categories.find(c=>c.name===n)||null;

const state={
  nodes:new Map(), settings:mergeDefaults(null), dayHours:{}, filters:[],
  tab:"today", path:[], showDone:true, openSwipe:null,
  editing:null, draft:null, pressTimer:null,
  calMode:"month", calCursor:startOfDay(new Date()), calSel:startOfDay(new Date()),
  layers:{fixed:true,deadline:true,projected:true},
  activeFilter:null, browseMode:"all", browseCat:null, browseCtx:null, search:"",
  logMode:"activity", logMonth:startOfDay(new Date()),
  capDraft:null, capSubs:[], snaps:[], lastBannerCheck:Date.now(), sheetStack:[]
};

const byId=id=>state.nodes.get(id);
function childrenOf(p){ const o=[]; for(const n of state.nodes.values()) if(n.parentId===p) o.push(n);
  o.sort((a,b)=>a.order-b.order||a.createdAt.localeCompare(b.createdAt)); return o; }
function descendants(id,acc=[]){ for(const c of childrenOf(id)){acc.push(c);descendants(c.id,acc);} return acc; }
function ancestors(id){ const o=[]; let c=byId(id); while(c&&c.parentId){ const p=byId(c.parentId); if(!p)break; o.push(p); c=p; } return o; }
function isDescendantOf(id,anc){ let c=byId(id); while(c&&c.parentId){ if(c.parentId===anc)return true; c=byId(c.parentId);} return false; }
function pathLabel(id){ if(id===null)return "Browse"; if(id===UNSORTED)return "Unsorted";
  const n=byId(id); return n?(n.title||"Untitled"):"Browse"; }
function fullPath(id){ if(!id||id===UNSORTED) return pathLabel(id);
  const chain=ancestors(id).reverse().map(a=>a.title||"Untitled");
  chain.push(pathLabel(id)); return chain.join(" › "); }
function progressOf(id){ const k=descendants(id).filter(n=>n.status!=="dropped"&&n.kind==="task");
  if(!k.length)return null; return {done:k.filter(n=>n.status==="done").length,total:k.length}; }

async function save(n){ n.touchedAt=nowISO(); state.nodes.set(n.id,n); await putNode(n); }
async function create(p){ const n=newNode(p); state.nodes.set(n.id,n); await putNode(n); return n; }
async function purge(id){ for(const d of descendants(id)){state.nodes.delete(d.id);await delNode(d.id);}
  state.nodes.delete(id); await delNode(id);
  /* clean dangling dependency references */
  for(const n of state.nodes.values()){
    if(n.dependsOn&&n.dependsOn.length){
      const f=n.dependsOn.filter(x=>state.nodes.has(x));
      if(f.length!==n.dependsOn.length){ n.dependsOn=f; if(!f.length)n.dependencyMode="none"; await putNode(n); }
    }
  }
}
function nextOrder(parentId){ const s=childrenOf(parentId); return s.length?s[s.length-1].order+1000:Date.now(); }
async function saveSettings(){ await putMeta("settings",state.settings); await putMeta("dayHours",state.dayHours);
  await putMeta("filters",state.filters); }

/* ===========================================================================
   SLEEP SCHEDULE
   A property of the day, not a task. Bedtime/wake with per-weekday overrides.
   Waking span caps available hours; Day/Week views dim the sleep zones.
   =========================================================================== */
function sleepFor(d){
  const s=state.settings.sleep, dow=new Date(d).getDay();
  const o=(s.perDay&&s.perDay[dow])||{};
  return {bed:o.bed||s.bed||"23:00", wake:o.wake||s.wake||"07:00"};
}
function wakeSpanMin(d){
  const s=sleepFor(d);
  let span=hmToMin(s.bed)-hmToMin(s.wake);
  if(span<=0) span+=1440;              /* bed after midnight */
  return clamp(span,0,1440);
}
/* recurring unavailable blocks (commute, meals, practice…) hitting a given day */
function unavailFor(d){
  const dow=new Date(d).getDay();
  return (state.settings.unavailable||[])
    .filter(u=>u.from&&u.to&&(!u.days||!u.days.length||u.days.includes(dow)))
    .map(u=>{ let a=hmToMin(u.from), b=hmToMin(u.to); if(b<=a) b+=1440;
      return {label:u.label||"Unavailable",from:a,to:b}; })
    .sort((a,b)=>a.from-b.from);
}
/* capacity is COMPUTED, never entered: waking span minus unavailable blocks.
   A per-date override from the Calendar tab still wins. */
function hoursFor(d){
  const k=dayKey(d);
  if(state.dayHours[k]!=null) return Math.min(state.dayHours[k], wakeSpanMin(d)/60);
  const sl=sleepFor(d);
  const wake=hmToMin(sl.wake); let bedAbs=hmToMin(sl.bed); if(bedAbs<=wake) bedAbs+=1440;
  let span=bedAbs-wake;
  for(const u of unavailFor(d)){ const a=Math.max(u.from,wake), b=Math.min(u.to,bedAbs);
    if(b>a) span-=b-a; }
  return clamp(span,0,1440)/60;
}
/* what is genuinely left of TODAY: from now to bed, minus unavailable still ahead */
function hoursLeftToday(){
  const d=new Date(), sl=sleepFor(d);
  const wake=hmToMin(sl.wake); let bedAbs=hmToMin(sl.bed); if(bedAbs<=wake) bedAbs+=1440;
  const from=Math.max(d.getHours()*60+d.getMinutes(), wake);
  if(from>=bedAbs) return 0;
  let span=bedAbs-from;
  for(const u of unavailFor(d)){ const a=Math.max(u.from,from), b=Math.min(u.to,bedAbs);
    if(b>a) span-=b-a; }
  return clamp(span,0,1440)/60;
}
/* deep-focus windows: user-defined, any time of day (late night welcome) */
function inDeepWindow(m){ const ws=state.settings.deepWindows||[];
  return ws.some(w=>{ let a=hmToMin(w.from), b=hmToMin(w.to); if(b<=a) b+=1440; return m>=a&&m<b; }); }
function nextDeepStart(m){
  const st=(state.settings.deepWindows||[]).map(w=>hmToMin(w.from)).filter(a=>a>m).sort((x,y)=>x-y);
  return st.length?st[0]:null; }
/* a task's display color: its own, else its category's, else nearest ancestor's */
function nodeColor(n){
  if(n.color) return n.color;
  let c=n.category&&catByName(n.category); if(c&&c.color) return c.color;
  for(const a of ancestors(n.id)){ if(a.color) return a.color;
    c=a.category&&catByName(a.category); if(c&&c.color) return c.color; }
  return null;
}

/* ===========================================================================
   COMPUTE LAYER — kept from v1, extended with dependencies + timeframes.
   Urgency is never stored. It is derived from the clock on every render.
   =========================================================================== */
const IMPORTANCE={critical:10,high:6,normal:3,low:1};
const IMP_LABEL={critical:"Critical",high:"High",normal:"Normal",low:"Low"};

function effImportance(n){
  let c=n, guard=0;
  while(c && guard++<64){
    if(c.importanceOverridden) return c.importance;
    if(!c.parentId) break;
    c=byId(c.parentId);
  }
  return "normal";
}
function importanceSource(n){
  if(n.importanceOverridden) return null;
  let c=n, guard=0;
  while(c && c.parentId && guard++<64){ c=byId(c.parentId); if(!c)break; if(c.importanceOverridden) return c; }
  return null;
}
function remainingMinutes(n){
  let t=(n.status==="done"||n.status==="dropped")?0:(n.estMaxMinutes||0);
  for(const d of descendants(n.id)) if(d.status!=="done"&&d.status!=="dropped") t+=(d.estMaxMinutes||0);
  return t;
}
function minMinutes(n){ return n.estMinMinutes!=null?n.estMinMinutes:(n.estMaxMinutes||0); }

/* sequential gating: in an ordered group, only the first unfinished child counts */
function isGated(n){
  if(!n.parentId) return false;
  const p=byId(n.parentId);
  if(!p||p.childMode!=="sequential") return false;
  const sibs=childrenOf(p.id).filter(s=>s.status!=="done"&&s.status!=="dropped");
  if(!sibs.length) return false;
  if(sibs[0].id!==n.id) return true;
  return isGated(p);
}

/* ---- dependencies (v2) ----
   required: blocked until every dependency is done. Visible, never in
   Today's actionable bands. soft: still actionable, ranked lower. */
function openDeps(n){
  if(!n.dependsOn||!n.dependsOn.length||n.dependencyMode==="none") return [];
  return n.dependsOn.map(byId).filter(d=>d&&d.status!=="done"&&d.status!=="dropped");
}
function depBlocked(n){ return n.dependencyMode==="required" && openDeps(n).length>0; }
function softDeps(n){ return n.dependencyMode==="soft" ? openDeps(n) : []; }
function dependents(id){ const o=[]; for(const n of state.nodes.values())
  if(n.dependsOn&&n.dependsOn.includes(id)&&n.dependencyMode!=="none") o.push(n); return o; }
/* would adding candidate as a dependency of nodeId create a cycle?
   yes if candidate (transitively) depends on nodeId. Returns the cycle path. */
function findCycle(nodeId,candId){
  const seen=new Set();
  function walk(id,trail){
    if(id===nodeId) return trail.concat(id);
    if(seen.has(id)) return null;
    seen.add(id);
    const n=byId(id); if(!n||!n.dependsOn) return null;
    for(const d of n.dependsOn){ const r=walk(d,trail.concat(id)); if(r) return r; }
    return null;
  }
  return walk(candId,[]);
}

function ancestorBlocked(n){
  for(const a of ancestors(n.id)){
    if(a.status==="waiting"||a.status==="someday"||a.status==="dropped") return a;
    if(a.deferUntil && new Date(a.deferUntil)>new Date()) return a;
    if(isGated(a)||depBlocked(a)) return a;
  }
  return null;
}
function effStatus(n){
  if(n.status==="done"||n.status==="dropped") return n.status;
  if(n.status==="someday") return "someday";
  if(n.status==="waiting") return "waiting";
  if(n.deferUntil && new Date(n.deferUntil)>new Date()) return "deferred";
  if(depBlocked(n)) return "blocked";
  if(isGated(n)) return "blocked";
  if(ancestorBlocked(n)) return "blocked";
  return "available";
}
function slackHours(n){
  if(!n.deadline) return null;
  return (new Date(n.deadline)-Date.now())/HOUR - remainingMinutes(n)/60;
}
function urgencyMult(n){
  const s=slackHours(n);
  if(s===null) return 1.0;
  let m = s<0?5.0 : s<24?3.0 : s<72?2.0 : s<168?1.4 : 1.1;
  if(n.deadlineType==="soft") m = m - (m-1)*0.3;
  return m;
}
function staleness(n){
  const d=(Date.now()-new Date(n.touchedAt))/DAY;
  return clamp(d*0.05,0,1.0);
}
/* SCORE = importance × urgency-from-slack + staleness (kept from v1).
   v2: an open soft dependency halves the score — it can be done now, but
   doing its prerequisite first is usually the better use of the hour. */
function score(n){
  let s=IMPORTANCE[effImportance(n)] * urgencyMult(n) + staleness(n);
  if(softDeps(n).length) s*=0.5;
  return s;
}
function explain(n,rank){
  const bits=[];
  if(rank) bits.push("Ranked #"+rank);
  if(n.deadline){
    const s=slackHours(n);
    const kind=n.deadlineType==="soft"?"soft deadline":"hard deadline";
    const d=(new Date(n.deadline)-Date.now())/HOUR;
    bits.push(d<0 ? kind+" passed "+Math.abs(Math.round(d/24))+"d ago"
                  : kind+" "+(d<24?"in "+Math.round(d)+"h":"in "+Math.round(d/24)+"d"));
    if(remainingMinutes(n)>0) bits.push(mins(remainingMinutes(n))+" of work left, "+
      (s<0?"already short on time":Math.round(s)+"h of slack"));
  } else if(n.timeframe) bits.push("aimed at "+tfLabel(n.timeframe)+", no date yet");
  else bits.push("no deadline");
  const src=importanceSource(n);
  bits.push(IMP_LABEL[effImportance(n)]+(src?" (from "+(src.title||"parent")+")":""));
  const st=effStatus(n);
  bits.push(st==="available"?"unblocked":statusLabel(st).toLowerCase());
  const sd=softDeps(n);
  if(sd.length) bits.push("ranked lower until after "+sd.map(d=>d.title||"Untitled").join(", "));
  const rq=n.dependencyMode==="required"?openDeps(n):[];
  if(rq.length) bits.push("blocked by "+rq.map(d=>d.title||"Untitled").join(", "));
  if(n.flagged) bits.push("flagged for today");
  if(staleness(n)>0.3) bits.push("untouched "+Math.round((Date.now()-new Date(n.touchedAt))/DAY)+" days");
  return bits.join(" · ");
}
function statusLabel(s){ return {available:"Available",waiting:"Waiting on",deferred:"Deferred",
  someday:"Someday",done:"Done",dropped:"Dropped",blocked:"Blocked"}[s]||s; }

function isStalled(n){
  if(n.kind!=="group") return false;
  const kids=descendants(n.id).filter(d=>d.kind==="task"&&d.status!=="done"&&d.status!=="dropped");
  if(!kids.length) return false;
  return !kids.some(k=>effStatus(k)==="available");
}

/* ---- expiry sweep: past its expiry a task is moot, not late ---- */
async function sweepExpiry(){
  let n=0;
  for(const x of state.nodes.values()){
    if(x.expiry && x.status!=="done" && x.status!=="dropped" && new Date(x.expiry)<new Date()){
      x.status="dropped";
      x.notes=(x.notes?x.notes+"\n":"")+"Expired "+fmtDate(x.expiry)+" — dropped automatically.";
      await save(x); n++;
    }
  }
  return n;
}

/* ===========================================================================
   FUZZY TIMEFRAMES (v2)
   A commitment to a period, not a date. Never on a calendar day, never in
   Today. Surfaces on the month banner, the month overview, and the weekly
   review once its window is close.
   =========================================================================== */
const SEASONS={spring:[2,3,4],summer:[5,6,7],fall:[8,9,10],winter:[11,0,1]};
const SEASON_LABEL={spring:"Spring",summer:"Summer",fall:"Fall",winter:"Winter"};
function tfLabel(tf){
  if(!tf) return "";
  if(tf.type==="month"){ const [y,m]=tf.value.split("-");
    return new Date(+y,+m-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"}); }
  if(tf.type==="season"){ const [y,s]=tf.value.split("-"); return SEASON_LABEL[s]+" "+y; }
  if(tf.type==="quarter"){ const [y,q]=tf.value.split("-"); return q.toUpperCase()+" "+y; }
  return tf.value;
}
/* months covered, as [{y,m}] with m 0-based */
function tfMonths(tf){
  if(!tf) return [];
  if(tf.type==="month"){ const [y,m]=tf.value.split("-").map(Number); return [{y,m:m-1}]; }
  if(tf.type==="season"){ const [ys,s]=tf.value.split("-"); const y=+ys;
    return SEASONS[s].map(m=>({y:(s==="winter"&&m<11)?y+1:y,m})); }
  if(tf.type==="quarter"){ const [ys,q]=tf.value.split("-"); const y=+ys, q0=(+q.slice(1)-1)*3;
    return [0,1,2].map(i=>({y,m:q0+i})); }
  const y=+tf.value; return Array.from({length:12},(_,m)=>({y,m}));
}
function tfStart(tf){ const ms=tfMonths(tf); if(!ms.length)return null;
  const f=ms.reduce((a,b)=>(a.y*12+a.m)<=(b.y*12+b.m)?a:b); return new Date(f.y,f.m,1); }
function tfEnd(tf){ const ms=tfMonths(tf); if(!ms.length)return null;
  const l=ms.reduce((a,b)=>(a.y*12+a.m)>=(b.y*12+b.m)?a:b); return new Date(l.y,l.m+1,0,23,59); }
function tfInMonth(tf,y,m){ return tfMonths(tf).some(x=>x.y===y&&x.m===m); }
function timeframeItems(){ return Array.from(state.nodes.values())
  .filter(n=>n.timeframe&&!n.deadline&&n.status!=="done"&&n.status!=="dropped"); }

/* ===========================================================================
   CAPACITY, BANDS, PROJECTION — kept from v1, deps-aware, sleep-aware.
   =========================================================================== */
function fixedOn(d){ return Array.from(state.nodes.values())
  .filter(n=>n.fixedStart && sameDay(n.fixedStart,d) && n.status!=="dropped")
  .sort((a,b)=>new Date(a.fixedStart)-new Date(b.fixedStart)); }

function todayBands(){
  const all=Array.from(state.nodes.values()).filter(n=>n.kind==="task"&&n.id!==UNSORTED);
  const open=all.filter(n=>n.status!=="done"&&n.status!=="dropped");
  const now=new Date();

  const fixed=open.filter(n=>n.fixedStart&&sameDay(n.fixedStart,now))
    .sort((a,b)=>new Date(a.fixedStart)-new Date(b.fixedStart));
  const fixedIds=new Set(fixed.map(n=>n.id));

  /* timeframe-only items never pollute Today */
  const actionable=open.filter(n=>!fixedIds.has(n.id)&&effStatus(n)==="available"&&!(n.timeframe&&!n.deadline));
  const waiting=open.filter(n=>n.status==="waiting"||effStatus(n)==="waiting");
  const blocked=open.filter(n=>effStatus(n)==="blocked"&&(n.dependencyMode==="required"&&openDeps(n).length));

  const isDue=n=>n.deadline && startOfDay(n.deadline)<=startOfDay(now);
  const must=actionable.filter(n=>n.flagged||isDue(n)).sort((a,b)=>score(b)-score(a));
  const mustIds=new Set(must.map(n=>n.id));
  const rest=actionable.filter(n=>!mustIds.has(n.id)).sort((a,b)=>score(b)-score(a));
  const should=rest.slice(0,7);
  const shouldIds=new Set(should.map(n=>n.id));
  const quick=rest.filter(n=>!shouldIds.has(n.id)&&minMinutes(n)>0&&minMinutes(n)<=10).slice(0,8);

  const committed=[...fixed,...must,...should].reduce((t,n)=>{
    if(n.background) return t;                       /* runs alongside — costs no attention */
    if(n.fixedStart&&n.fixedEnd){                    /* only the part still ahead counts */
      const rem=(new Date(n.fixedEnd)-Math.max(new Date(n.fixedStart),now))/MIN;
      return t+Math.max(0,rem); }
    return t+(n.estMaxMinutes||0); },0);

  const doneToday=all.filter(n=>n.completedAt&&sameDay(n.completedAt,now));
  return {fixed,must,should,waiting,blocked,quick,committed,doneToday,actionable};
}

/* projected work: spread each deadlined task's remaining effort back from its
   deadline across the days it can actually be worked on (capacity-aware,
   sleep already subtracted by hoursFor) */
function projection(){
  const map={};
  const nodes=Array.from(state.nodes.values())
    .filter(n=>n.kind==="task"&&n.status!=="done"&&n.status!=="dropped"&&n.deadline&&!n.fixedStart&&(n.estMaxMinutes||0)>0)
    .sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));
  const used={};
  for(const n of nodes){
    let left=n.estMaxMinutes||0;
    const end=startOfDay(n.deadline);
    let earliest=startOfDay(new Date());
    if(n.deferUntil && startOfDay(n.deferUntil)>earliest) earliest=startOfDay(n.deferUntil);
    const days=[]; for(let d=new Date(end); d>=earliest; d=addDays(d,-1)) days.push(new Date(d));
    if(!days.length) days.push(earliest);
    for(const d of days){
      if(left<=0) break;
      const k=dayKey(d);
      const cap=hoursFor(d)*60;
      const free=Math.max(0,cap-(used[k]||0));
      if(free<=0) continue;
      const put=Math.min(free,left);
      used[k]=(used[k]||0)+put; left-=put;
      (map[k]=map[k]||[]).push({node:n,minutes:put});
    }
    if(left>0){ const k=dayKey(days[days.length-1]||earliest);
      used[k]=(used[k]||0)+left; (map[k]=map[k]||[]).push({node:n,minutes:left,over:true}); }
  }
  return map;
}
function loadOn(d,proj){
  const k=dayKey(d);
  let m=0;
  for(const f of fixedOn(d)) if(f.fixedEnd&&!f.background) m+=(new Date(f.fixedEnd)-new Date(f.fixedStart))/MIN;
  for(const p of (proj[k]||[])) m+=p.minutes;
  return m;
}

/* ===========================================================================
   PLAN ENGINE — one placer for Today, the Calendar Day view and the Week
   columns. Recomputed live on every render; never stored.
   For today: the full ranked queue (must + should), laid out from now.
   For any other day: that day's fixed blocks, its slice of projected work,
   and anything due that day, laid into free waking time.
   Deep-focus work is steered into the user-set deep windows; sleep and
   unavailable blocks are never booked over; background blocks never obstruct.
   Tasks without an estimate are "fuzzy": planned at a soft 30m guess.
   =========================================================================== */
function planFor(day,proj){
  day=day||new Date();
  const sl=sleepFor(day);
  const wake=hmToMin(sl.wake), bed=hmToMin(sl.bed);
  const bedAbs=bed<=wake?bed+1440:bed;
  const d0=startOfDay(day);
  const isToday=sameDay(day,new Date());
  const end=new Date(d0.getTime()+bedAbs*MIN);   /* the day simply runs wake → bed */

  /* unavailable blocks: obstacles the planner routes around, shown on the day */
  const unavail=unavailFor(day).map(u=>({
    start:new Date(d0.getTime()+Math.max(u.from,wake)*MIN),
    end:new Date(d0.getTime()+Math.min(u.to,bedAbs)*MIN),
    minutes:0,unavail:true,label:u.label}))
    .filter(u=>u.end>u.start);
  for(const u of unavail) u.minutes=Math.round((u.end-u.start)/MIN);

  const fixed=fixedOn(day).filter(n=>n.status!=="done")
    .map(n=>({node:n,start:new Date(n.fixedStart),
      end:n.fixedEnd?new Date(n.fixedEnd):new Date(new Date(n.fixedStart).getTime()+30*MIN),
      minutes:0,fixed:true,bg:!!n.background}))
    .sort((a,b)=>a.start-b.start);
  for(const f of fixed) f.minutes=Math.round((f.end-f.start)/MIN);

  /* background blocks (laundry, dishwasher…) are NOT obstacles: work overlaps them */
  const busy=[...fixed.filter(f=>!f.bg),...unavail].sort((a,b)=>a.start-b.start);

  let cursor=new Date(d0.getTime()+wake*MIN);
  if(isToday&&cursor<new Date()) cursor=new Date(Math.ceil(Date.now()/(15*MIN))*(15*MIN));

  /* build the queue */
  let items=[];
  if(isToday){
    const b=todayBands();
    items=[...b.must,...b.should].filter(n=>!n.fixedStart)
      .map(n=>({node:n,minutes:n.estMaxMinutes||30,fuzzy:!n.estMaxMinutes}));
  }else{
    const k=dayKey(day);
    const seen=new Set();
    for(const p of ((proj&&proj[k])||[])){ seen.add(p.node.id);
      items.push({node:p.node,minutes:p.minutes,over:p.over,fuzzy:false,slice:p.minutes<(p.node.estMaxMinutes||0)}); }
    for(const n of state.nodes.values()){
      if(n.kind!=="task"||seen.has(n.id)||n.fixedStart) continue;
      if(n.status==="done"||n.status==="dropped") continue;
      if(n.deadline&&sameDay(n.deadline,day)) items.push({node:n,minutes:n.estMaxMinutes||30,fuzzy:!n.estMaxMinutes});
    }
  }
  /* due-time constraint */
  for(const it of items){
    const n=it.node;
    if(n.deadline&&n.deadlineHasTime&&sameDay(n.deadline,day)){
      const dl=new Date(n.deadline); it.dueBy=dl; }
  }
  /* ordering: hard due-times first, then deadline, then score */
  items.sort((x,y)=>{
    if(!!x.dueBy!==!!y.dueBy) return x.dueBy?-1:1;
    if(x.dueBy&&y.dueBy) return x.dueBy-y.dueBy;
    const dx=x.node.deadline?new Date(x.node.deadline):null, dy=y.node.deadline?new Date(y.node.deadline):null;
    if(dx&&dy&&dx-dy!==0) return dx-dy;
    if(dx&&!dy) return -1; if(dy&&!dx) return 1;
    return score(y.node)-score(x.node);
  });

  const overlaps=(a,b)=>busy.find(f=>a<f.end&&b>f.start);
  const hasWindows=(state.settings.deepWindows||[]).length>0;
  const placed=[], unplaced=[];
  for(const it of items){
    let ok=false, guard=0, c2=new Date(cursor), triedDeep=false;
    while(!ok&&guard++<64){
      if(c2>=end) break;
      const cm=Math.round((c2-d0)/MIN)%1440;
      /* steer deep-focus work into the user's chosen windows (any hour, incl. night) */
      if(it.node.energy==="deep"&&!it.dueBy&&hasWindows&&!inDeepWindow(cm)&&!triedDeep){
        const nx=nextDeepStart(cm);
        if(nx!=null){ c2=new Date(d0.getTime()+nx*MIN); triedDeep=true; continue; }
        triedDeep=true;                        /* no window left — place it anywhere */
      }
      const fin=new Date(c2.getTime()+it.minutes*MIN);
      const hit=overlaps(c2,fin);
      if(hit){ c2=new Date(hit.end.getTime()+10*MIN); continue; }
      if(fin>end) break;
      it.start=c2; it.end=fin;
      if(it.dueBy&&fin>it.dueBy) it.late=true;
      placed.push(it);
      /* deep-window placements shouldn't drag ordinary work to that hour */
      if(!(it.node.energy==="deep"&&triedDeep)) cursor=new Date(fin.getTime()+10*MIN);
      ok=true;
    }
    if(!ok) unplaced.push(it);
  }
  const all=[...unavail,...fixed,...placed].sort((a,b)=>a.start-b.start);
  return {blocks:all,unplaced,end,fixedCount:fixed.length};
}

/* side-by-side lanes for overlapping calendar blocks (meeting over laundry).
   Standard interval layout: greedy lane assignment inside each overlap cluster. */
function layoutLanes(list){
  const bs=list.slice().sort((a,b)=>a.start-b.start||b.end-a.end);
  let cluster=[], laneEnds=[], clusterEnd=-1;
  const finish=cl=>{ if(!cl.length) return; const n=Math.max(...cl.map(x=>x.lane+1));
    cl.forEach(x=>{x.lanes=n;}); };
  for(const b of bs){
    if(cluster.length&&b.start>=clusterEnd){ finish(cluster); cluster=[]; laneEnds=[]; clusterEnd=-1; }
    let li=laneEnds.findIndex(e=>e<=b.start);
    if(li<0){ li=laneEnds.length; laneEnds.push(b.end); } else laneEnds[li]=b.end;
    b.lane=li; cluster.push(b); clusterEnd=Math.max(clusterEnd,+b.end);
  }
  finish(cluster);
  return bs;
}

/* ===========================================================================
   NOTIFICATIONS
   Honest model: Safari cannot fire a scheduled local notification for a
   future time without a push server, and a push server would break the
   local-only rule. So: full control center + in-app banners while open +
   calendar-delivered alerts via the maintained .ics export (VEVENT+VALARM).
   =========================================================================== */
/* resolve a task's effective notification config:
   task.notify → nearest ancestor group default → category default → off */
function effNotify(n){
  if(n.notify) return n.notify.enabled?withOffsets(n.notify):{enabled:false};
  const pg=state.settings.notif.perGroup;
  let c=n;
  while(c&&c.parentId){
    if(pg[c.parentId]) return pg[c.parentId].enabled?withOffsets(pg[c.parentId]):{enabled:false};
    c=byId(c.parentId); if(!c) break;
  }
  const pc=state.settings.notif.perCategory;
  if(n.category&&pc[n.category]) return pc[n.category].enabled?withOffsets(pc[n.category]):{enabled:false};
  return {enabled:false};
}
function withOffsets(cfg){
  return {enabled:true,
    offsets:(cfg.offsets&&cfg.offsets.length)?cfg.offsets:state.settings.notif.offsets,
    atTime:cfg.atTime||state.settings.notif.atTime};
}
function offsetLabel(m){
  if(m===0) return "at the time";
  if(m<60) return m+" min before";
  if(m<1440) return (m/60)+(m===60?" hour":" hours")+" before";
  return (m/1440)+(m===1440?" day":" days")+" before";
}
/* everything that would fire in the next `days` days */
function scheduledAlerts(days=14){
  const nf=state.settings.notif, out=[];
  if(!nf.master) return out;
  const now=Date.now(), horizon=now+days*DAY;
  for(const n of state.nodes.values()){
    if(n.status==="done"||n.status==="dropped") continue;
    const cfg=effNotify(n);
    if(nf.types.deadline&&n.deadline&&cfg.enabled){
      let base=new Date(n.deadline);
      if(!n.deadlineHasTime){
        const [h,m]=(cfg.atTime||"09:00").split(":"); base=new Date(base); base.setHours(+h,+m,0,0);
      }
      for(const off of cfg.offsets){
        const ts=base.getTime()-off*MIN;
        if(ts>now-HOUR&&ts<horizon) out.push({ts,type:"deadline",icon:"⏰",id:n.id,
          title:n.title||"Untitled",sub:"Due "+relDay(n.deadline)+(off?" · "+offsetLabel(off):"")});
      }
    }
    if(nf.types.fixed&&n.fixedStart&&cfg.enabled){
      for(const off of cfg.offsets){
        const ts=new Date(n.fixedStart).getTime()-off*MIN;
        if(ts>now-HOUR&&ts<horizon) out.push({ts,type:"fixed",icon:"📍",id:n.id,
          title:n.title||"Untitled",sub:"Starts "+fmtTime(n.fixedStart)+(off?" · "+offsetLabel(off):"")});
      }
    }
    if(nf.types.followup&&n.status==="waiting"&&n.followUpDate){
      const ts=new Date(n.followUpDate).getTime();
      if(ts>now-HOUR&&ts<horizon) out.push({ts,type:"followup",icon:"👋",id:n.id,
        title:"Follow up: "+(n.title||"Untitled"),sub:n.waitingOn?"Waiting on "+n.waitingOn:"Time to chase"});
    }
  }
  if(nf.types.morning){
    for(let i=0;i<days;i++){
      const d=addDays(new Date(),i); const [h,m]=(nf.morningAt||"08:30").split(":");
      const ts=startOfDay(d).getTime()+(+h*60+ +m)*MIN;
      if(ts>now) out.push({ts,type:"morning",icon:"☀️",title:"Morning summary",sub:"Open Today for the plan"});
    }
  }
  if(nf.types.weekly){
    for(let i=0;i<days;i++){
      const d=addDays(new Date(),i);
      if(d.getDay()===0){ const ts=startOfDay(d).getTime()+18*60*MIN;
        if(ts>now) out.push({ts,type:"weekly",icon:"🧭",title:"Weekly review",sub:"Log › Weekly review"}); }
    }
  }
  if(nf.types.backup&&backupDue()){
    out.push({ts:now+5*MIN,type:"backup",icon:"💾",title:"Backup reminder",
      sub:"Export a copy off this phone — Settings › Backups"});
  }
  out.sort((a,b)=>a.ts-b.ts);
  return out;
}
function inQuietHours(ts){
  const q=state.settings.notif.quiet;
  const d=new Date(ts), m=d.getHours()*60+d.getMinutes();
  let from,to;
  if(q.useSleep){ const s=sleepFor(d); from=hmToMin(s.bed); to=hmToMin(s.wake); }
  else { from=hmToMin(q.from); to=hmToMin(q.to); }
  return from>to ? (m>=from||m<to) : (m>=from&&m<to);
}
/* in-app banner loop: fires alerts whose time passed while the app is open */
let bannerT=null;
function checkBanners(){
  if(!state.settings.notif.master) return;
  const now=Date.now();
  const due=scheduledAlerts(1).filter(a=>a.ts>state.lastBannerCheck&&a.ts<=now&&a.type!=="backup");
  state.lastBannerCheck=now;
  const a=due.find(x=>!inQuietHours(x.ts));
  if(a){
    $("#bIcon").textContent=a.icon; $("#bTitle").textContent=a.title; $("#bSub").textContent=a.sub||"";
    const el=$("#banner"); el.classList.add("on");
    el.onclick=()=>{ el.classList.remove("on"); if(a.id&&byId(a.id)) openNode(a.id); };
    clearTimeout(bannerT); bannerT=setTimeout(()=>el.classList.remove("on"),6000);
  }
}
function backupDue(){
  const last=state.settings.lastExport;
  return !last || (Date.now()-new Date(last))/DAY>=7;
}

/* ===========================================================================
   SNAPSHOTS — automatic rolling backups inside IndexedDB.
   7 daily + 4 weekly. These protect against your mistakes (bad edit, bad
   import, accidental erase), not against losing the phone — that is what
   the weekly share-sheet export is for.
   =========================================================================== */
function exportData(){
  return {format:"tasks-app",schema:SCHEMA,exportedAt:nowISO(),
    settings:state.settings,dayHours:state.dayHours,filters:state.filters,
    nodes:Array.from(state.nodes.values())};
}
async function takeSnapshots(){
  const today=dayKey(new Date()), week=isoWeek(new Date());
  const snaps=await allSnaps();
  const items=state.nodes.size-1;
  if(!snaps.find(s=>s.kind==="daily"&&s.day===today))
    await putSnap({id:"d-"+today,kind:"daily",day:today,ts:nowISO(),items,data:exportData()});
  if(!snaps.find(s=>s.kind==="weekly"&&s.week===week))
    await putSnap({id:"w-"+week,kind:"weekly",week,ts:nowISO(),items,data:exportData()});
  const fresh=await allSnaps();
  const dailies=fresh.filter(s=>s.kind==="daily").sort((a,b)=>b.ts.localeCompare(a.ts));
  const weeklies=fresh.filter(s=>s.kind==="weekly").sort((a,b)=>b.ts.localeCompare(a.ts));
  for(const s of dailies.slice(7)) await delSnap(s.id);
  for(const s of weeklies.slice(4)) await delSnap(s.id);
  state.snaps=(await allSnaps()).sort((a,b)=>b.ts.localeCompare(a.ts));
}
async function restoreSnapshot(id){
  const snaps=await allSnaps(); const s=snaps.find(x=>x.id===id);
  if(!s){ toast("Snapshot not found"); return; }
  if(!confirm("Replace everything with the snapshot from "+new Date(s.ts).toLocaleString()+" ("+s.items+" items)? Current data will be overwritten.")) return;
  for(const nid of Array.from(state.nodes.keys())) await delNode(nid);
  state.nodes.clear();
  for(const n of s.data.nodes){ const m=newNode(n); state.nodes.set(m.id,m); await putNode(m); }
  if(s.data.settings) state.settings=mergeDefaults(s.data.settings);
  state.dayHours=s.data.dayHours||{}; state.filters=s.data.filters||[];
  await saveSettings(); ensureInbox(); applyTheme();
  closeSheet(); render(); toast("Restored "+s.items+" items");
}
async function ensureInbox(){
  if(!state.nodes.has(UNSORTED)){
    const inbox=newNode({id:UNSORTED,kind:"group",title:"Unsorted",order:-1e15});
    state.nodes.set(UNSORTED,inbox); await putNode(inbox);
  }
}
