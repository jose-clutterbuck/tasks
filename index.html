/* timeframe picker */
function openTimeframe(cur,cb){
  const cfg={cur,cb};
  sheetPush(()=>drawTimeframe(cfg));
}
function drawTimeframe(cfg){
  const cur=cfg.cur;
  const now=new Date(), opts=[];
  for(let i=0;i<12;i++){ const d=new Date(now.getFullYear(),now.getMonth()+i,1);
    opts.push({v:"month|"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),
      l:d.toLocaleDateString(undefined,{month:"long",year:"numeric"}),g:"Month"}); }
  const seasons=["spring","summer","fall","winter"];
  let sy=now.getFullYear(), si=Math.floor(((now.getMonth()+1)%12)/3);
  for(let i=0;i<4;i++){ const s=seasons[(si+i)%4]; const y=sy+Math.floor((si+i)/4);
    opts.push({v:"season|"+y+"-"+s,l:SEASON_LABEL[s]+" "+y,g:"Season"}); }
  const q0=Math.floor(now.getMonth()/3);
  for(let i=0;i<4;i++){ const q=(q0+i)%4, y=now.getFullYear()+Math.floor((q0+i)/4);
    opts.push({v:"quarter|"+y+"-q"+(q+1),l:"Q"+(q+1)+" "+y,g:"Quarter"}); }
  opts.push({v:"year|"+now.getFullYear(),l:String(now.getFullYear()),g:"Year"});
  opts.push({v:"year|"+(now.getFullYear()+1),l:String(now.getFullYear()+1),g:"Year"});
  const curV=cur?cur.type+"|"+cur.value:null;
  let h=`<div class="fieldnote" style="margin:0 20px 12px">Sometime in a period, with no date yet. It shows on the month banner and the weekly review, never on a day, until you give it a real date.</div>
    <div class="group"><button class="pickrow" data-tf=""><span>None</span>${!cur?'<span class="tick">✓</span>':""}</button></div>`;
  let g="";
  for(const o of opts){
    if(o.g!==g){ h+=(g?`</div>`:"")+sec(o.g)+`<div class="group">`; g=o.g; }
    h+=`<button class="pickrow" data-tf="${o.v}"><span>${esc(o.l)}</span>${o.v===curV?'<span class="tick">✓</span>':""}</button>`;
  }
  h+=`</div>`;
  showSheet("Timeframe",h,null);
  sheetBody.querySelectorAll("[data-tf]").forEach(b=>b.addEventListener("click",()=>{
    const v=b.dataset.tf;
    cfg.cur=v?{type:v.split("|")[0],value:v.split("|")[1]}:null;
    cfg.cb(cfg.cur);
    drawTimeframe(cfg);
  }));
}

function openRepeatEditor(d,onChange){

    mode:(r.type==="months"||r.type==="years")?"month":((r.type==="days"&&(r.every||1)>1)||r.mode==="afterDone"||r.type==="years"?"more":"week"),
    days:(r.days||[]).slice(),

    monthMode:(r.nth!=null)?"nth":"dom",

    nth:r.nth!=null?r.nth:1,
    nthDow:r.nthDow!=null?r.nthDow:(d.fixedStart?new Date(d.fixedStart).getDay():new Date().getDay()),
    moreKind:r.mode==="afterDone"?"after":(r.type==="years"?"years":"days"),

     <div class="field" style="margin-top:14px">

  const mo=$("#rpMore"); if(mo) mo.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
    cfg.moreKind=b.dataset.mk; drawRepeatEditor(d,cfg,onChange); }));

  const ndow=$("#rpNthDow"); if(ndow) ndow.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{

    current:String(cfg.nth),onPick:v=>{ cfg.nth=Number(v); }}));
  const ev=$("#rpEvery"); if(ev) ev.addEventListener("input",e=>{ cfg.every=clamp(Number(e.target.value)||1,1,365); });
  const dom=$("#rpDom"); if(dom) dom.addEventListener("input",e=>{ cfg.dayOfMonth=clamp(Number(e.target.value)||1,1,31); });
  $$("#rpEnds button").forEach(b=>b.addEventListener("click",()=>{
    cfg.ends=b.dataset.en;
    if(cfg.ends==="until"&&!cfg.until) cfg.until=startOfDay(addDays(new Date(),90)).toISOString();
    drawRepeatEditor(d,cfg,onChange); }));
  const un=$("#rpUntil"); if(un) un.addEventListener("change",e=>{
    cfg.until=e.target.value?new Date(e.target.value+"T23:59:00").toISOString():null; });
  const ct=$("#rpCount"); if(ct) ct.addEventListener("input",e=>{ cfg.count=clamp(Number(e.target.value)||1,1,200); });
  $("#rpApply").addEventListener("click",()=>{
    let v=null;
    if(cfg.mode==="week"){
      if(!cfg.days.length){ toast("Pick at least one day"); return; }
      v={type:"weeks",every:cfg.every,days:cfg.days};
    } else if(cfg.mode==="month"){
      v=cfg.monthMode==="nth"
        ? {type:"months",every:cfg.every,nth:cfg.nth,nthDow:cfg.nthDow}
        : {type:"months",every:cfg.every,dayOfMonth:cfg.dayOfMonth};
    } else {
      if(cfg.moreKind==="after") v={mode:"afterDone",every:cfg.every};
      else if(cfg.moreKind==="years") v={type:"years",every:cfg.every};
      else v={type:"days",every:cfg.every};
    }
    set(withEnds(v));
    drawRepeatEditor(d,cfg,onChange); toast("Pattern set"); });
}

function pickField(which,d,onChange){

             {v:"normal",l:"Normal"},
             {v:"flexible",l:"Flexible",note:"fine to slip when the day is full; presses less"}],
    current:d.stakesOverridden?d.stakes:null,allowNone:true,
    onPick:v=>{ if(v===null){ d.stakesOverridden=false; d.stakes="normal"; }
      else { d.stakes=v; d.stakesOverridden=true; } Q(); }});
  if(which==="category") return openOptions({title:"Category",

        state.settings.categories.push({name:v,icon:CAT_ICONS[state.settings.categories.length%CAT_ICONS.length],color:PALETTE[state.settings.categories.length%PALETTE.length]});
        await saveSettings(); }
      d.category=v; Q(); }});
  if(which==="deliverable") return openOptions({title:"Deliverable",options:state.settings.deliverables,
    current:d.deliverable,allowNew:true,allowNone:true,
    onPick:async(v,isNew)=>{ if(isNew&&v&&!state.settings.deliverables.includes(v)){ state.settings.deliverables.push(v); await saveSettings(); }
      d.deliverable=v; Q(); }});
  if(which==="context") return openOptions({title:"Where",options:state.settings.contexts,
    current:d.context,allowNew:true,allowNone:true,prefix:"@",
    onPick:async(v,isNew)=>{ if(isNew&&v&&!state.settings.contexts.includes(v)){ state.settings.contexts.push(v); await saveSettings(); }
      d.context=v; Q(); }});
  if(which==="energy") return openOptions({title:"Energy",
    options:[{v:"deep",l:"Deep focus"},{v:"shallow",l:"Shallow"}],current:d.energy,allowNone:true,
    onPick:v=>{ d.energy=v; Q(); }});
  if(which==="status") return openOptions({title:"State",
    options:[{v:"available",l:"Available"},{v:"waiting",l:"Waiting on someone"},
             {v:"someday",l:"Someday, not committed to"},{v:"done",l:"Done"},{v:"dropped",l:"Dropped"}],
    current:d.status,onPick:v=>{ d.status=v; if(v==="done"&&!d.completedAt) d.completedAt=nowISO();
      if(v!=="done") d.completedAt=null; Q(); }});
  if(which==="recurrence") return openOptions({title:"Repeats",
    options:[{v:"none",l:"Never"},{v:"daily",l:"Every day"},{v:"weekdays",l:"Weekdays"},
             {v:"weekly",l:"Every 7 days"},{v:"monthly",l:"Every month"},{v:"after3",l:"3 days after I finish it"},
             {v:"after7",l:"7 days after I finish it"},{v:"after30",l:"30 days after I finish it"}],
    current:recurKey(d.recurrence),
    onPick:v=>{ d.recurrence=recurFrom(v); Q(); }});
}
function recurKey(r){ if(!r) return "none";
  if(r.mode==="afterDone") return "after"+r.every;
  if(r.type==="days") return r.every===1?"daily":"weekly";
  if(r.type==="weekdays") return "weekdays";
  if(r.type==="months") return "monthly"; return "none"; }
function recurFrom(v){
  if(v==="none") return null;
  if(v==="daily") return {type:"days",every:1};
  if(v==="weekly") return {type:"days",every:7};
  if(v==="weekdays") return {type:"weekdays",days:[1,2,3,4,5]};
  if(v==="monthly") return {type:"months",every:1};
  if(v&&v.indexOf("after")===0) return {mode:"afterDone",every:Number(v.slice(5))};
  return null;
}

async function detailAction(a){
  await flushTaskSave();
  const n=byId(state.editing); if(!n) return;
  if(a==="delete"){ if(!confirmDelete(n)) return; await purge(n.id); closeSheet(); toast("Deleted"); return; }
  if(a==="done"){ await setStatus(n,"done"); closeSheet(); toast("Completed"); return; }
  if(a==="reopen"){ n.status="available"; n.completedAt=null; await save(n); closeSheet(); toast("Reopened"); return; }
  if(a==="drop"){ await setStatus(n,"dropped"); closeSheet(); toast("Dropped"); return; }
  if(a==="restore"){ await setStatus(n,"available"); closeSheet(); toast("Restored"); return; }
  if(a==="tomorrow"){
    const t=addDays(new Date(),1);
    if(n.deadline){ const old=new Date(n.deadline); t.setHours(old.getHours(),old.getMinutes(),0,0); n.deadline=t.toISOString(); }
    else { t.setHours(17,0,0,0); n.deadline=t.toISOString(); }
    n.bumpCount=(n.bumpCount||0)+1; n.flagged=false;
    await save(n); closeSheet();
    toast(n.bumpCount>=4?"Pushed to tomorrow. That is "+n.bumpCount+" times now":"Pushed to tomorrow"); return; }
  if(a==="duplicate"){
    await create(Object.assign({},n,{id:uid(),title:n.title+" (copy)",order:nextOrder(n.parentId),
      status:"available",completedAt:null,createdAt:nowISO(),touchedAt:nowISO(),bumpCount:0,dependsOn:[...(n.dependsOn||[])]}));
    closeSheet(); toast("Duplicated"); return; }
  if(a==="template"){ await saveAsTemplate(n); return; }
  if(a==="togroup"){ n.kind="group"; await save(n); openGroupSheet(n.id); return; }
  if(a==="addchild"){ openAddChild(n); return; }
  if(a==="split"){ openSplit(n); return; }
}

function openPicker(d,onChange){ sheetPush(()=>drawPicker(d,onChange)); }
function drawPicker(d,onChange){

     <div class="fieldnote" style="margin-top:18px">Tap to choose. The check mark moves. Go back with ‹ when done. Groups nest as deep as you need, and nothing can move into itself.${d.category?" Groups in a different category are greyed out because this item is "+esc(d.category)+".":""}</div>`,null);

      ${g.status!=="dropped"?`<button class="line accent" id="gDrop">Drop group</button>`:`<button class="line accent" id="gRestore">Restore</button>`}
    </div>
    <div class="field"><button class="line danger" id="gDelete">Delete permanently</button></div>

    isNew?async()=>{

    const on=(sel,ev,fn)=>{ const el=$(sel); if(el) el.addEventListener(ev,fn); };
    on("#gTitle","input",e=>{ d.title=e.target.value; G(); });
    on("#gNotes","input",e=>{ d.notes=e.target.value; G(); });
    on("#gIcon","click",()=>openIconPicker(CAT_ICONS.concat(TASK_ICONS),d.icon,v=>{ d.icon=v; G(); }));
    $$("#gColors button").forEach(b=>b.addEventListener("click",()=>{ d.color=b.dataset.col||null; G(); draw(); }));
    $$("#gMode button").forEach(b=>b.addEventListener("click",()=>{ d.childMode=b.dataset.mode; G(); draw(); }));
    on("#gDeadline","change",e=>{ d.deadline=e.target.value?new Date(e.target.value+"T17:00:00").toISOString():null; G(); });
    on("#gDeadline","blur",()=>setTimeout(draw,80));
    on("#gNotify","click",()=>openNotifyEditor(state.settings.notif.perGroup[d.id],async v=>{
      if(v) state.settings.notif.perGroup[d.id]=v; else delete state.settings.notif.perGroup[d.id];
      await saveSettings(); },"Default for every task inside this group."));
    on("#gMove","click",()=>openPicker(d,G));
    sheetBody.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>pickField(b.dataset.pick,d,G)));
    sheetBody.querySelectorAll("[data-clearx]").forEach(b=>b.addEventListener("click",e=>{
      e.stopPropagation(); const k=b.dataset.clearx;
      if(k==="gicon") d.icon=null;
      if(k==="gcat") d.category=null;
      if(k==="gdeadline"){ d.deadline=null; }
      G(); draw(); }));
    on("#gOpen","click",async()=>{ closeSheet(); state.tab="browse"; state.browseMode="groups"; state.path=buildPath(d.id); render(); });
    on("#gAdd","click",()=>{ if(g) openAddChild(g); });
    on("#gToTask","click",async()=>{ if(g){ g.kind="task"; await save(g); openSheet(g.id); } });
    on("#gDrop","click",async()=>{ if(g){ await setStatus(g,"dropped"); closeSheet(); toast("Dropped"); } });
    on("#gRestore","click",async()=>{ if(g){ await setStatus(g,"available"); closeSheet(); toast("Restored"); } });
    on("#gDelete","click",async()=>{ if(g&&confirmDelete(g)){ await purge(g.id); closeSheet(); toast("Deleted"); } });
    if(isNew) setTimeout(()=>{ const t=$("#gTitle"); if(t) t.focus(); },350);
  };
  sheetRoot(draw);
}

/* ===========================================================================
   QUICK-ENTRY PARSER — plain English in the title becomes structure.
   "Call dentist tomorrow at 3pm ~30m #Health @phone !" fills the fields.
   Everything it finds shows as a dismissible chip; explicit edits win.
   =========================================================================== */
const NL_DOWS={sun:0,mon:1,tue:2,tues:2,wed:3,thu:4,thur:4,thurs:4,fri:5,sat:6};
const NL_MONTHS={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
function parseNL(text){
  const src=String(text||"");
  const found={}; const spans=[];
  const claim=(key,s,e,data)=>{ if(found[key]) return false;
    for(const sp of spans) if(s<sp.e&&e>sp.s) return false;
    found[key]=data; spans.push({s,e,key}); return true; };
  const rx=(re)=>{ re.lastIndex=0; return re.exec(src); };
  let m;

  if((m=rx(/(^|\s)#([A-Za-z][\w&-]{1,24})/i))){
    const raw=m[2], hit=state.settings.categories.find(c=>c.name.toLowerCase()===raw.toLowerCase());
    claim("cat",m.index,m.index+m[0].length,{name:hit?hit.name:raw[0].toUpperCase()+raw.slice(1),isNew:!hit});
  }
  if((m=rx(/(^|\s)@([A-Za-z][\w-]{1,24})/i))){
    const raw="@"+m[2].toLowerCase(), hit=state.settings.contexts.find(c=>c.toLowerCase()===raw);
    claim("ctx",m.index,m.index+m[0].length,{name:hit||raw,isNew:!hit});
  }
  if((m=rx(/(^|\s)!(critical|high|normal|low)\b/i)))
    claim("imp",m.index,m.index+m[0].length,{v:m[2].toLowerCase()});
  else if((m=rx(/(^|\s)(!{1,2})(?=\s|$)/)))
    claim("imp",m.index,m.index+m[0].length,{v:m[2]==="!!"?"critical":"high"});

  if((m=rx(/(^|\s)\bsomeday\b/i))) claim("someday",m.index,m.index+m[0].length,{});

  /* recurrence before dates — "every friday" must not read as a deadline */
  if((m=rx(/(^|\s)(every\s?day|daily)\b/i))) claim("rec",m.index,m.index+m[0].length,{r:{type:"days",every:1},l:"every day"});
  else if((m=rx(/(^|\s)(weekdays)\b/i))) claim("rec",m.index,m.index+m[0].length,{r:{type:"weekdays",days:[1,2,3,4,5]},l:"weekdays"});
  else if((m=rx(/(^|\s)(every\s?week|weekly)\b/i))) claim("rec",m.index,m.index+m[0].length,{r:{type:"days",every:7},l:"weekly"});
  else if((m=rx(/(^|\s)(every\s?month|monthly)\b/i))) claim("rec",m.index,m.index+m[0].length,{r:{type:"months",every:1},l:"monthly"});
  else if((m=rx(/(^|\s)every\s+(sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)[a-z]*\b/i)))
    claim("rec",m.index,m.index+m[0].length,{r:{type:"weekdays",days:[NL_DOWS[m[2].toLowerCase()]]},l:"every "+m[2]});

  /* duration: a range, else a single figure */
  if((m=rx(/(^|\s)~?(\d{1,3})\s*(?:-|–|to\s+)\s*(\d{1,3})\s*(m|min|mins|minutes|h|hr|hrs|hours)\b/i))){
    const mult=/^h/i.test(m[4])?60:1;
    claim("dur",m.index,m.index+m[0].length,{min:+m[2]*mult,max:+m[3]*mult});
  } else if((m=rx(/(^|\s)~?(\d{1,3}(?:\.\d)?)\s*(m|min|mins|minutes|h|hr|hrs|hours)\b/i))){
    const mult=/^h/i.test(m[3])?60:1;
    claim("dur",m.index,m.index+m[0].length,{min:null,max:Math.round(+m[2]*mult)});
  }

  /* a time of day */
  if((m=rx(/(^|\s)(?:at\s+)?(\d{1,2}):(\d{2})\s*(am|pm)?\b/i))||(m=rx(/(^|\s)(?:at\s+)(\d{1,2})\s*(am|pm)?\b/i))||(m=rx(/(^|\s)(\d{1,2})\s*(am|pm)\b/i))){
    let h,mi,ap;
    if(m.length===5){ h=+m[2]; mi=+m[3]; ap=(m[4]||"").toLowerCase(); }
    else { h=+m[2]; mi=0; ap=(m[3]||"").toLowerCase(); }
    if(h<=24&&mi<60){
      if(ap==="pm"&&h<12) h+=12; if(ap==="am"&&h===12) h=0;
      if(!ap&&h<8) h+=12;                       /* "at 5" almost always means 5 in the evening */
      claim("time",m.index,m.index+m[0].length,{h,mi});
    }
  } else if((m=rx(/(^|\s)at\s+noon\b/i))||(m=rx(/(^|\s)noon\b/i))) claim("time",m.index,m.index+m[0].length,{h:12,mi:0});
  else if((m=rx(/(^|\s)midnight\b/i))) claim("time",m.index,m.index+m[0].length,{h:23,mi:59});

  /* a date */
  const today=startOfDay(new Date());
  const dateAt=(d)=>({d:startOfDay(d)});
  if((m=rx(/(^|\s)(?:by\s+|due\s+|on\s+)?(today|tonight)\b/i))) claim("due",m.index,m.index+m[0].length,dateAt(today));
  else if((m=rx(/(^|\s)(?:by\s+|due\s+|on\s+)?(tomorrow|tmrw|tmr)\b/i))) claim("due",m.index,m.index+m[0].length,dateAt(addDays(today,1)));
  else if((m=rx(/(^|\s)(?:by\s+|due\s+|on\s+)?(next\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)\b/i))){
    const dow=NL_DOWS[m[3].slice(0,m[3].length>4?3:m[3].length).toLowerCase()]??NL_DOWS[m[3].slice(0,3).toLowerCase()];
    if(dow!=null){ let ahead=(dow-today.getDay()+7)%7;
      if(m[2]) ahead+= (ahead===0?7:7); else if(ahead===0) ahead=0;
      claim("due",m.index,m.index+m[0].length,dateAt(addDays(today,ahead))); }
  }
  else if((m=rx(/(^|\s)(?:by\s+)?next\s+week\b/i))){
    const ahead=((1-today.getDay()+7)%7)||7;
    claim("due",m.index,m.index+m[0].length,dateAt(addDays(today,ahead)));
  }
  else if((m=rx(/(^|\s)(?:this\s+)?weekend\b/i))){
    let ahead=(6-today.getDay()+7)%7; claim("due",m.index,m.index+m[0].length,dateAt(addDays(today,ahead)));
  }
  else if((m=rx(/(^|\s)in\s+(\d{1,2})\s+(day|days|week|weeks)\b/i))){
    const n=+m[2]*(/week/i.test(m[3])?7:1);
    claim("due",m.index,m.index+m[0].length,dateAt(addDays(today,n)));
  }
  else if((m=rx(/(^|\s)(?:by\s+|due\s+|on\s+)?(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})\b/i))){
    const mo=NL_MONTHS[m[2].toLowerCase()], day=+m[3];
    if(day>=1&&day<=31){ let d=new Date(today.getFullYear(),mo,day);
      if(startOfDay(d)<today) d=new Date(today.getFullYear()+1,mo,day);
      claim("due",m.index,m.index+m[0].length,dateAt(d)); }
  }
  else if((m=rx(/(^|\s)(?:by\s+|due\s+|on\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/i))){
    const mo=+m[2]-1, day=+m[3];
    if(mo>=0&&mo<12&&day>=1&&day<=31){
      let y=m[4]?(+m[4]<100?2000+ +m[4]:+m[4]):today.getFullYear();
      let d=new Date(y,mo,day);
      if(!m[4]&&startOfDay(d)<today) d=new Date(y+1,mo,day);
      claim("due",m.index,m.index+m[0].length,dateAt(d)); }
  }

  /* assemble patch + chips */
  const patch={}, chips=[];
  if(found.due||found.time){
    let base=found.due?new Date(found.due.d):startOfDay(new Date());
    if(found.time){
      base.setHours(found.time.h,found.time.mi,0,0);
      if(!found.due&&base<new Date()) base=new Date(base.getTime()+DAY);
      patch.deadlineHasTime=true;
    } else base.setHours(17,0,0,0);
    patch.deadline=base.toISOString();
    chips.push({key:found.due?"due":"time",label:"Due "+relDay(patch.deadline)+(found.time?" "+fmtTime(patch.deadline):""),
      both:!!(found.due&&found.time)});
  }
  if(found.dur){ patch.durationMode="estimate"; patch.estMinMinutes=found.dur.min; patch.estMaxMinutes=found.dur.max;
    chips.push({key:"dur",label:"~"+(found.dur.min?mins(found.dur.min)+" to ":"")+mins(found.dur.max)}); }
  if(found.cat){ patch.category=found.cat.name; patch._newCat=found.cat.isNew;
    chips.push({key:"cat",label:"#"+found.cat.name+(found.cat.isNew?" (new)":"")}); }
  if(found.ctx){ patch.context=found.ctx.name; patch._newCtx=found.ctx.isNew;
    chips.push({key:"ctx",label:found.ctx.name}); }
  if(found.imp){ const map={critical:"protect",high:"protect",normal:"normal",low:"flexible"};
    patch.stakes=map[found.imp.v]||"normal"; patch.stakesOverridden=true;
    chips.push({key:"imp",label:STAKES_LABEL[patch.stakes]+" stakes"}); }
  if(found.rec){ patch.recurrence=found.rec.r; chips.push({key:"rec",label:"Repeats "+found.rec.l}); }
  if(found.someday){ patch.status="someday"; chips.push({key:"someday",label:"Someday"}); }

  /* the cleaned title: matched shorthand removed */
  const strip=(keys)=>{
    const drop=spans.filter(sp=>keys.has(sp.key)).sort((a,b)=>b.s-a.s);
    let t=src; for(const sp of drop) t=t.slice(0,sp.s)+" "+t.slice(sp.e);
    t=t.replace(/\s{2,}/g," ").replace(/\s+([,.;:])/g,"$1").trim();
    return t?t[0].toUpperCase()+t.slice(1):t;
  };
  const allKeys=new Set(spans.map(s=>s.key));
  return {title:strip(allKeys),patch,chips,strip,found};
}

/* ===========================================================================
   CAPTURE — the + button. Type naturally; the shorthand becomes chips.
   A title alone is still enough. Everything else folds below.
   =========================================================================== */
function captureDest(){
  if(state.tab==="browse"&&state.browseMode==="groups"&&state.path.length) return state.path[state.path.length-1];
  return UNSORTED;
}
$("#fab").addEventListener("click",()=>openCapture());

function openCapture(pre){
  pre=pre||{};
  const d=newNode({parentId:captureDest()});
  if(pre.deadlineDay){ d.deadline=new Date(pre.deadlineDay+"T17:00:00").toISOString(); }
  if(pre.fixedSlot){ d.durationMode="fixed"; d.fixedStart=new Date(pre.fixedSlot+":00").toISOString();
    d.fixedEnd=new Date(new Date(d.fixedStart).getTime()+60*MIN).toISOString(); }
  state.capDraft=d; state.capSubs=[]; state.capIgnore=new Set(); state.capSet=new Set();
  if(pre.deadlineDay) state.capSet.add("deadline");
  state.capWiz={i:0};
  sheetRoot(drawWizard);
}
/* ---------------------------------------------------------------------------
   THE NEW-TASK WIZARD
   One question at a time, in the order of the capture tree. Back returns to
   the last question with everything kept. Skip moves on without answering.
   The review step shows the whole task and jumps back to any answer.
   --------------------------------------------------------------------------- */
function wizSteps(){
  const d=state.capDraft;
  return (d&&d.actionable===false)
    ? ["type","title","time","repeat","shape","review"]
    : ["type","title","dotoday","due","window","repeat","effort","shape","review"];
}
function wizGo(n){
  const steps=wizSteps();
  state.capWiz.i=clamp(n,0,steps.length-1);
  drawWizard();
}
function wizKeep(){
  const d=state.capDraft; if(!d) return;
  const t=$("#wTitle"); if(t) d.title=t.value;
  const nn=$("#wNotes"); if(nn) d.notes=nn.value;
}
function wizFoot(i,total,last){
  return `<button class="wizbtn" id="wzBack"${i===0?" disabled":""}>‹ Back</button>
    <span class="wizprog tnum">${i+1} of ${total}</span>
    ${last?`<button class="wizbtn strong" id="wzAdd">Add task</button>`
          :`<button class="wizbtn" id="wzSkip">Skip</button><button class="wizbtn strong" id="wzNext">Next ›</button>`}`;
}
function drawWizard(){
  const d=state.capDraft; if(!d){ closeSheet(); return; }
  const steps=wizSteps();
  if(state.capWiz.i>steps.length-1) state.capWiz.i=steps.length-1;
  const i=state.capWiz.i, key=steps[i], last=key==="review";
  const P=state.settings.plan;
  const q=(t2,sub)=>`<div class="wizq">${esc(t2)}</div>${sub?`<div class="wizsub">${sub}</div>`:""}`;
  let h="", title="New";

  if(key==="type"){
    title="New";
    const opts=[
      ["todo","To do","Something you do and finish. Most things."],
      ["event","Event","You attend it at its time. A class, a visit, a meeting."],
      ["block","Time block","Walls off time. Commute, gym, quiet hours."],
      ["bgp","Background thing","Runs by itself while you do other work. Laundry."],
      ["project","Project","A group that holds steps inside it."],
      ["template","From a template","Start from a saved shape."]
    ];
    const cur=d.actionable===false
      ?(d.preset==="event"?"event":(d.background?"bgp":"block"))
      :"todo";
    h=q("What is this?","Tap to choose, then press Next. A custom sleep night is set in Settings, then Sleep, under per day overrides.")+
      `<div class="group">${opts.map(([k,l,note])=>`<button class="pickrow wizrow" data-wpre="${k}">
        <span>${l}<span class="path">${note}</span></span>${k===cur?'<span class="tick">✓</span>':""}</button>`).join("")}</div>`;
  }
  if(key==="title"){
    const isTodo=d.actionable!==false;
    title=isTodo?"To do":(d.preset==="event"?"Event":"Time block");
    h=q(isTodo?"What needs doing?":"What is it called?",
        isTodo?'Shorthand works: "essay draft friday 4pm ~1h #School @computer". It turns into chips you can dismiss.':"")+
      `<div class="field">
        <div class="line"><input class="big" id="wTitle" value="${esc(d.title)}" placeholder="${isTodo?"Title":"Name, like Math class or Commute"}" autocapitalize="sentences" enterkeyhint="next"></div>
        <div class="line" style="align-items:flex-start;padding-top:12px"><textarea id="wNotes" placeholder="Notes, if any">${esc(d.notes||"")}</textarea></div>
      </div>
      <div class="chips" id="capChips" style="display:none"></div>`;
  }
  if(key==="dotoday"){
    title="Timing";
    h=q("Is this for today?","Do today puts it at the top of today no matter how it ranks.")+
      `<div class="group">
        <button class="pickrow" data-wdt="1"><span>Yes, do it today</span>${d.flagged?'<span class="tick">✓</span>':""}</button>
        <button class="pickrow" data-wdt="0"><span>No, it can find its own place</span>${!d.flagged?'<span class="tick">✓</span>':""}</button>
      </div>`;
  }
  if(key==="due"){
    title="Due";
    h=q("Does it have a due date?","Blank time means end of that day. Skip if nothing real is due.")+
      `<div class="field">
        <div class="line"><label>Due</label><input type="date" id="wDue" value="${dateInput(d.deadline)}"></div>
        <div class="line"><label>Time</label><input type="time" id="wDueTime" value="${d.deadlineHasTime?timeInput(d.deadline):""}"></div>
        ${d.deadline?`<button class="line accent" id="wDueClear">No due date</button>`:""}
      </div>`;
  }
  if(key==="window"){
    title="Work window";
    const af=d.availableFrom;
    const afLbl=availLabel(af);
    const aw=d.aimWindow;
    const awLbl=aw&&(aw.start||aw.end)?[aw.start?fmtDate(aw.start):"any time",aw.end?fmtDate(aw.end):"onward"].join(" to "):"No aim";
    const twv=d.todWindow;
    const twLbl=twv&&(twv.after||twv.before)?[twv.after?"after "+fmtHM(twv.after):"",twv.before?"before "+fmtHM(twv.before):""].filter(Boolean).join(", "):"Any time";
    h=q("When can you work on it?","All three are optional. Skip and it competes from today onward.")+
      `<div class="field">
        <button class="line" id="wAvail"><label>Available from</label><span class="val${af?" set":""}">${esc(afLbl)}</span>${ICON_CHEV}</button>
        <button class="line" id="wAim"><label>Aim to do it</label><span class="val${aw?" set":""}">${esc(awLbl)}</span>${ICON_CHEV}</button>
        <button class="line" id="wTod"><label>Time of day</label><span class="val${twv?" set":""}">${esc(twLbl)}</span>${ICON_CHEV}</button>
      </div>
      <div class="fieldnote">Available from keeps it hidden until it opens, like an assignment that unlocks a week before it is due. Aim is the day or stretch you want it in. Time of day keeps it after or before a clock time.</div>`;
  }
  if(key==="time"){
    title=d.preset==="event"?"Event time":"Block time";
    h=q("When does it happen?",d.preset==="Sleep"?"Filled in from your sleep schedule. Adjust if this night differs.":"")+
      `<div class="field">
        <div class="line"><label>Day</label><input type="date" id="wDay" value="${dateInput(d.fixedStart)||dayKey(new Date())}"></div>
        <div class="line"><label>Start</label><input type="time" id="wStart" value="${timeInput(d.fixedStart)}"></div>
        <div class="line"><label>End</label><input type="time" id="wEnd" value="${timeInput(d.fixedEnd)}"></div>
      </div>
      ${d.preset!=="event"?`<div class="field"><button class="line" id="wBg"><label>Runs alongside other things</label><span class="val"></span><span class="toggle${d.background?" on":""}"></span></button></div>
      <div class="fieldnote">On means it never blocks other work and does not eat your hours. Laundry, a download.</div>`:""}`;
  }
  if(key==="repeat"){
    title="Repeats";
    h=q("Does it repeat?","A class on set weekdays, rent on the 1st, watering every 10 days.")+
      `<div class="field">

        <button class="line" data-wpick="context"><label>Where</label><span class="val">${esc(d.context||"Anywhere")}</span>${ICON_CHEV}</button>

      if(d.todWindow) row("window","Time of day",[d.todWindow.after?"after "+esc(fmtHM(d.todWindow.after)):"",d.todWindow.before?"before "+esc(fmtHM(d.todWindow.before)):""].filter(Boolean).join(", "));

function wireWizard(key){
  const d=state.capDraft; if(!d) return;
  const on=(sel,ev,fn)=>{ const el=$(sel); if(el) el.addEventListener(ev,fn); };
  const steps=wizSteps(), i=state.capWiz.i;
  on("#wzBack","click",()=>{ wizKeep(); wizGo(state.capWiz.i-1); });
  on("#wzSkip","click",()=>{ wizKeep(); wizGo(state.capWiz.i+1); });
  on("#wzNext","click",()=>{
    wizKeep();
    if(key==="time"&&!d.fixedStart){ toast("Set the day and start time first"); return; }
    wizGo(state.capWiz.i+1); });
  on("#wzAdd","click",async()=>{ wizKeep(); await commitCapture(false); });
  on("#wMore","click",async()=>{ wizKeep(); await commitCapture(true); });
  sheetBody.querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>wizGo(Number(b.dataset.goto))));

  if(key==="type"){
    sheetBody.querySelectorAll("[data-wpre]").forEach(b=>b.addEventListener("click",async()=>{
      const k=b.dataset.wpre;
      if(k==="project"){ await closeSheet(); openGroupSheet(null); return; }
      if(k==="template"){ openTemplatePicker(); return; }
      if(k==="todo"){ applyTaskType(d,"todo"); d.background=false; }
      if(k==="event") applyTaskType(d,"event");
      if(k==="block"){ applyTaskType(d,"block"); d.background=false; }
      if(k==="bgp"){ applyTaskType(d,"block");
        if(!d.fixedStart){ const t=new Date(Math.ceil(Date.now()/(15*MIN))*(15*MIN));
          d.fixedStart=t.toISOString(); d.fixedEnd=new Date(t.getTime()+60*MIN).toISOString(); }
        d.background=true; }
      normalizeTiming(d);
      drawWizard();       /* the check mark moves; Next moves you on */
    }));
  }
  if(key==="title"){
    let chipT=null;
    on("#wTitle","input",e=>{ d.title=e.target.value;
      clearTimeout(chipT); chipT=setTimeout(refreshWizChips,140); });
    on("#wTitle","keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); wizKeep(); wizGo(state.capWiz.i+1); } });
    const nn=$("#wNotes");
    if(nn){ const grow=()=>{ nn.style.height="auto"; nn.style.height=Math.max(56,nn.scrollHeight)+"px"; };
      nn.addEventListener("input",e=>{ d.notes=e.target.value; grow(); }); grow(); }
    refreshWizChips();
    setTimeout(()=>{ const t=$("#wTitle"); if(t&&!t.value) t.focus(); },250);
  }
  if(key==="dotoday"){
    sheetBody.querySelectorAll("[data-wdt]").forEach(b=>b.addEventListener("click",()=>{
      d.flagged=b.dataset.wdt==="1"; wizGo(state.capWiz.i+1); }));
  }
  if(key==="due"){
    on("#wDue","change",e=>{ state.capSet.add("deadline");
      const t=d.deadlineHasTime?timeInput(d.deadline):"17:00";
      d.deadline=e.target.value?new Date(e.target.value+"T"+t+":00").toISOString():null;
      if(!d.deadline) d.deadlineHasTime=false;
      if(d.deadline) d.timeframe=null; normalizeTiming(d); });
    on("#wDue","blur",()=>setTimeout(drawWizard,80));
    on("#wDueTime","change",e=>{ state.capSet.add("deadline");
      if(!d.deadline&&e.target.value){ const t2=new Date(); d.deadline=new Date(dayKey(t2)+"T"+e.target.value+":00").toISOString(); d.deadlineHasTime=true; }
      else if(d.deadline){
        if(e.target.value){ d.deadline=new Date(dateInput(d.deadline)+"T"+e.target.value+":00").toISOString(); d.deadlineHasTime=true; }
        else { d.deadline=new Date(dateInput(d.deadline)+"T17:00:00").toISOString(); d.deadlineHasTime=false; }
      } normalizeTiming(d); });
    on("#wDueClear","click",()=>{ d.deadline=null; d.deadlineHasTime=false; normalizeTiming(d); drawWizard(); });
  }
  if(key==="window"){
    on("#wAvail","click",()=>openAvailSheet(d,null));
    on("#wAim","click",()=>openAimSheet(d,null));
    on("#wTod","click",()=>openTodSheet(d,null));
  }
  if(key==="time"){
    const upd=()=>{ const day=$("#wDay").value, st=$("#wStart").value, en=$("#wEnd").value;
      if(day&&st){ d.fixedStart=new Date(day+"T"+st+":00").toISOString();
        d.fixedEnd=en?new Date(day+"T"+en+":00").toISOString():null; normalizeTiming(d); }
      else if(!st){ d.fixedStart=null; d.fixedEnd=null; } };
    ["#wDay","#wStart","#wEnd"].forEach(sel=>on(sel,"change",upd));
    on("#wBg","click",()=>{ d.background=!d.background; drawWizard(); });
  }
  if(key==="repeat"){
    on("#wRepeat","click",()=>openRepeatEditor(d,null));
    on("#wRepClear","click",()=>{ d.recurrence=null; drawWizard(); });
  }
  if(key==="effort"){
    on("#wEstMin","change",e=>{ d.estMinMinutes=e.target.value===""?null:Number(e.target.value);
      state.capSet.add("dur"); normalizeTiming(d); drawWizard(); });
    on("#wEstMax","change",e=>{ d.estMaxMinutes=e.target.value===""?null:Number(e.target.value);
      state.capSet.add("dur"); normalizeTiming(d); drawWizard(); });
    on("#wEnergy","click",()=>pickField("energy",d,null));
  }
  if(key==="shape"){
    sheetBody.querySelectorAll("[data-wpick]").forEach(b=>b.addEventListener("click",()=>{
      const k=b.dataset.wpick;
      pickField(k,d,()=>{ if(k==="category") state.capSet.add("cat"); if(k==="context") state.capSet.add("ctx");
        if(k==="stakes") state.capSet.add("imp"); }); }));
    on("#wGroup","click",()=>openPicker(d,null));
    on("#wIcon","click",()=>openIconPicker(TASK_ICONS,d.icon,v=>{ d.icon=v; }));
  }
  if(key==="review"){
    on("#wDeps","click",()=>{ if(d.dependencyMode==="none") d.dependencyMode="required"; openDepPicker(d,null); });
    on("#wAlerts","click",()=>openNotifyEditor(d.notify,v=>{ d.notify=v; },
      "Overrides the group and category defaults for this task only."));
    on("#wSubs","click",()=>openSubtasksSheet());
  }
}

const CAP_OPEN={when:false,effort:false,organize:false,deps:false,alerts:false,steps:false,status:false,advanced:false};
function capChipsHTML(){
  const d=state.capDraft; if(!d) return "";
  const p=parseNL(d.title||"");
  const chips=p.chips.filter(c=>!state.capIgnore.has(c.key));
  if(!chips.length) return "";
  return chips.map(c=>`<span class="chip"><b>${esc(c.label)}</b><span class="x" data-chipx="${esc(c.key)}">✕</span></span>`).join("");

function refreshChips(){

function drawFixedSheet(d,onChange){
  showSheet("At a set time",
    `<div class="field">
      <div class="line"><label>Day</label><input type="date" id="xDay" value="${dateInput(d.fixedStart)||dayKey(new Date())}"></div>
      <div class="line"><label>Start</label><input type="time" id="xStart" value="${timeInput(d.fixedStart)}"></div>
      <div class="line"><label>End</label><input type="time" id="xEnd" value="${timeInput(d.fixedEnd)}"></div>
     </div>
     <div class="fieldnote">Sits at its time on the calendar and in the plan, like an appointment. An end before the start is corrected automatically. Applied when you go back.</div>
     <div class="field"><button class="line" id="xBg"><label>Runs in the background</label><span class="val"></span><span class="toggle${d.background?" on":""}"></span></button></div>
     <div class="fieldnote">Laundry, the dishwasher, a download. It takes up the time slot but not you. It never blocks other work, other tasks can be planned right over it, and it does not count against your hours.</div>
     <div class="field"><button class="line accent" id="xClear">No set time</button></div>`,null);
  SHEET.leave=()=>{
    const day=$("#xDay"), st=$("#xStart"), e=$("#xEnd");
    if(day&&st&&day.value&&st.value){ d.fixedStart=new Date(day.value+"T"+st.value+":00").toISOString();
      d.fixedEnd=e&&e.value?new Date(day.value+"T"+e.value+":00").toISOString():null;
      normalizeTiming(d);
      if(onChange) onChange(); }
  };
  $("#xBg").addEventListener("click",()=>{ d.background=!d.background;
    if(onChange) onChange(); drawFixedSheet(d,onChange); });
  $("#xClear").addEventListener("click",()=>{ d.fixedStart=null; d.fixedEnd=null; d.background=false;
    if(d.durationMode==="fixed") d.durationMode=d.estMaxMinutes?"estimate":"none";
    if(onChange) onChange(); SHEET.leave=null; sheetPop(); });
}
async function commitCapture(again){
  const d=state.capDraft; if(!d) return;
  const t=$("#tTitle")||$("#wTitle"); if(t) d.title=t.value;
  const nn=$("#tNotes")||$("#wNotes"); if(nn) d.notes=nn.value;
  const ss=$("#tSteps"); if(ss) state.capSubs=ss.value.split("\n");
  d.title=(d.title||"").trim();
  if(!d.title){ toast("Give it a name");
    if(state.capWiz){ wizGo(wizSteps().indexOf("title")); }
    const t2=$("#tTitle")||$("#wTitle"); if(t2) t2.focus(); return; }
  if(d.actionable===false&&!d.fixedStart){ toast("Set its time first. Events and blocks live at a time");
    if(state.capWiz){ wizGo(wizSteps().indexOf("time")); } else { CAP_OPEN.when=true; drawTaskSheet(); } return; }
  const p=parseNL(d.title);
  const ig=state.capIgnore, st=state.capSet;
  const used=new Set();
  const want=k=>!ig.has(k)&&p.found[k];
  if((want("due")||want("time"))&&!st.has("deadline")&&!d.deadline&&!d.timeframe&&!d.fixedStart){
    d.deadline=p.patch.deadline;
    d.deadlineHasTime=!!p.patch.deadlineHasTime;
    if(p.found.due) used.add("due"); if(p.found.time) used.add("time"); }
  if(want("dur")&&!st.has("dur")&&d.estMaxMinutes==null){
    d.durationMode="estimate"; d.estMinMinutes=p.patch.estMinMinutes; d.estMaxMinutes=p.patch.estMaxMinutes; used.add("dur"); }
  if(want("cat")&&!st.has("cat")&&!d.category){
    if(p.patch._newCat&&!catByName(p.patch.category)){
      state.settings.categories.push({name:p.patch.category,
        icon:CAT_ICONS[state.settings.categories.length%CAT_ICONS.length],
        color:PALETTE[state.settings.categories.length%PALETTE.length]});
      await saveSettings(); }
    d.category=p.patch.category; used.add("cat"); }
  if(want("ctx")&&!st.has("ctx")&&!d.context){
    if(p.patch._newCtx&&!state.settings.contexts.includes(p.patch.context)){
      state.settings.contexts.push(p.patch.context); await saveSettings(); }
    d.context=p.patch.context; used.add("ctx"); }
  if(want("imp")&&!st.has("imp")&&!d.stakesOverridden){
    d.stakes=p.patch.stakes; d.stakesOverridden=true; used.add("imp"); }
  if(want("rec")&&!st.has("rec")&&!d.recurrence){ d.recurrence=p.patch.recurrence; used.add("rec"); }
  if(want("someday")&&d.status==="available"){ d.status="someday"; used.add("someday"); }
  if(used.size) d.title=p.strip(used)||d.title;

  const subs=state.capSubs.map(x=>x.trim()).filter(Boolean);
  if(subs.length) d.kind="group";
  if(d.parentId&&d.parentId!==UNSORTED){ const pg=byId(d.parentId);
    if(pg&&pg.category&&d.category&&pg.category!==d.category){
      toast("That group is "+pg.category+". Pick a matching category or group"); return; } }
  d.order=nextOrder(d.parentId);
  delete d._moreWhen;
  normalizeTiming(d);
  const n=newNode(d); state.nodes.set(n.id,n); await putNode(n);
  let o=Date.now();
  for(const x of subs){ const sp=parseNL(x);
    await create(Object.assign({title:sp.title||x,parentId:n.id,order:o+=1000},
      Object.fromEntries(Object.entries(sp.patch).filter(([k])=>!k.startsWith("_"))))); }
  toast("Added to "+pathLabel(n.parentId));
  if(again){
    const keep=n.parentId;
    state.capDraft=newNode({parentId:keep}); state.capSubs=[]; state.capIgnore=new Set(); state.capSet=new Set();
    if(state.capWiz){ state.capWiz.i=0; drawWizard(); }
    else { drawTaskSheet(); const t3=$("#tTitle"); if(t3) t3.focus(); }
  } else { closeSheet(); }
  render();
}

function drawFilters(){

  const row=(k,label,val)=>`<button class="line" data-f="${k}"><label>${label}</label><span class="val">${esc(val||"Any")}</span>${ICON_CHEV}</button>`;

      ${row("context","Context",f.context)}

     </div>
     <div class="field"><button class="line accent" id="fClear">Clear filter</button></div>
     <div class="field"><button class="line" id="fShowDone"><label>Show completed in lists</label><span class="val"></span><span class="toggle${state.showDone?" on":""}"></span></button></div>
     <div class="fieldnote">Applies to Groups and drill-in lists across Browse.</div>
     ${state.filters.length?sec("Saved")+`<div class="group">${state.filters.map((s,i)=>
        `<button class="pickrow" data-saved="${i}"><span>${esc(s.name)}</span><button class="tick" data-delsaved="${i}" style="color:var(--red)">Remove</button></button>`).join("")}</div>`:""}
     <div class="field" style="margin-top:18px"><div class="line">
        <input class="big" id="fName" placeholder="Name this filter…"></div>
        <button class="line accent" id="fSave">Save filter</button></div>
     <div class="fieldnote">Saved filters appear as chips on the Browse tab.</div>`,
    ()=>{ closeSheet(); state.tab="browse"; state.browseMode="all"; render(); },"View");
  sheetBody.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.f;
    const opts={category:state.settings.categories.map(c=>c.name),deliverable:state.settings.deliverables,
      context:state.settings.contexts,energy:[{v:"deep",l:"Deep focus"},{v:"shallow",l:"Shallow"}],
      stakes:[{v:"protect",l:"Protect"},{v:"normal",l:"Normal"},{v:"flexible",l:"Flexible"}],
      status:[{v:"available",l:"Available"},{v:"waiting",l:"Waiting on"},{v:"blocked",l:"Blocked"},
              {v:"deferred",l:"Deferred"},{v:"someday",l:"Someday"}]}[k];
    openOptions({title:"Filter",options:opts,current:(state.activeFilter||{})[k],allowNone:true,
      onPick:v=>{ state.activeFilter=Object.assign({name:"Filter"},state.activeFilter||{},{[k]:v}); }});
  }));
  $("#fClear").addEventListener("click",()=>{ state.activeFilter=null; drawFilters(); });
  $("#fShowDone").addEventListener("click",()=>{ state.showDone=!state.showDone; drawFilters(); });
  $("#fSave").addEventListener("click",async()=>{
    const nm=$("#fName").value.trim(); if(!nm||!state.activeFilter) return;
    state.filters.push(Object.assign({},state.activeFilter,{name:nm})); await saveSettings(); drawFilters(); toast("Filter saved"); });
  sheetBody.querySelectorAll("[data-delsaved]").forEach(b=>b.addEventListener("click",async e=>{
    e.stopPropagation(); state.filters.splice(Number(b.dataset.delsaved),1); await saveSettings(); drawFilters(); }));
  sheetBody.querySelectorAll("[data-saved]").forEach(b=>b.addEventListener("click",()=>{
    state.browseMode="filter:"+b.dataset.saved; closeSheet(); state.tab="browse"; render(); }));
}

function drawExplorer(pid){
  const parent=pid?byId(pid):null;

  const isUns=pid===UNSORTED;
  const kids=childrenOf(pid).filter(n=>n.id!==UNSORTED&&n.status!=="dropped");
  const rows=[...(pid===null?[byId(UNSORTED)]:[]),...kids.filter(n=>n.kind==="group"),...kids.filter(n=>n.kind!=="group")];
  const rowHtml=n=>{
    const uns=n.id===UNSORTED;
    const grp=n.kind==="group";
    const cat=n.category?catByName(n.category):null;
    return `<div class="line" style="gap:8px">
      <button data-xopen="${n.id}" style="flex:1;display:flex;align-items:center;gap:10px;min-width:0;text-align:left">
        ${grp?(n.icon?`<span class="nodeicon">${esc(n.icon)}</span>`:ICON_FOLDER(n.color)):(n.icon?`<span class="nodeicon">${esc(n.icon)}</span>`:'<span class="circle" style="width:18px;height:18px;flex:0 0 18px"></span>')}
        <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n.title||"Untitled")}${uns?' <span class="path">system</span>':""}${n.category?` <span class="path" style="${cat&&cat.color?"color:"+esc(cat.color):""}">${esc(n.category)}</span>`:""}${grp?` <span class="path">${descendants(n.id).filter(x=>x.kind==="task").length}</span>`:""}</span></button>
      ${uns?"":`<span class="tick" role="button" data-xmove="${n.id}" style="color:var(--accent);font-weight:400;font-size:14px;flex:0 0 auto">Move</span>`}
      ${grp?ICON_CHEV:""}</div>`;
  };
  showSheet(isUns?"Unsorted":(parent?(parent.title||"Untitled"):"Everything"),
    `${parent&&!isUns?`<div class="fieldnote" style="margin:0 20px 10px">${parent.category?esc(parent.category)+" · ":""}<button data-xedit="${parent.id}" style="color:var(--accent)">Edit this group</button></div>`:""}
     <div class="field">${rows.map(rowHtml).join("")||'<div class="line"><span style="color:var(--label2)">Empty</span></div>'}</div>
     <div class="field" style="margin-top:14px">
      ${isUns?"":`<button class="line accent" id="xNewGroup">New group here</button>`}
      <button class="line accent" id="xNewTask">New task here</button>
     </div>
     ${isUns?`<div class="fieldnote">Unsorted is the built-in inbox: it holds tasks, but it cannot be renamed, moved, recategorized or deleted.</div>`:""}`,null);
  sheetBody.querySelectorAll("[data-xopen]").forEach(b=>b.addEventListener("click",()=>{
    const n=byId(b.dataset.xopen); if(!n) return;
    if(n.kind==="group"||n.id===UNSORTED) sheetPush(()=>drawExplorer(n.id));
    else openSheet(n.id,true); }));
  sheetBody.querySelectorAll("[data-xmove]").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation(); const n=byId(b.dataset.xmove); if(!n||n.id===UNSORTED) return;
    openPicker(n,async()=>{ await save(n); }); }));
  const xe=sheetBody.querySelector("[data-xedit]");
  if(xe) xe.addEventListener("click",()=>openGroupSheet(xe.dataset.xedit,true));
  const ng=$("#xNewGroup");
  if(ng) ng.addEventListener("click",async()=>{
    const v=(prompt("New group name")||"").trim(); if(!v) return;
    await create({title:v,kind:"group",parentId:pid,order:nextOrder(pid),
      category:parent&&parent.category?parent.category:null});
    drawExplorer(pid); });
  $("#xNewTask").addEventListener("click",async()=>{
    const v=(prompt("New task title (shorthand works: 'call bob friday ~20m')")||"").trim(); if(!v) return;
    const p=parseNL(v);
    await create(Object.assign({title:p.title||v,parentId:pid===null?UNSORTED:pid,order:nextOrder(pid)},
      Object.fromEntries(Object.entries(p.patch).filter(([k])=>!k.startsWith("_")))));
    drawExplorer(pid); });

function drawGroupsManage(){

    if(c.id===UNSORTED||c.kind!=="group"||c.status==="dropped") continue;
    rows.push({g:c,depth}); walk(c.id,depth+1); } })(null,0);
  const cat=c=>{ const x=c.category?catByName(c.category):null;
    return c.category?` <span class="path" style="${x&&x.color?"color:"+esc(x.color):""}">${x&&x.icon?esc(x.icon)+" ":""}${esc(c.category)}</span>`:""; };
  showSheet("Groups",
    `<div class="fieldnote" style="margin:0 20px 12px">Every group in the tree. Tap one to edit its name, icon, color, category and contents. Unsorted is system-managed and isn't listed.</div>
     <div class="group">${rows.map(r=>`<button class="pickrow" data-gedit="${r.g.id}"
        style="padding-left:${16+r.depth*18}px">${r.g.icon?`<span class="nodeicon">${esc(r.g.icon)}</span>`:ICON_FOLDER(r.g.color)}
        <span>${esc(r.g.title||"Untitled")}${cat(r.g)}</span>${ICON_CHEV}</button>`).join("")||'<div class="pickrow"><span>No groups yet.</span></div>'}</div>
     <div class="field" style="margin-top:18px"><button class="line accent" id="gmNew">New group</button></div>`,null);
  sheetBody.querySelectorAll("[data-gedit]").forEach(b=>b.addEventListener("click",()=>openGroupSheet(b.dataset.gedit,true)));
  $("#gmNew").addEventListener("click",()=>openGroupSheet(null,true));
}

function hexToRgb(h){ h=h.replace("#",""); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)].join(","); }
let darkMQ=null;
function applyTheme(){
  const t=state.settings.theme;
  const th=THEMES.find(x=>x.id===t.id)||THEMES[0];
  const wantDark = t.mode==="dark" || (t.mode==="auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  const root=document.documentElement;

  root.style.setProperty("--accent-rgb",hexToRgb(acc));
  if(wantDark&&th.oled){ root.style.setProperty("--bg","#000000"); root.style.setProperty("--elev","#121214");
    root.style.setProperty("--press","#232326"); root.style.setProperty("--navbg","rgba(10,10,12,.85)");
    root.style.setProperty("--segon","#2E2E33"); }
  else{ root.style.removeProperty("--bg"); root.style.removeProperty("--elev");
    root.style.removeProperty("--press"); root.style.removeProperty("--navbg");
    root.style.removeProperty("--segon"); }
  const bgD="#000000", bgL="#F2F2F7";
  $("#metaThemeL").setAttribute("content",t.mode==="dark"?bgD:bgL);
  $("#metaThemeD").setAttribute("content",t.mode==="light"?bgL:bgD);
  document.documentElement.style.background=getComputedStyle(document.documentElement).getPropertyValue("--bg")||("");
  document.documentElement.style.colorScheme=wantDark?"dark":"light";
  document.body.dataset.hasdark=wantDark?"1":"0";
  document.body.style.setProperty("--bgdim","rgba(0,0,0,"+(t.bgDim!=null?t.bgDim:.35)+")");
  if(!darkMQ){ darkMQ=window.matchMedia("(prefers-color-scheme: dark)");

    if(darkMQ.addEventListener) darkMQ.addEventListener("change",h); else darkMQ.addListener(h); }
}

$("#bgFile").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const img=new Image();
  img.onload=async()=>{
    const max=1200, sc=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement("canvas");
    cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
    const cx=cv.getContext("2d"); cx.drawImage(img,0,0,cv.width,cv.height);
    /* sample average luminance to auto-set the readability scrim */
    const smp=cx.getImageData(0,0,cv.width,cv.height).data;
    let lum=0, cnt=0;
    for(let i=0;i<smp.length;i+=160){ lum+=0.2126*smp[i]+0.7152*smp[i+1]+0.0722*smp[i+2]; cnt++; }
    lum/=cnt*255;
    const t=state.settings.theme;
    t.bgDim=clamp(0.2+lum*0.5,0.2,0.65);   /* brighter photo → stronger scrim */
    const data=cv.toDataURL("image/jpeg",0.8);
    await putMeta("bgImage",data);
    t.hasBg=true; await saveSettings();
    applyTheme(); await applyBg(); render(); if(SHEET.current) SHEET.current(); toast("Background set");
    URL.revokeObjectURL(img.src);
  };
  img.src=URL.createObjectURL(f);
  e.target.value="";
});

/* ===========================================================================
   EXPORT / IMPORT — JSON round-trip, Markdown, CSV, ICS with alarms.
   =========================================================================== */
function toMarkdown(rootId){
  const lines=[];
  const walk=(p,depth)=>{
    for(const c of childrenOf(p)){
      const box=c.kind==="group"?"":(c.status==="done"?"[x] ":"[ ] ");
      const meta=[];
      if(c.deadline) meta.push("due "+fmtDate(c.deadline,{year:"numeric",month:"short",day:"numeric"}));
      if(c.timeframe&&!c.deadline) meta.push("sometime "+tfLabel(c.timeframe));
      if(c.estMaxMinutes) meta.push(mins(c.estMaxMinutes));
      if(c.category) meta.push(c.category);
      if(c.status==="waiting") meta.push("waiting"+(c.waitingOn?" on "+c.waitingOn:""));
      lines.push("  ".repeat(depth)+"- "+box+(c.title||"Untitled")+(meta.length?"  _("+meta.join(", ")+")_":""));
      if(c.notes) c.notes.split("\n").forEach(l=>lines.push("  ".repeat(depth+1)+"> "+l));
      walk(c.id,depth+1);
    }
  };
  const root=rootId===undefined?null:rootId;
  const title=rootId===undefined?"All tasks":(byId(rootId)?byId(rootId).title:"Tasks");
  lines.push("# "+title); lines.push(""); lines.push("_Exported "+new Date().toLocaleString()+"_"); lines.push("");
  walk(root,0);
  if(rootId===undefined){ lines.push(""); lines.push("## Unsorted"); walk(UNSORTED,0); }
  return lines.join("\n");
}
function toCSV(){
  const cols=["id","parentId","parentTitle","title","kind","status","effectiveStatus","stakes",
    "effectiveStakes","stakesWeight","actionable","timePinned","background","preset",
    "availableFrom","aimWindow","todWindow",
    "deadline","deadlineHasTime","timeframe","deferUntil","expiry","durationMode","estMinMinutes",
    "estMaxMinutes","fixedStart","fixedEnd","actualMinutes","category","deliverable","context","energy","flagged",
    "bumpCount","dependsOn","dependencyMode","waitingOn","followUpDate","notes","createdAt","touchedAt","completedAt"];
  const q=v=>{ const s=v==null?"":String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const rows=[cols.join(",")];
  for(const n of state.nodes.values()){
    if(n.id===UNSORTED) continue;
    rows.push(cols.map(c=>{
      if(c==="parentTitle") return q(pathLabel(n.parentId));
      if(c==="effectiveStatus") return q(effStatus(n));
      if(c==="effectiveStakes") return q(effStakes(n));
      if(c==="availableFrom") return q(n.availableFrom?(n.availableFrom.mode==="beforeDue"?(n.availableFrom.leadDays!=null?n.availableFrom.leadDays:state.settings.plan.leadDays)+" days before due":dateInput(n.availableFrom.at)):"");
      if(c==="aimWindow") return q(n.aimWindow?[dateInput(n.aimWindow.start),dateInput(n.aimWindow.end)].filter(Boolean).join(" to "):"");
      if(c==="todWindow") return q(n.todWindow?[n.todWindow.after?"after "+n.todWindow.after:"",n.todWindow.before?"before "+n.todWindow.before:""].filter(Boolean).join(" "):"");
      if(c==="timeframe") return q(n.timeframe?tfLabel(n.timeframe):"");
      if(c==="dependsOn") return q((n.dependsOn||[]).map(x=>byId(x)?byId(x).title:x).join("; "));
      return q(n[c]);
    }).join(","));
  }
  return rows.join("\n");
}
/* ICS: fixed blocks and deadlines as events, VALARMs from each item's
   effective notification config, plus the sleep block if opted in. */
function toICS(){
  const pad=n=>String(n).padStart(2,"0");
  const z=d=>{ const x=new Date(d); return x.getUTCFullYear()+pad(x.getUTCMonth()+1)+pad(x.getUTCDate())+
    "T"+pad(x.getUTCHours())+pad(x.getUTCMinutes())+"00Z"; };
  const esc2=s=>String(s||"").replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n");
  const nf=state.settings.notif;
  const alarms=cfg=>cfg.enabled?cfg.offsets.map(o=>
    ["BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Reminder","TRIGGER:-PT"+o+"M","END:VALARM"]).flat():[];
  const out=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Tasks//EN","CALSCALE:GREGORIAN"];
  for(const n of state.nodes.values()){
    if(n.status==="dropped") continue;
    const cfg=effNotify(n);
    if(n.fixedStart){
      const end=n.fixedEnd||new Date(new Date(n.fixedStart).getTime()+30*MIN).toISOString();
      out.push("BEGIN:VEVENT","UID:"+n.id+"@tasks","DTSTAMP:"+z(new Date()),
        "DTSTART:"+z(n.fixedStart),"DTEND:"+z(end),"SUMMARY:"+esc2(n.title));
      if(n.notes) out.push("DESCRIPTION:"+esc2(n.notes));
      out.push(...alarms(cfg));
      out.push("END:VEVENT");
    } else if(n.deadline&&n.status!=="done"){
      /* timed event at the day-level alert time so VALARMs can hang off it */
      let base=new Date(n.deadline);
      if(!n.deadlineHasTime){
        const [h,m]=(cfg.atTime||nf.atTime||"09:00").split(":"); base=new Date(base); base.setHours(+h,+m,0,0); }
      out.push("BEGIN:VEVENT","UID:dl-"+n.id+"@tasks","DTSTAMP:"+z(new Date()),
        "DTSTART:"+z(base),"DTEND:"+z(new Date(base.getTime()+30*MIN)),
        "SUMMARY:Due: "+esc2(n.title));
      out.push(...alarms(cfg));
      out.push("END:VEVENT");
    }
  }
  if(state.settings.sleep.ics){
    const s=state.settings.sleep;
    const d=new Date(); const [bh,bm]=s.bed.split(":"), [wh,wm]=s.wake.split(":");
    const st=new Date(d); st.setHours(+bh,+bm,0,0);
    const en=new Date(d); en.setHours(+wh,+wm,0,0); if(en<=st) en.setDate(en.getDate()+1);
    out.push("BEGIN:VEVENT","UID:sleep@tasks","DTSTAMP:"+z(new Date()),
      "DTSTART:"+z(st),"DTEND:"+z(en),"RRULE:FREQ=DAILY","SUMMARY:Sleep","TRANSP:OPAQUE","END:VEVENT");
  }
  out.push("END:VCALENDAR");
  return out.filter(Boolean).join("\r\n");
}
function download(name,text,mime){
  const blob=new Blob([text],{type:mime||"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=$("#dl"); a.href=url; a.download=name; a.removeAttribute("hidden"); a.click();
  a.setAttribute("hidden",""); setTimeout(()=>URL.revokeObjectURL(url),4000);
}
async function shareOrDownload(name,text,mime){
  try{
    if(navigator.share&&navigator.canShare){
      const file=new File([text],name,{type:mime||"text/plain"});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return; }
    }
  }catch(e){ /* fall through */ }
  download(name,text,mime);
}
async function doExport(k){
  const stamp=dayKey(new Date());
  if(k==="json"){ await shareOrDownload("tasks-backup-"+stamp+".json",JSON.stringify(exportData(),null,2),"application/json");
    state.settings.lastExport=nowISO(); await saveSettings(); }
  if(k==="md")   await shareOrDownload("tasks-"+stamp+".md",toMarkdown(),"text/markdown");
  if(k==="csv")  await shareOrDownload("tasks-"+stamp+".csv",toCSV(),"text/csv");
  if(k==="ics")  await shareOrDownload("tasks-alerts-"+stamp+".ics",toICS(),"text/calendar");
  toast("Exported");
}
function drawExport(){
  const stamp=dayKey(new Date());
  const groups=Array.from(state.nodes.values()).filter(n=>n.kind==="group"&&n.id!==UNSORTED);
  showSheet("Export and import",
    `<div class="field">
      <button class="line accent" data-ex="json">Full backup (JSON)</button>
      <button class="line accent" data-ex="md">Printable list (Markdown)</button>
      <button class="line accent" data-ex="csv">Spreadsheet (CSV)</button>
      <button class="line accent" data-ex="ics">Calendar with alerts (ICS)</button>
     </div>
     <div class="fieldnote">JSON restores perfectly. It is how you move everything to another device, and it counts as your weekly backup off this phone. ICS imports into Apple Calendar with alert times built in.</div>
     ${groups.length?sec("One group only")+`<div class="group">${groups.map(g=>
        `<button class="pickrow" data-exg="${g.id}"><span>${esc(g.title)}</span><span class="tick">MD</span></button>`).join("")}</div>`:""}
     <div class="sechead"><span class="h">Restore</span></div>
     <div class="field"><button class="line accent" id="impBtn">Import a JSON backup</button></div>
     <div class="fieldnote">Import merges by id. Anything already here with the same id is overwritten. v1 backups import cleanly.</div>
     <div class="fieldnote" style="margin-top:22px">${state.nodes.size-1} items on device.</div>
`,null);
  sheetBody.querySelectorAll("[data-ex]").forEach(b=>b.addEventListener("click",async()=>{ await doExport(b.dataset.ex); }));
  sheetBody.querySelectorAll("[data-exg]").forEach(b=>b.addEventListener("click",async()=>{
    const g=byId(b.dataset.exg);
    await shareOrDownload((g.title||"group").replace(/[^\w\-]+/g,"-")+".md",toMarkdown(g.id),"text/markdown");
    toast("Exported"); }));
  $("#impBtn").addEventListener("click",()=>$("#impFile").click());
}
$("#impFile").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  try{
    const data=JSON.parse(await f.text());
    if(!data||!Array.isArray(data.nodes)) throw new Error("bad file");
    if(!confirm("Import "+data.nodes.length+" items? Existing items with the same id will be overwritten.")) return;
    const IMP2={critical:"protect",high:"protect",normal:"normal",low:"flexible"};
    for(const n of data.nodes){
      const merged=newNode(n);
      if(!n.stakes&&(n.importance||n.deadlineType)){
        let st="normal", over=false;
        if(n.importanceOverridden&&IMP2[n.importance]){ st=IMP2[n.importance]; over=true; }
        if(n.deadlineType){ st=over&&STAKES_RANK[st]>=STAKES_RANK[n.deadlineType==="hard"?"protect":"flexible"]?st:(n.deadlineType==="hard"?"protect":"flexible"); over=true; }
        merged.stakes=st; merged.stakesOverridden=over;
      }
      if(merged.timePinned==null) merged.timePinned=!!merged.fixedStart;
      delete merged.importance; delete merged.importanceOverridden; delete merged.deadlineType;
      state.nodes.set(merged.id,merged); await putNode(merged);
    }
    bumpRev();
    if(data.settings) state.settings=mergeDefaults(data.settings);
    if(data.dayHours) state.dayHours=Object.assign({},state.dayHours,data.dayHours);
    if(data.filters) state.filters=data.filters;
    await saveSettings(); await ensureInbox(); applyTheme(); await applyBg();
    closeSheet(); render(); toast("Imported "+data.nodes.length+" items");
  }catch(err){ alert("That file could not be read as a Tasks backup."); }
  e.target.value="";
});

/* ---------- update ---------- */
async function checkUpdate(){
  toast("Checking…");
  try{
    if("serviceWorker" in navigator){
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg){ await reg.update();
        if(reg.waiting){ reg.waiting.postMessage({type:"SKIP_WAITING"});
          setTimeout(()=>location.reload(),400); return; } }
    }
    const r=await fetch("index.html",{cache:"reload"});
    if(r.ok){ setTimeout(()=>location.reload(),300); return; }
  }catch(e){}
  toast("No update found");
}

/* one-time note after the stakes update, so you can check the mapping */
function drawStakesReport(r){
  const row=id=>{ const n=byId(id); return n?`<button class="pickrow" data-open2="${id}"><span>${esc(n.title||"Untitled")}</span>${ICON_CHEV}</button>`:""; };
  showSheet("Stakes update",
    `<div class="fieldnote" style="margin:0 20px 12px">Importance and the hard or soft deadline setting are now one thing: Stakes. Your tasks were mapped over automatically. Here is everything that did not land on Normal, so you can adjust any that look off. Tap one to open it.</div>
     ${r.protect.length?sec("Set to Protect","<span>was critical, high, or a hard deadline</span>")+`<div class="group">${r.protect.map(row).join("")}</div>`:""}
     ${r.flexible.length?sec("Set to Flexible","<span>was low, or a soft deadline</span>")+`<div class="group">${r.flexible.map(row).join("")}</div>`:""}
     <div class="fieldnote" style="margin-top:14px">Everything else is Normal. You will not see this note again.</div>`,null);
  sheetBody.querySelectorAll("[data-open2]").forEach(b=>b.addEventListener("click",()=>openSheet(b.dataset.open2)));
}

/* ---------- toast ---------- */
let toastT=null;
function toast(msg){ if(!msg) return; const el=$("#toast");
  el.textContent=msg; el.classList.add("on"); clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove("on"),1700); }

/* ---------- example ---------- */
async function seed(){
  const g=await create({title:"Secure new home by Oct 18",kind:"group",childMode:"sequential",
    stakes:"protect",stakesOverridden:true,category:"Home",icon:"🏠",color:"#34C759",
    deadline:new Date(new Date().getFullYear(),9,18,17,0).toISOString(),
    notes:"Example group. Delete it once you have your own."});
  const steps=[
    {title:"Conduct neighborhood research",deliverable:"Research",estMinMinutes:45,estMaxMinutes:120,durationMode:"estimate",energy:"deep",context:"@computer"},
    {title:"Speak to leasing agents for information",deliverable:"Call",estMinMinutes:20,estMaxMinutes:45,durationMode:"estimate",context:"@phone"},
    {title:"Schedule a tour appointment",deliverable:"Decision",estMinMinutes:5,estMaxMinutes:10,durationMode:"estimate",context:"@phone"}
  ];

  for(const s of steps) await create(Object.assign({parentId:g.id,order:o+=1000},s));

/* ===========================================================================
   BOOT
   =========================================================================== */
(async function boot(){
  try{ db=await openDB(); }
  catch(err){
    document.body.innerHTML='<div style="padding:60px 28px;font:17px -apple-system,sans-serif">'+
      '<h2 style="font-size:20px">Storage unavailable</h2><p style="color:#888;line-height:1.4">'+
      'This app stores everything on your device, which Safari blocks in Private Browsing. '+
      'Open it in a normal tab.</p></div>'; return; }

  for(const n of await allNodes()) state.nodes.set(n.id,newNode(n));  /* newNode fills v2 fields on v1 data */
  for(const m of await allMeta()){
    if(m.key==="settings") state.settings=mergeDefaults(m.value);
    if(m.key==="dayHours") state.dayHours=m.value||{};
    if(m.key==="filters") state.filters=m.value||[];
    if(m.key==="lastTab"&&m.value) state.tab=m.value;
    if(m.key==="todayOrder"&&m.value&&m.value.day===dayKey(new Date())) state.todayOrder=m.value;
  }
  await ensureInbox();
  const u=byId(UNSORTED); if(u.title!=="Unsorted"){ u.title="Unsorted"; await putNode(u); }
  const prevSchema=await getMeta("schemaVersion");
  if((prevSchema||0)<4){
    const rep=await migrateToStakes();
    if(rep.protect.length||rep.flexible.length) state._stakesReport=rep;
  }
  if((prevSchema||0)<6&&state.settings.plan&&state.settings.plan.splitMin){
    state.settings.plan.splitMin=0; await saveSettings();   /* one sitting unless you turn splitting back on */
  }
  await putMeta("schemaVersion",SCHEMA);
  try{ state.templates=await allTpls(); }catch(e){ state.templates=[]; }

  applyTheme(); await applyBg();

  const expired=await sweepExpiry();
  try{ await takeSnapshots(); }catch(e){}
  render();
  if(expired) toast(expired+" expired task"+(expired===1?"":"s")+" dropped");
  if(state._stakesReport){ const r=state._stakesReport; state._stakesReport=null;
    setTimeout(()=>sheetRoot(()=>drawStakesReport(r)),400); }

  if("serviceWorker" in navigator){
    try{ await navigator.serviceWorker.register("sw.js"); }catch(e){}
  }
  /* recompute urgency when the app comes back to the foreground — Today is
     never stale, no button needed */
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden){
    sweepExpiry().then(()=>{ render(); checkBanners(); }); } });
  /* live minute tick: banner check + now-line + Today refresh */
  setInterval(()=>{ checkBanners();
    if(document.hidden) return;
    if(state.tab==="calendar"&&state.calMode==="day"&&sameDay(state.calSel,new Date())) render();
  },30000);
})();
window.addEventListener("pagehide",()=>{ try{ putMeta("lastTab",state.tab); }catch(e){} });
</script>
