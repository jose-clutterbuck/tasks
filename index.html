const ICON_FOLDER=c=>'<svg class="folder" viewBox="0 0 22 22" fill="currentColor"'+(c?' style="color:'+c+'"':'')+'><path d="M2.2 6.6a1.9 1.9 0 0 1 1.9-1.9h3.5l1.9 2.2h8.4a1.9 1.9 0 0 1 1.9 1.9v7.6a1.9 1.9 0 0 1-1.9 1.9H4.1a1.9 1.9 0 0 1-1.9-1.9z"/></svg>';
const ICON_FOLDER_S='<svg class="folder stalled" viewBox="0 0 22 22" fill="currentColor"><path d="M2.2 6.6a1.9 1.9 0 0 1 1.9-1.9h3.5l1.9 2.2h8.4a1.9 1.9 0 0 1 1.9 1.9v7.6a1.9 1.9 0 0 1-1.9 1.9H4.1a1.9 1.9 0 0 1-1.9-1.9z"/></svg>';
const ICON_CHEV='<svg class="chev" viewBox="0 0 9 15" fill="none"><path d="M1.4 1.4 7 7.5l-5.6 6.1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_SEARCH='<svg viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7.2" cy="7.2" r="5.4"/><path d="m11.5 11.5 4 4"/></svg>';

function metaBits(n,opts={}){
  const out=[];
  const st=effStatus(n);
  if(n.deadline && n.status!=="done" && n.status!=="dropped"){
    const over=new Date(n.deadline)<new Date();
    const cls=over?"red":(n.deadlineType==="soft"?"gray":"orange");
    out.push(`<span class="pill ${cls}">${esc(relDay(n.deadline))}${n.deadlineType==="soft"?" ·soft":""}</span>`);
  }
  if(n.timeframe&&!n.deadline&&n.status!=="done"&&n.status!=="dropped")
    out.push(`<span class="pill blue">${esc(tfLabel(n.timeframe))}</span>`);
  if(n.fixedStart) out.push(`<span class="pill blue">${esc(fmtTime(n.fixedStart))}</span>`);
  if(st==="waiting") out.push(`<span class="pill">Waiting${n.waitingOn?" · "+esc(n.waitingOn):""}</span>`);
  if(st==="blocked"){
    const rq=n.dependencyMode==="required"?openDeps(n):[];
    out.push(`<span class="pill">Blocked${rq.length?" by "+esc(rq[0].title||"Untitled")+(rq.length>1?" +"+(rq.length-1):""):""}</span>`);
  }
  const sd=softDeps(n);
  if(sd.length&&st==="available") out.push(`<span class="pill gray">after ${esc(sd[0].title||"Untitled")}${sd.length>1?" +"+(sd.length-1):""}</span>`);
  if(st==="deferred") out.push(`<span class="pill">Starts ${esc(relDay(n.deferUntil))}</span>`);
  if(st==="someday") out.push(`<span class="pill">Someday</span>`);
  if(n.bumpCount>=4) out.push(`<span class="pill orange">Bumped ${n.bumpCount}×</span>`);
  if(n.recurrence) out.push(`<span class="pill">Repeats</span>`);
  if(effNotify(n).enabled&&state.settings.notif.master) out.push(`<span class="pill gray">🔔</span>`);
  if(opts.showPath&&n.parentId&&n.parentId!==UNSORTED) out.push(esc(pathLabel(n.parentId)));
  if(n.category&&!opts.hideCat){ const c=catByName(n.category);
    out.push(`<span class="pill tint"${c&&c.color?' style="color:'+c.color+'"':''}>${c&&c.icon?c.icon+" ":""}${esc(n.category)}</span>`); }
  if(opts.est&&n.estMaxMinutes) out.push(esc(mins(n.estMaxMinutes)));
  if(n.notes&&!opts.hideNotes) out.push(esc(n.notes.split("\n")[0]).slice(0,70));
  return out;
}

function rowHTML(n,opts={}){
  const done=n.status==="done", dropped=n.status==="dropped";
  const isGroup=n.kind==="group";
  const st=effStatus(n);
  const prog=isGroup?progressOf(n.id):null;
  const stalled=isGroup&&isStalled(n);
  const hideIcons=state.settings.theme.hideTaskIcons&&!opts.forceIcons;

  const mark=isGroup
    ? `<span class="mark">${n.icon?`<span class="nodeicon">${esc(n.icon)}</span>`:(stalled?ICON_FOLDER_S:ICON_FOLDER(n.color))}</span>`
    : `<span class="mark" data-mark="${n.id}"><span class="circle${done?" on":""}${(st==="blocked"||st==="deferred")?" gated":""}"></span></span>`;
  const taskicon=(!isGroup&&n.icon&&!hideIcons)?`<span class="nodeicon" style="align-self:center">${esc(n.icon)}</span>`:"";

  const bits=metaBits(n,opts);
  if(stalled) bits.unshift(`<span class="pill orange">Stalled</span>`);
  const sub=bits.length?`<div class="sub">${bits.join('<span class="dot">·</span>')}</div>`:"";

  const trail=`<span class="trail">${n.flagged&&!done?'<span class="flagdot"></span>':""}${
    prog?`<span class="count tnum">${prog.done}/${prog.total}</span>`:""}${ICON_CHEV}</span>`;

  const acts=dropped
    ? `<button class="act-drop" data-act="restore" data-id="${n.id}">Restore</button><button class="act-del" data-act="delete" data-id="${n.id}">Delete</button>`
    : `<button class="act-done" data-act="done" data-id="${n.id}">${done?"Reopen":"Done"}</button><button class="act-drop" data-act="drop" data-id="${n.id}">Drop</button>`;

  return `<div class="row${done?" done":""}${dropped?" dropped":""}" data-row="${n.id}">
    <div class="actions">${acts}</div>
    <div class="rowin" data-open="${n.id}">${mark}${taskicon}
      <div class="body"><div class="title">${esc(n.title||"Untitled")}</div>${sub}</div>
      ${trail}</div></div>`;
}
const listHTML=(ns,o)=>`<div class="group">${ns.map(n=>rowHTML(n,o)).join("")}</div>`;
const emptyHTML=(h,p,x)=>`<div class="empty"><h2>${esc(h)}</h2><p>${esc(p)}</p>${x||""}</div>`;
const sec=(h,right)=>`<div class="sechead"><span class="h">${esc(h)}</span>${right||""}</div>`;
const secBig=(h,right)=>`<div class="sechead big"><span class="h">${esc(h)}</span>${right||""}</div>`;

/* ---------- TODAY ----------
   Recomputes on every visit, every foreground, every change. There is no
   button to make it current — the plan is always live. */
function renderToday(){
  const d=new Date();
  setTitles("Today",d.toLocaleDateString(undefined,{weekday:"long"}),null);
  $("#subTitle").hidden=false;
  $("#subTitle").textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  content.innerHTML=todayHTML(d);
}

function todayHTML(d){
  const b=todayBands();
  const capMin=hoursLeftToday()*60;                 /* shrinks as the day goes on */
  const over=b.committed>capMin;
  const pct=clamp(b.committed/Math.max(capMin,1)*100,0,100);
  const seg1=Math.min(pct,100), seg2=over?clamp((b.committed-capMin)/Math.max(capMin,1)*100,0,100):0;
  const leftLbl=capMin>=60?(Math.round(capMin/60*10)/10)+"h left today":mins(Math.round(capMin))+" left today";

  let html=`<div class="cap">
    <div class="top"><span><b>${mins(Math.round(b.committed))}</b> lined up</span>
      <span style="color:${over?"var(--orange)":"var(--label2)"}">${over?"+"+mins(Math.round(b.committed-capMin))+" over · ":""}${leftLbl}</span></div>
    <div class="bar"><div class="seg1" style="width:${seg1}%"></div><div class="seg2" style="width:${seg2}%"></div></div></div>`;

  /* THE PLAN — the system's live proposal for the whole day, in order */
  const pl=planFor(d);
  const now=Date.now();
  if(pl.blocks.length){
    html+=sec("The plan",`<span>${esc(fmtHM(sleepFor(d).wake))} – ${esc(fmtHM(sleepFor(d).bed))}</span>`)+`<div class="plan">`;
    for(const bk of pl.blocks){
      if(bk.unavail){
        html+=`<div class="planrow unavail">
          <div class="pt tnum"><b>${esc(fmtTime(bk.start.toISOString()))}</b>${mins(bk.minutes)}</div>
          <div class="pbar"></div>
          <div class="body"><div class="title" style="font-size:15px">${esc(bk.label)}</div>
            <div class="why">unavailable</div></div></div>`;
        continue;
      }
      const n=bk.node, past=bk.end.getTime()<now;
      const cls=(bk.fixed?"":(bk.fuzzy?"ghost fuzzy":"ghost"))+(bk.bg?" bg":"");
      const col=nodeColor(n);
      const cat=n.category&&catByName(n.category);
      const bits=[];
      if(bk.bg) bits.push("⟳ runs alongside");
      else if(bk.fixed) bits.push(n.fixedEnd?"until "+fmtTime(n.fixedEnd):"fixed · open end");
      if(bk.late) bits.push("⚠︎ after its due time");
      else if(bk.dueBy) bits.push("due by "+fmtTime(n.deadline));
      else if(n.deadline) bits.push("due "+relDay(n.deadline));
      if(n.energy==="deep") bits.push("deep focus");
      if(bk.slice) bits.push("part of "+mins(n.estMaxMinutes));
      if(bk.fuzzy) bits.push("~"+mins(bk.minutes)+" guess");
      if(effImportance(n)==="critical"||effImportance(n)==="high") bits.push(IMP_LABEL[effImportance(n)].toLowerCase());
      if(n.context) bits.push(n.context);
      if(n.deliverable) bits.push(n.deliverable.toLowerCase());
      if(cat) bits.push(`<span style="color:${esc(cat.color||"var(--label2)")}">${cat.icon?esc(cat.icon)+" ":""}${esc(cat.name)}</span>`);
      html+=`<div class="planrow ${cls}${past?" past":""}" data-open="${n.id}">
        <span class="mark" data-mark="${n.id}"><span class="circle${n.status==="done"?" on":""}"></span></span>
        <div class="pt tnum"><b>${esc(fmtTime(bk.start.toISOString()))}</b>${mins(bk.minutes)}</div>
        <div class="pbar"${col?` style="--pc:${esc(col)}"`:""}></div>
        <div class="body"><div class="title" style="font-size:15px">${n.icon?esc(n.icon)+" ":""}${esc(n.title||"Untitled")}</div>
          ${bits.length?`<div class="why">${bits.join(" · ")}</div>`:""}</div>
      </div>`;
    }
    if(pl.unplaced.length) html+=`<div class="plannote">${pl.unplaced.length} more didn’t fit before your day ends: ${
      esc(pl.unplaced.slice(0,3).map(u=>u.node.title||"Untitled").join(", "))}${pl.unplaced.length>3?"…":""}. Trim estimates, push deadlines, or let them go.</div>`;
    html+=`</div>`;
  } else if(b.waiting.length||b.blocked.length||b.doneToday.length){
    html+=sec("The plan")+`<div class="plan"><div class="plannote">Nothing to place — everything open is waiting, blocked, or done.</div></div>`;
  }

  if(b.waiting.length) html+=sec("Waiting on")+listHTML(b.waiting,{showPath:true});
  if(b.blocked.length) html+=sec("Blocked","<span>waiting on other tasks</span>")+listHTML(b.blocked,{showPath:true,hideNotes:true});
  if(b.quick.length) html+=sec("Quick wins","<span>under 10m · not in the plan</span>")+listHTML(b.quick,{est:true});
  if(b.doneToday.length) html+=sec("Done today",`<span>${b.doneToday.length}</span>`)+listHTML(b.doneToday,{hideNotes:true});

  if(!pl.blocks.length&&!b.waiting.length&&!b.blocked.length&&!b.quick.length&&!b.doneToday.length)
    html+=emptyHTML("Nothing on deck","Tap + to capture something, or open Browse and give a few things deadlines so they can rank.",
      `<div style="margin-top:14px"><button class="line accent" style="display:inline-flex;border-radius:10px;background:var(--elev);padding:0 18px" data-act="seed">Show me with an example</button></div>`);
  return html;
}

/* ===========================================================================
   CALENDAR — Month (heatmap + timeframe banner + overview), Week (real
   time-of-day columns), Day (true hour-by-hour visual layout).

function calNav(){
  return `<div style="display:flex;justify-content:space-between;padding:2px 16px 10px">
      <button class="navbtn" data-cal-move="-1">‹ Prev</button>
      <button class="navbtn" data-cal-move="0">Today</button>
      <button class="navbtn" data-cal-move="1">Next ›</button></div>`;
}

function monthHTML(proj){
  const cur=state.calCursor;
  const first=new Date(cur.getFullYear(),cur.getMonth(),1);
  const start=addDays(first,-((first.getDay()+7)%7));
  const dows=["S","M","T","W","T","F","S"];
  let cells="";
  for(let i=0;i<42;i++){
    const d=addDays(start,i);
    const out=d.getMonth()!==cur.getMonth();
    const k=dayKey(d);
    const dls=Array.from(state.nodes.values()).filter(n=>n.deadline&&sameDay(n.deadline,d)&&n.status!=="done"&&n.status!=="dropped");
    const fx=fixedOn(d);
    const load=loadOn(d,proj), cap=hoursFor(d)*60;
    const ratio=cap?clamp(load/cap,0,1.35):0;
    const tint=ratio<=0?"transparent":ratio>1
      ? `rgba(255,149,0,${0.10+0.22*clamp(ratio-1,0,1)})`
      : `rgba(var(--accent-rgb),${0.05+0.16*ratio})`;
    let marks="";
    if(state.layers.deadline) marks+=dls.slice(0,3).map(n=>`<span class="m ${n.deadlineType==="soft"?"soft":"dl"}"></span>`).join("");
    if(state.layers.fixed&&fx.length) marks+=`<span class="m fx"></span>`;
    cells+=`<button class="cal${out?" out":""}${sameDay(d,new Date())?" today":""}${sameDay(d,state.calSel)?" sel":""}"
      data-day="${k}" style="background:${tint}">
      <span class="num tnum">${d.getDate()}</span><span class="marks">${marks}</span></button>`;
  }
  /* timeframe banner: fuzzy commitments aimed at this month, never at a day */
  const tfs=timeframeItems().filter(n=>tfInMonth(n.timeframe,cur.getFullYear(),cur.getMonth()));
  const banner=tfs.length?`<div class="tfbanner"><div class="t">Sometime this month</div>${
    tfs.map(n=>`<div class="tfitem"><span data-open="${n.id}" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${n.icon?esc(n.icon)+" ":""}${esc(n.title||"Untitled")}</span>
      <button class="needs" data-needsdate="${n.id}">Needs a date</button></div>`).join("")}</div>`:"";
  return calNav()+banner+`<div class="calhead">${dows.map(x=>`<div>${x}</div>`).join("")}</div>
    <div class="calgrid">${cells}</div>`+daySummaryHTML(state.calSel,proj);
}

/* compact selected-day summary under the month grid */
function daySummaryHTML(d,proj){
  const k=dayKey(d);
  const fx=state.layers.fixed?fixedOn(d):[];
  const dls=state.layers.deadline?Array.from(state.nodes.values())
    .filter(n=>n.deadline&&sameDay(n.deadline,d)&&n.status!=="done"&&n.status!=="dropped"):[];
  const pj=state.layers.projected?(proj[k]||[]):[];
  const load=loadOn(d,proj);
  let html=`<div class="caldate"><span>${d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</span>
    <span>${mins(Math.round(load))} of ${Math.round(hoursFor(d)*10)/10}h</span></div>`;
  if(dls.length) html+=sec("Due this day")+listHTML(dls,{hideNotes:true});
  if(fx.length) html+=sec("Fixed")+`<div class="tl">`+fx.map(n=>
    `<div class="tlrow" data-open="${n.id}"><div class="tltime tnum">${esc(fmtTime(n.fixedStart))}</div>
      <div class="tlbar"></div><div class="body"><div class="title" style="font-size:15px">${esc(n.title)}</div>
      <div class="sub">${n.fixedEnd?esc("until "+fmtTime(n.fixedEnd)):""}</div></div></div>`).join("")+`</div>`;
  if(pj.length) html+=sec("Projected work")+`<div class="tl">`+
    pj.map(p=>`<div class="tlrow" data-open="${p.node.id}">
      <div class="tltime tnum">${esc(mins(p.minutes))}</div><div class="tlbar ghost"></div>
      <div class="body"><div class="title" style="font-size:15px">${esc(p.node.title)}</div>
      <div class="sub">${p.over?'<span class="pill orange">No room before deadline</span>':"due "+esc(relDay(p.node.deadline))}</div>
      </div></div>`).join("")+`</div>`;
  html+=`<div class="field" style="margin-top:14px"><button class="line accent" data-newon="${k}">Add a task on this day</button>
    <button class="line" data-caphours="${k}"><label>Hours available</label><span class="val">${Math.round(hoursFor(d)*10)/10}h</span></button></div>`;
  return html;
}

/* month overview: stats, deadlines, timeframe items, things needing a date */
function monthOverviewHTML(proj){
  const cur=state.calCursor, y=cur.getFullYear(), m=cur.getMonth();
  const inMonth=iso=>{ const d=new Date(iso); return d.getFullYear()===y&&d.getMonth()===m; };
  const dls=Array.from(state.nodes.values())
    .filter(n=>n.deadline&&inMonth(n.deadline)&&n.status!=="done"&&n.status!=="dropped")
    .sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));
  const fx=Array.from(state.nodes.values())
    .filter(n=>n.fixedStart&&inMonth(n.fixedStart)&&n.status!=="dropped")
    .sort((a,b)=>new Date(a.fixedStart)-new Date(b.fixedStart));
  const tfs=timeframeItems().filter(n=>tfInMonth(n.timeframe,y,m));
  let load=0,cap=0;
  const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate();
  for(let i=0;i<days;i++){ const d=addDays(first,i); load+=loadOn(d,proj); cap+=hoursFor(d)*60; }
  let html=secBig("Month overview")+`<div class="statcard">
    <div class="statrow"><span>Deadlines</span><span class="v tnum">${dls.length}</span></div>
    <div class="statrow"><span>Fixed blocks</span><span class="v tnum">${fx.length}</span></div>
    <div class="statrow"><span>Timeframe items</span><span class="v tnum">${tfs.length}</span></div>
    <div class="statrow"><span>Projected load</span><span class="v tnum">${mins(Math.round(load))} of ${Math.round(cap/60)}h</span></div></div>`;
  if(tfs.length) html+=sec("Sometime this month — needs a date")+`<div class="group">${tfs.map(n=>
    `<div class="row" data-row="${n.id}"><div class="rowin" data-open="${n.id}">
      <span class="mark">${n.icon?`<span class="nodeicon">${esc(n.icon)}</span>`:'<span class="circle"></span>'}</span>
      <div class="body"><div class="title">${esc(n.title||"Untitled")}</div>
        <div class="sub"><span class="pill blue">${esc(tfLabel(n.timeframe))}</span></div></div>
      <button class="trail" data-needsdate="${n.id}" style="color:var(--accent);font-size:14px">Set date</button>
    </div></div>`).join("")}</div>`;
  if(dls.length) html+=sec("Deadlines this month")+listHTML(dls.slice(0,12),{hideNotes:true,showPath:true});
  if(fx.length) html+=sec("Fixed blocks this month")+`<div class="tl">`+fx.slice(0,10).map(n=>
    `<div class="tlrow" data-open="${n.id}"><div class="tltime tnum">${esc(fmtDate(n.fixedStart))}</div>
      <div class="tlbar"></div><div class="body"><div class="title" style="font-size:15px">${esc(n.title)}</div>
      <div class="sub">${esc(fmtTime(n.fixedStart))}${n.fixedEnd?"–"+esc(fmtTime(n.fixedEnd)):""}</div></div></div>`).join("")+`</div>`;
  return html;
}

/* ---- week: seven columns with real time-of-day layout ---- */
function weekColsHTML(proj){
  const base=state.calSel;
  const start=addDays(base,-((base.getDay()+7)%7));
  const PPH=34, height=24*PPH+30;
  let cols="";
  for(let i=0;i<7;i++){
    const d=addDays(start,i);
    const k=dayKey(d);
    const sl=sleepFor(d);
    const wake=hmToMin(sl.wake), bed=hmToMin(sl.bed);
    let blocks="";
    blocks+=`<div class="wkblk sleepz" style="top:30px;height:${wake/60*PPH}px"></div>`;
    if(bed>wake) blocks+=`<div class="wkblk sleepz" style="top:${30+bed/60*PPH}px;height:${(1440-bed)/60*PPH}px"></div>`;
    const pl=planFor(d,proj);
    const vis=pl.blocks.filter(bk=>{
      if(bk.unavail) return true;
      if(bk.fixed&&!state.layers.fixed) return false;
      if(!bk.fixed&&!bk.unavail&&!state.layers.projected) return false;
      return true; });
    layoutLanes(vis);
    for(const bk of vis){
      const top=30+(bk.start.getHours()*60+bk.start.getMinutes())/60*PPH;
      const h=Math.max(13,(bk.end-bk.start)/HOUR*PPH);
      if(bk.unavail){
        blocks+=`<div class="wkblk unav" style="top:${top}px;height:${h}px;left:0;right:0">${esc(bk.label||"")}</div>`;
        continue; }
      const cls=(bk.fixed?"":(bk.fuzzy?" fuzzy":" plan2"))+(bk.bg?" bgtask":"");
      const L=bk.lanes||1, li=bk.lane||0;
      const pos=L>1?`left:calc(2px + (100% - 4px)*${li}/${L});width:calc((100% - 4px)/${L} - 2px);right:auto;`:"";
      blocks+=`<div class="wkblk${cls}" data-open="${bk.node.id}" style="top:${top}px;height:${h}px;${pos}">${bk.bg?"⟳ ":""}${esc(bk.node.title||"")}</div>`;
    }
    if(state.layers.deadline){
      const dls=Array.from(state.nodes.values()).filter(n=>n.deadline&&sameDay(n.deadline,d)&&n.status!=="done"&&n.status!=="dropped");
      if(dls.length) blocks+=`<div style="position:absolute;top:16px;left:0;right:0;text-align:center;font-size:9px;color:var(--red)">●${dls.length>1?"×"+dls.length:""}</div>`;
    }
    cols+=`<div class="wkcol" style="height:${height}px" data-dayjump="${k}">
      <div class="wkhd${sameDay(d,new Date())?" today":""}">${d.toLocaleDateString(undefined,{weekday:"short"})}<b class="tnum">${d.getDate()}</b></div>
      ${blocks}</div>`;
  }
  return calNav()+`<div class="wkcolwrap"><div class="wkcols">${cols}</div></div>
    <div class="fieldnote" style="margin-top:10px">Every task, placed. Solid = fixed, dashed = the plan, gradient-edged = fuzzy, hollow stitched = running in the background. Overlaps sit side-by-side. Dimmed bands are sleep and unavailable time. Tap a header to open that day.</div>`;
}

/* ---- day: true hour-by-hour visual layout ---- */
function dayViewHTML(d,proj){
  const k=dayKey(d);
  const sl=sleepFor(d);
  const wake=hmToMin(sl.wake), bed=hmToMin(sl.bed);
  const PPH=56, height=24*PPH+16;
  let inner="";
  for(let h=0;h<24;h++){
    const t=new Date(d); t.setHours(h,0,0,0);
    inner+=`<div class="dayhour tnum" style="top:${h*PPH}px">${t.toLocaleTimeString(undefined,{hour:"numeric"})}</div>`;
  }
  inner+=`<div class="dayblock sleepz" style="top:0;height:${wake/60*PPH}px">Sleep · wake ${esc(fmtHM(sl.wake))}</div>`;
  if(bed>wake) inner+=`<div class="dayblock sleepz" style="top:${bed/60*PPH}px;height:${(1440-bed)/60*PPH}px">Sleep · bed ${esc(fmtHM(sl.bed))}</div>`;

  /* every task for the day, placed by the plan engine; overlapping blocks
     (a meeting during the laundry) sit side-by-side in lanes */
  const pl=planFor(d,proj);
  const vis=pl.blocks.filter(bk=>{
    if(bk.unavail) return true;
    if(bk.fixed&&!state.layers.fixed) return false;
    if(!bk.fixed&&!bk.unavail&&!state.layers.projected) return false;
    return true; });
  const laned=vis.filter(bk=>!bk.unavail);
  layoutLanes(laned);
  for(const bk of vis){
    const top=(bk.start.getHours()*60+bk.start.getMinutes())/60*PPH;
    const h=Math.max(26,(bk.end-bk.start)/HOUR*PPH);
    if(bk.unavail){
      inner+=`<div class="dayblock unav" style="top:${top}px;height:${h}px">${esc(bk.label||"Unavailable")} · ${esc(fmtTime(bk.start.toISOString()))}–${esc(fmtTime(bk.end.toISOString()))}</div>`;
      continue; }
    const cls=(bk.fixed?"":(bk.fuzzy?" fuzzy":" plan2"))+(bk.bg?" bgtask":"");
    const col=nodeColor(bk.node);
    const L=bk.lanes||1, li=bk.lane||0;
    const pos=L>1?`left:calc(56px + (100% - 66px)*${li}/${L});width:calc((100% - 66px)/${L} - 4px);right:auto;`:"";
    const sub=bk.fixed
      ? (bk.bg?"⟳ runs alongside · ":"")+esc(fmtTime(bk.node.fixedStart))+(bk.node.fixedEnd?"–"+esc(fmtTime(bk.node.fixedEnd)):" · open end")
      : [bk.fuzzy?"~"+mins(bk.minutes)+", flexible":mins(bk.minutes),
         bk.late?"⚠︎ after due time":(bk.dueBy?"due by "+esc(fmtTime(bk.node.deadline)):(bk.node.deadline?"due "+esc(relDay(bk.node.deadline)):null)),
         bk.slice?"part of "+mins(bk.node.estMaxMinutes):null].filter(Boolean).join(" · ");
    inner+=`<div class="dayblock${cls}" data-open="${bk.node.id}" style="top:${top}px;height:${h}px;${pos}${col?"border-left-color:"+esc(col)+";":""}">
      <div class="bt">${esc(bk.node.title||"Untitled")}</div><div class="bs">${sub}</div></div>`;
  }
  /* due-time ticks: hard marks where something must be finished */
  if(state.layers.deadline) for(const n of state.nodes.values()){
    if(!n.deadline||!n.deadlineHasTime||!sameDay(n.deadline,d)||n.status==="done"||n.status==="dropped") continue;
    const dl=new Date(n.deadline), top=(dl.getHours()*60+dl.getMinutes())/60*PPH;
    inner+=`<div class="dlTick" data-l="${esc((n.title||"due").slice(0,22))} · ${esc(fmtTime(n.deadline))}" style="top:${top}px"></div>`;
  }
  if(sameDay(d,new Date())){
    const now=new Date(), top=(now.getHours()*60+now.getMinutes())/60*PPH;
    inner+=`<div class="nowline" id="nowline" style="top:${top}px"></div>`;
  }
  for(let h=0;h<24;h++)
    inner+=`<div class="dayfree" data-slot="${k}T${String(h).padStart(2,"0")}:00" style="top:${h*PPH}px;height:${PPH}px"></div>`;

  const dls=state.layers.deadline?Array.from(state.nodes.values())
    .filter(n=>n.deadline&&sameDay(n.deadline,d)&&n.status!=="done"&&n.status!=="dropped"):[];
  const unpl=pl.unplaced.length?`<div class="fieldnote warn" style="margin-top:10px">${pl.unplaced.length} task${pl.unplaced.length===1?"":"s"} didn’t fit this day: ${esc(pl.unplaced.slice(0,3).map(u=>u.node.title||"Untitled").join(", "))}${pl.unplaced.length>3?"…":""}</div>`:"";
  return calNav()
    +(dls.length?sec("Due this day")+listHTML(dls,{hideNotes:true}):"")
    +`<div class="caldate"><span>${d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</span>
       <span>${mins(Math.round(loadOn(d,proj)))} of ${Math.round(hoursFor(d)*10)/10}h</span></div>
     <div class="daywrap"><div class="dayaxis" style="height:${height}px">${inner}</div></div>`
    +unpl
    +`<div class="fieldnote" style="margin-top:10px">Solid blocks are fixed, dashed are the plan, gradient-edged are fuzzy, hollow stitched ones run in the background — things that overlap sit side-by-side. Hatched bands are unavailable time. A red line is a hard due time. Tap an empty slot to put a task there.</div>`;
}

/* ===========================================================================
   BROWSE — the complete view of everything in the system.
   All · Groups · Categories · Contexts · Flagged · Someday · saved filters.
   =========================================================================== */
function matchFilter(n,f){
  if(!f) return true;
  if(f.category&&n.category!==f.category) return false;
  if(f.deliverable&&n.deliverable!==f.deliverable) return false;
  if(f.context&&n.context!==f.context) return false;
  if(f.energy&&n.energy!==f.energy) return false;
  if(f.importance&&effImportance(n)!==f.importance) return false;
  if(f.status&&effStatus(n)!==f.status) return false;
  return true;
}
function matchSearch(n,q){
  if(!q) return true;
  q=q.toLowerCase();
  return (n.title||"").toLowerCase().includes(q)||(n.notes||"").toLowerCase().includes(q);
}
function selbarHTML(){
  const modes=[["all","All"],["groups","Groups"],["cats","Categories"],["contexts","Contexts"],
    ["flagged","Flagged"],["someday","Someday"]];
  let h=`<div class="selbar">`+modes.map(([m,l])=>
    `<button data-bmode="${m}"${state.browseMode===m?' class="on"':""}>${l}</button>`).join("");
  state.filters.forEach((f,i)=>{ h+=`<button data-bmode="filter:${i}"${state.browseMode==="filter:"+i?' class="on"':""}>${esc(f.name)}</button>`; });
  return h+`</div>`;
}
function searchHTML(ph){
  return `<div class="searchwrap">${ICON_SEARCH}<input id="searchIn" type="search" placeholder="${esc(ph||"Search titles and notes")}"
    value="${esc(state.search)}" autocomplete="off"></div>`;
}
/* the smart Browse landing: what needs attention, then the shape of everything */
function browseHomeHTML(){
  const now=new Date();
  const all=Array.from(state.nodes.values()).filter(n=>n.id!==UNSORTED);
  const open=all.filter(n=>n.status!=="done"&&n.status!=="dropped");
  const uns=childrenOf(UNSORTED).filter(n=>n.status!=="done"&&n.status!=="dropped");
  const stalled=open.filter(n=>n.kind==="group"&&isStalled(n));
  const bumped=open.filter(n=>n.kind==="task"&&n.bumpCount>=4);
  const expiring=open.filter(n=>n.expiry&&new Date(n.expiry)>now&&new Date(n.expiry)<addDays(now,7));
  const fups=open.filter(n=>n.status==="waiting"&&n.followUpDate&&new Date(n.followUpDate)<=now);
  const overdue=open.filter(n=>n.kind==="task"&&n.deadline&&startOfDay(n.deadline)<startOfDay(now)&&effStatus(n)==="available");
  const rows=[];
  const arow=(ico,bg,label,n,act)=>`<button class="arow" ${act}>
    <span class="aico" style="background:${bg}">${ico}</span><span>${label}</span>
    <span class="n tnum">${n}${ICON_CHEV}</span></button>`;
  if(uns.length) rows.push(arow("📥","rgba(var(--accent-rgb),.14)","Unsorted — needs a home",uns.length,`data-open="${UNSORTED}"`));
  if(overdue.length) rows.push(arow("⏰","rgba(255,59,48,.14)","Overdue and still doable",overdue.length,`data-bmode="attn:overdue"`));
  if(fups.length) rows.push(arow("👋","rgba(255,149,0,.14)","Follow-ups due — chase these",fups.length,`data-bmode="attn:fups"`));
  if(stalled.length) rows.push(arow("🧱","rgba(255,149,0,.14)","Stalled groups — nothing inside is doable",stalled.length,`data-bmode="attn:stalled"`));
  if(bumped.length) rows.push(arow("↪️","rgba(255,149,0,.14)","Pushed back 4+ times — split or drop",bumped.length,`data-bmode="attn:bumped"`));
  if(expiring.length) rows.push(arow("⌛","rgba(142,142,147,.16)","Goes moot within a week",expiring.length,`data-bmode="attn:expiring"`));
  let html="";
  if(rows.length) html+=sec("Needs attention")+`<div class="attn">${rows.join("")}</div>`;
  const recent=open.filter(n=>n.kind==="task"&&!sameDay(n.touchedAt,now))
    .sort((a,b)=>(b.touchedAt||"").localeCompare(a.touchedAt||"")).slice(0,4);
  if(recent.length) html+=sec("Jump back in","<span>recently touched</span>")+listHTML(recent,{showPath:true,hideNotes:true});
  const groups=childrenOf(null).filter(n=>n.kind==="group"&&n.status!=="dropped");
  if(groups.length) html+=sec("Groups")+listHTML(groups,{forceIcons:true});
  return html;
}
function attnItems(key){
  const now=new Date();
  const open=Array.from(state.nodes.values()).filter(n=>n.id!==UNSORTED&&n.status!=="done"&&n.status!=="dropped");
  if(key==="overdue") return open.filter(n=>n.kind==="task"&&n.deadline&&startOfDay(n.deadline)<startOfDay(now)&&effStatus(n)==="available");
  if(key==="fups") return open.filter(n=>n.status==="waiting"&&n.followUpDate&&new Date(n.followUpDate)<=now);
  if(key==="stalled") return open.filter(n=>n.kind==="group"&&isStalled(n));
  if(key==="bumped") return open.filter(n=>n.kind==="task"&&n.bumpCount>=4);
  if(key==="expiring") return open.filter(n=>n.expiry&&new Date(n.expiry)>now&&new Date(n.expiry)<addDays(now,7));
  return [];
}

   LOG — Activity · Weekly review · Monthly review
   =========================================================================== */
function renderLog(){
  setTitles("Log","Log",null);
  $("#navExtra").innerHTML=`<div class="seg mini">
    <button data-lmode="activity"${state.logMode==="activity"?' class="on"':""}>Activity</button>
    <button data-lmode="weekly"${state.logMode==="weekly"?' class="on"':""}>Weekly</button>
    <button data-lmode="monthly"${state.logMode==="monthly"?' class="on"':""}>Monthly</button></div>`;
  if(state.logMode==="weekly") content.innerHTML=weeklyReviewHTML();
  else if(state.logMode==="monthly") content.innerHTML=monthlyReviewHTML();
  else content.innerHTML=activityHTML();
}
function activityHTML(){
  const items=Array.from(state.nodes.values())
    .filter(n=>n.status==="done"||n.status==="dropped")
    .sort((a,b)=>(b.completedAt||b.touchedAt).localeCompare(a.completedAt||a.touchedAt));
  if(!items.length) return emptyHTML("Nothing finished yet",
    "Completed and dropped work collects here so you can see what you got done.",null);
  const days=new Map();
  for(const n of items){ const key=new Date(n.completedAt||n.touchedAt).toDateString();
    if(!days.has(key)) days.set(key,[]); days.get(key).push(n); }
  const t=new Date().toDateString(), y=new Date(Date.now()-DAY).toDateString();
  const doneCount=items.filter(n=>n.status==="done").length;
  return `<div class="sechead"><span class="h">${doneCount} completed</span><span>${items.length-doneCount} dropped</span></div>`+
    Array.from(days.entries()).map(([key,ns])=>{
      const lbl=key===t?"Today":key===y?"Yesterday":new Date(key).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
      return sec(lbl,`<span>${ns.length}</span>`)+listHTML(ns,{showPath:true,hideNotes:true});
    }).join("");
}
function weeklyReviewHTML(){
  const all=Array.from(state.nodes.values()).filter(n=>n.id!==UNSORTED);
  const stalled=all.filter(n=>n.kind==="group"&&isStalled(n));
  const bumped=all.filter(n=>n.bumpCount>=4&&n.status!=="done"&&n.status!=="dropped");
  const stale=all.filter(n=>n.kind==="task"&&n.status!=="done"&&n.status!=="dropped"&&
    (Date.now()-new Date(n.touchedAt))/DAY>=14);
  const follow=all.filter(n=>n.status==="waiting"&&n.followUpDate&&new Date(n.followUpDate)<=new Date());
  const uns=childrenOf(UNSORTED).filter(n=>n.status!=="done"&&n.status!=="dropped");
  /* timeframe items whose window opens within ~3 weeks: time to pin a date */
  const tfSoon=timeframeItems().filter(n=>{ const s=tfStart(n.timeframe);
    return s&&(s-Date.now())/DAY<21; });
  const sect=(t2,ns,note,extra)=>ns.length
    ? sec(t2,`<span>${ns.length}</span>`)+`<div class="fieldnote" style="margin:2px 20px 8px">${esc(note)}</div>`+(extra||listHTML(ns,{showPath:true,hideNotes:true}))
    : "";
  const tfList=tfSoon.length?`<div class="group">${tfSoon.map(n=>
    `<div class="row"><div class="rowin" data-open="${n.id}">
      <span class="mark"><span class="circle"></span></span>
      <div class="body"><div class="title">${esc(n.title||"Untitled")}</div>
      <div class="sub"><span class="pill blue">${esc(tfLabel(n.timeframe))}</span></div></div>
      <button class="trail" data-needsdate="${n.id}" style="color:var(--accent);font-size:14px">Set date</button></div></div>`).join("")}</div>`:"";
  const body=sect("Timeframes to pin down",tfSoon,"Their window is under three weeks away. Give each a real date or push the window.",tfList)+
    sect("Stalled groups",stalled,"Nothing inside these can be acted on. Add a next step or mark one unblocked.")+
    sect("Pushed back repeatedly",bumped,"Four or more deferrals. Split, redefine, or drop.")+
    sect("Untouched 14 days",stale,"Still open, no movement. Decide if it is real.")+
    sect("Follow-ups due",follow,"You were waiting on someone. Time to chase.")+
    sect("Unsorted",uns,"Captured but never filed.");
  const backup=backupDue()?`<div class="tfbanner" style="background:rgba(255,149,0,.14)"><div class="t" style="color:var(--orange)">Backup overdue</div>
    <div class="tfitem"><span>No export in the last week. Snapshots on this phone will not survive losing the phone.</span></div>
    <div class="tfitem"><button class="needs" data-act="exportjson" style="padding-left:0">Export a backup now</button></div></div>`:"";
  return backup+(body||emptyHTML("Nothing to review","No stalled groups, no repeated deferrals, nothing going stale.",null));
}
function monthlyReviewHTML(){
  const cur=state.logMonth, y=cur.getFullYear(), m=cur.getMonth();
  const mStart=new Date(y,m,1), mEnd=new Date(y,m+1,0,23,59,59);
  const pStart=new Date(y,m-1,1), pEnd=new Date(y,m,0,23,59,59);
  const inRange=(iso,a,b)=>iso&&new Date(iso)>=a&&new Date(iso)<=b;
  const all=Array.from(state.nodes.values()).filter(n=>n.id!==UNSORTED&&n.kind==="task");
  const created=all.filter(n=>inRange(n.createdAt,mStart,mEnd));
  const completed=all.filter(n=>n.status==="done"&&inRange(n.completedAt,mStart,mEnd));
  const dropped=all.filter(n=>n.status==="dropped"&&inRange(n.touchedAt,mStart,mEnd));
  const pCreated=all.filter(n=>inRange(n.createdAt,pStart,pEnd)).length;
  const pCompleted=all.filter(n=>n.status==="done"&&inRange(n.completedAt,pStart,pEnd)).length;

  const nav=`<div style="display:flex;justify-content:space-between;padding:2px 16px 10px">
    <button class="navbtn" data-lm-move="-1">‹ Prev</button>
    <span style="align-self:center;font-weight:600">${cur.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</span>
    <button class="navbtn" data-lm-move="1">Next ›</button></div>`;
  if(!created.length&&!completed.length&&!dropped.length)
    return nav+emptyHTML("Quiet month","Nothing was created or finished in "+cur.toLocaleDateString(undefined,{month:"long"})+".",null);

  /* medians and accuracy */
  const med=a=>{ if(!a.length)return null; const s=[...a].sort((x,z)=>x-z);
    return s.length%2?s[(s.length-1)/2]:(s[s.length/2-1]+s[s.length/2])/2; };
  const cycleDays=med(completed.map(n=>(new Date(n.completedAt)-new Date(n.createdAt))/DAY));
  const accPairs=completed.filter(n=>n.actualMinutes&&n.estMaxMinutes);
  const accRatio=med(accPairs.map(n=>n.actualMinutes/n.estMaxMinutes));
  const rate=created.length?Math.round(all.filter(n=>inRange(n.createdAt,mStart,mEnd)&&n.status==="done").length/created.length*100):null;
  const dropRate=(completed.length+dropped.length)?Math.round(dropped.length/(completed.length+dropped.length)*100):0;

  /* per-day completions for the chart + busiest/lightest/streak */
  const days=new Date(y,m+1,0).getDate();
  const perDay=Array(days).fill(0);
  for(const n of completed) perDay[new Date(n.completedAt).getDate()-1]++;
  let busiest=0,bI=-1; perDay.forEach((v,i)=>{ if(v>busiest){busiest=v;bI=i;} });
  let streak=0,cur2=0; perDay.forEach(v=>{ cur2=v?cur2+1:0; streak=Math.max(streak,cur2); });

  /* category + group breakdown */
  const byCat={}; for(const n of completed){ const c=n.category||"Uncategorized"; byCat[c]=(byCat[c]||0)+1; }
  const byGroup={}; for(const n of completed){
    let top=n; const anc=ancestors(n.id); if(anc.length) top=anc[anc.length-1];
    const g=top.id===n.id?(n.parentId===UNSORTED?"Unsorted":"Loose"):(top.title||"Untitled");
    byGroup[g]=(byGroup[g]||0)+1; }
  const longestOpen=all.filter(n=>n.status!=="done"&&n.status!=="dropped")
    .sort((a,b)=>a.createdAt.localeCompare(b.createdAt)).slice(0,3);

  const dCr=created.length-pCreated, dCo=completed.length-pCompleted;
  const delta=v=>v===0?"unchanged":(v>0?"up "+v:"down "+Math.abs(v));
  let prose=`You finished <b>${completed.length}</b> task${completed.length===1?"":"s"} and created <b>${created.length}</b> — completions ${delta(dCo)} and captures ${delta(dCr)} from last month. `;
  if(rate!=null) prose+=`Of what you created this month, ${rate}% is already done. `;
  if(cycleDays!=null) prose+=`Median time from capture to done: <b>${cycleDays<1?"under a day":Math.round(cycleDays)+" days"}</b>. `;
  if(accRatio!=null) prose+=`Where you logged actual time, work ran <b>${Math.round(accRatio*100)}%</b> of estimate. `;
  else prose+=`No actual times logged, so estimate accuracy cannot be measured yet — log "actually took" when you finish something. `;
  if(dropped.length) prose+=`Drop rate ${dropRate}% (${dropped.length} dropped). `;
  if(bI>=0&&busiest) prose+=`Busiest day: the ${bI+1}${["st","nd","rd"][((bI+1)%10)-1]&&(bI+1)%100<11||((bI+1)%100)>13?["st","nd","rd"][((bI+1)%10)-1]||"th":"th"} with ${busiest} done. `;
  if(streak>1) prose+=`Longest streak: ${streak} consecutive days with at least one completion.`;

  const chartDays=svgBars(perDay,days,"completions per day");
  const catBars=svgHBars(Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,6));
  const grpBars=svgHBars(Object.entries(byGroup).sort((a,b)=>b[1]-a[1]).slice(0,6));

  return nav+`<div class="statcard"><h4>The month in one paragraph</h4><p>${prose}</p></div>
    <div class="statcard"><div style="display:flex;gap:24px">
      <div><div class="bignum tnum">${completed.length}</div><p>completed</p></div>
      <div><div class="bignum tnum">${created.length}</div><p>created</p></div>
      <div><div class="bignum tnum">${dropped.length}</div><p>dropped</p></div></div>
      ${chartDays}</div>
    ${Object.keys(byCat).length?`<div class="statcard"><h4>By category</h4>${catBars}</div>`:""}
    ${Object.keys(byGroup).length?`<div class="statcard"><h4>By group</h4>${grpBars}</div>`:""}
    ${longestOpen.length?sec("Longest open")+listHTML(longestOpen,{showPath:true,hideNotes:true}):""}`;
}
/* tiny inline SVG charts — no library */
function svgBars(vals,n,label){
  const W=320,H=84,max=Math.max(1,...vals);
  const bw=Math.max(2,Math.floor((W-4)/n)-2);
  let bars="";
  vals.forEach((v,i)=>{ const h=Math.round(v/max*(H-22));
    bars+=`<rect x="${2+i*(bw+2)}" y="${H-16-h}" width="${bw}" height="${Math.max(h,v?2:0)}" rx="1.5" fill="var(--accent)" opacity="${v?1:.18}"/>`;
    if(!v) bars+=`<rect x="${2+i*(bw+2)}" y="${H-18}" width="${bw}" height="2" rx="1" fill="var(--fill)"/>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${bars}
    <text x="2" y="${H-3}" font-size="9" fill="var(--label2)">1</text>
    <text x="${W-14}" y="${H-3}" font-size="9" fill="var(--label2)">${n}</text></svg>`;
}
function svgHBars(entries){
  const W=320,rh=22,H=entries.length*rh+2,max=Math.max(1,...entries.map(e=>e[1]));
  let out="";
  entries.forEach(([k,v],i)=>{ const w=Math.max(3,Math.round(v/max*(W-120)));
    out+=`<text x="0" y="${i*rh+14}" font-size="11" fill="var(--label)">${esc(k.length>14?k.slice(0,13)+"…":k)}</text>
      <rect x="104" y="${i*rh+5}" width="${w}" height="11" rx="3" fill="var(--accent)"/>
      <text x="${108+w}" y="${i*rh+14}" font-size="11" fill="var(--label2)">${v}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${out}</svg>`;
}

$$(".tab").forEach(t=>t.addEventListener("click",()=>{
  if(state.tab===t.dataset.tab&&t.dataset.tab==="browse"){ state.browseCat=null; state.browseCtx=null; state.path=[]; state.search=""; }
  state.tab=t.dataset.tab; scrollEl.scrollTop=0; render(); }));
$("#backBtn").addEventListener("click",()=>{
  if(state.tab==="browse"){
    if(state.browseMode.startsWith("attn:")){ state.browseMode="all"; state.search=""; }
    else if(state.browseCat){ state.browseCat=null; state.search=""; }
    else if(state.browseCtx){ state.browseCtx=null; state.search=""; }
    else state.path.pop();
  }
  scrollEl.scrollTop=0; render(); });

/* swipe — only engages on a real horizontal drag */
let sw=null;
function closeSwipe(){
  if(state.openSwipe){
    const r=document.querySelector(`[data-row="${state.openSwipe}"]`);
    if(r){ r.classList.remove("opened","swiping"); const i=r.querySelector(".rowin"); if(i) i.style.transform=""; }
    state.openSwipe=null;
  }
}
content.addEventListener("touchstart",e=>{
  const row=e.target.closest(".row");
  if(!row) return;
  if(state.openSwipe&&state.openSwipe!==row.dataset.row) closeSwipe();
  sw={row,inner:row.querySelector(".rowin"),x:e.touches[0].clientX,y:e.touches[0].clientY,
      open:state.openSwipe===row.dataset.row,lock:null};
  clearTimeout(state.pressTimer);
  state.pressTimer=setTimeout(()=>{ if(sw&&sw.lock===null){ row.classList.add("pressed"); } },90);
},{passive:true});
content.addEventListener("touchmove",e=>{
  if(!sw) return;
  const dx=e.touches[0].clientX-sw.x, dy=e.touches[0].clientY-sw.y;
  if(sw.lock===null){
    if(Math.abs(dx)<10&&Math.abs(dy)<10) return;
    clearTimeout(state.pressTimer); sw.row.classList.remove("pressed");
    sw.lock=(Math.abs(dx)>Math.abs(dy)*1.4)?"x":"y";
    if(sw.lock==="x"){ sw.inner.classList.add("dragging"); sw.row.classList.add("swiping"); }
    else { sw=null; return; }
  }
  if(sw.lock!=="x") return;
  const base=sw.open?-160:0;
  sw.inner.style.transform=`translateX(${Math.min(0,Math.max(-200,base+dx))}px)`;
},{passive:true});
function endSwipe(){
  clearTimeout(state.pressTimer);
  if(!sw){ $$(".row.pressed").forEach(r=>r.classList.remove("pressed")); return; }
  sw.row.classList.remove("pressed");
  const inner=sw.inner; inner.classList.remove("dragging");
  if(sw.lock==="x"){
    const m=/translateX\((-?[\d.]+)px\)/.exec(inner.style.transform);
    const t=m?parseFloat(m[1]):0;
    if(t<-56){ inner.style.transform="translateX(-160px)"; state.openSwipe=sw.row.dataset.row; sw.row.classList.add("opened"); }
    else { inner.style.transform=""; state.openSwipe=null; sw.row.classList.remove("swiping","opened"); }
  } else sw.row.classList.remove("swiping");
  sw=null;
}
content.addEventListener("touchend",endSwipe,{passive:true});
content.addEventListener("touchcancel",endSwipe,{passive:true});

document.addEventListener("click",async e=>{
  if(e.target.closest("#sheet")||e.target.closest(".tabs")||e.target.closest("#fab")||
     e.target.closest("#moreBtn")||e.target.closest("#backBtn")) return;
  const act=e.target.closest("[data-act]");
  if(act){
    const a=act.dataset.act, n=act.dataset.id?byId(act.dataset.id):null;
    closeSwipe();
    if(a==="done"&&n){ await toggleDone(n); }
    if(a==="drop"&&n){ await setStatus(n,"dropped"); toast("Dropped"); }
    if(a==="restore"&&n){ await setStatus(n,"available"); toast("Restored"); }
    if(a==="delete"&&n){ if(!confirmDelete(n)) return; await purge(n.id); toast("Deleted"); }
    if(a==="toggledone"){ state.showDone=!state.showDone; }
    if(a==="seed"){ await seed(); }
    if(a==="newgroup"){ openGroupSheet(null); return; }
    if(a==="exportjson"){ await doExport("json"); }
    render(); return;
  }
  if(state.openSwipe){ closeSwipe(); return; }

  const gt=e.target.closest("[data-gotoday]");
  if(gt){ state.tab="calendar"; state.calMode="day"; state.calSel=new Date(gt.dataset.gotoday+"T12:00:00");
    state.calCursor=startOfDay(state.calSel); scrollEl.scrollTop=0; render(); return; }
  const bm=e.target.closest("[data-bmode]");
  if(bm){ state.browseMode=bm.dataset.bmode; state.browseCat=null; state.browseCtx=null;
    state.path=[]; state.search=""; scrollEl.scrollTop=0; render(); return; }
  const bc=e.target.closest("[data-cat]");
  if(bc){ state.browseCat=bc.dataset.cat; state.search=""; scrollEl.scrollTop=0; render(); return; }
  const bx=e.target.closest("[data-ctx]");
  if(bx){ state.browseCtx=bx.dataset.ctx; state.search=""; scrollEl.scrollTop=0; render(); return; }
  const lm=e.target.closest("[data-lmode]");
  if(lm){ state.logMode=lm.dataset.lmode; scrollEl.scrollTop=0; render(); return; }
  const lmm=e.target.closest("[data-lm-move]");
  if(lmm){ state.logMonth=new Date(state.logMonth.getFullYear(),state.logMonth.getMonth()+Number(lmm.dataset.lmMove),1); render(); return; }
  const nd=e.target.closest("[data-needsdate]");
  if(nd){ openNeedsDate(nd.dataset.needsdate); return; }
  const sl=e.target.closest("[data-slot]");
  if(sl&&!e.target.closest("[data-open]")){ openCapture({fixedSlot:sl.dataset.slot}); return; }
  const dj=e.target.closest("[data-dayjump]");
  if(dj&&!e.target.closest("[data-open]")){ state.calMode="day"; state.calSel=new Date(dj.dataset.dayjump+"T12:00:00"); render(); return; }

  const day=e.target.closest("[data-day]");
  if(day){ state.calSel=new Date(day.dataset.day+"T12:00:00");
    if(state.calMode==="month") state.calCursor=startOfDay(state.calSel);
    render(); return; }
  const mv=e.target.closest("[data-cal-move]");
  if(mv){ const v=Number(mv.dataset.calMove);
    if(v===0){ state.calCursor=startOfDay(new Date()); state.calSel=startOfDay(new Date()); }
    else if(state.calMode==="month") state.calCursor=new Date(state.calCursor.getFullYear(),state.calCursor.getMonth()+v,1);
    else { const step=state.calMode==="week"?7:1; state.calSel=addDays(state.calSel,v*step); state.calCursor=startOfDay(state.calSel); }
    render(); return; }
  const cs=e.target.closest("[data-cal]");
  if(cs){ state.calMode=cs.dataset.cal; render(); return; }
  const ly=e.target.closest("[data-layer]");
  if(ly){ state.layers[ly.dataset.layer]=!state.layers[ly.dataset.layer]; render(); return; }
  const no=e.target.closest("[data-newon]");
  if(no){ openCapture({deadlineDay:no.dataset.newon}); return; }
  const ch=e.target.closest("[data-caphours]");
  if(ch){ await askHours(ch.dataset.caphours); return; }
  const cr=e.target.closest("[data-crumb]");
  if(cr){ state.path=state.path.slice(0,Number(cr.dataset.crumb)); scrollEl.scrollTop=0; render(); return; }

  const mark=e.target.closest("[data-mark]");
  if(mark){ const n=byId(mark.dataset.mark); if(n){ await toggleDone(n); render(); } return; }
  const open=e.target.closest("[data-open]");
  if(open){ openNode(open.dataset.open); return; }
});
function openNode(id){
  const n=byId(id); if(!n) return;
  if(n.kind==="group"&&state.tab==="browse"&&(state.browseMode==="groups"||state.browseMode==="all")){
    state.browseMode="groups"; state.path=buildPath(n.id); scrollEl.scrollTop=0; render();
  } else if(n.kind==="group") openGroupSheet(n.id);
  else openSheet(n.id);
}
function buildPath(id){ const chain=[]; let c=byId(id);
  while(c){ chain.unshift(c.id); c=c.parentId?byId(c.parentId):null; } return chain; }
function confirmDelete(n){
  const k=descendants(n.id).length;
  return confirm(k?`Delete “${n.title}” and ${k} item${k===1?"":"s"} inside it? This cannot be undone.`
                  :`Delete “${n.title}”? This cannot be undone.`);
}
async function askHours(k){
  const cur=state.dayHours[k]!=null?state.dayHours[k]:Math.round(hoursFor(new Date(k+"T12:00:00"))*10)/10;
  const v=prompt("Hours available on "+k,String(cur));
  if(v===null) return;
  const num=Number(v);
  if(isNaN(num)||num<0||num>24){ toast("Enter a number between 0 and 24"); return; }
  state.dayHours[k]=num; await saveSettings(); render();
}

/* ---------- status changes + recurrence (kept from v1) ---------- */
async function setStatus(n,status){
  if(status==="done"&&n.recurrence) return completeRecurring(n);
  n.status=status; n.completedAt=(status==="done")?nowISO():null; await save(n);
}
async function toggleDone(n){
  if(n.status==="done"){ n.status="available"; n.completedAt=null; await save(n); toast("Reopened"); }
  else { await setStatus(n,"done"); toast("Completed"); }
}
function nextOccurrence(n,from){
  const r=n.recurrence; if(!r) return null;
  const base=startOfDay(from);
  if(r.mode==="afterDone"||!n.deadline) return addDays(base,r.every||1);
  if(r.type==="days") return addDays(startOfDay(n.deadline),r.every||1);
  if(r.type==="weekdays"){
    const set=(r.days&&r.days.length)?r.days:[1,2,3,4,5];
    let d=addDays(startOfDay(n.deadline),1), g=0;
    while(!set.includes(d.getDay())&&g++<31) d=addDays(d,1);
    return d;
  }
  if(r.type==="months"){ const d=new Date(n.deadline); d.setMonth(d.getMonth()+(r.every||1)); return startOfDay(d); }
  return addDays(base,r.every||1);
}
async function completeRecurring(n){
  const archive=newNode(Object.assign({},n,{id:uid(),recurrence:null,status:"done",
    completedAt:nowISO(),createdAt:n.createdAt}));
  state.nodes.set(archive.id,archive); await putNode(archive);
  const next=nextOccurrence(n,new Date());
  if(n.deadline&&next){ const t=new Date(n.deadline); const d=new Date(next);
    d.setHours(t.getHours(),t.getMinutes(),0,0); n.deadline=d.toISOString(); }
  else if(next) n.deadline=next.toISOString();
  if(n.fixedStart&&next){ const s=new Date(n.fixedStart), e2=n.fixedEnd?new Date(n.fixedEnd):null;
    const dur=e2?e2-s:0; const ns=new Date(next); ns.setHours(s.getHours(),s.getMinutes(),0,0);
    n.fixedStart=ns.toISOString(); n.fixedEnd=dur?new Date(ns.getTime()+dur).toISOString():null; }
  n.status="available"; n.completedAt=null; n.bumpCount=0;
  await save(n);
  toast("Done — next one set for "+relDay(n.deadline||next.toISOString()));
}

/* ===========================================================================
   SHEETS — iOS-style navigation stack.
   ‹ Back walks up; the root shows Close. Nothing needs a Save press:
   edits to an existing item persist as you make them (debounced write).
   The right-hand button exists only for true one-shot actions
   (Add a new task, Split, Set date).
   =========================================================================== */
const sheet=$("#sheet"), scrim=$("#scrim"), sheetBody=$("#sheetBody");
const SHEET={stack:[],current:null,leave:null,action:null};

function showSheet(title,html,onAction,actionLabel){
  $("#sheetTitle").textContent=title;
  const done=$("#sheetDone");
  SHEET.action=onAction||null;
  if(onAction){ done.hidden=false; done.textContent=actionLabel||"Done"; }
  else done.hidden=true;
  sheetBody.innerHTML=html; sheetBody.scrollTop=0;
  const lbl=$("#sheetBackLbl"), chev=$("#sheetBack svg");
  if(SHEET.stack.length){ chev.style.display=""; lbl.textContent=SHEET.stack[SHEET.stack.length-1].title||"Back"; }
  else { chev.style.display="none"; lbl.textContent="Close"; }
}
function animBody(dir){ sheetBody.classList.remove("fwd","back"); void sheetBody.offsetWidth;
  sheetBody.classList.add(dir); }
function sheetRoot(draw){
  SHEET.stack=[]; SHEET.current=draw; SHEET.leave=null;
  draw(); animBody("fwd");
  scrim.classList.add("on"); sheet.classList.add("on");
}
function sheetPush(draw){
  SHEET.stack.push({draw:SHEET.current,title:$("#sheetTitle").textContent,leave:SHEET.leave});
  SHEET.current=draw; SHEET.leave=null;
  draw(); animBody("fwd");
}
function sheetPop(){
  if(SHEET.leave){ const f=SHEET.leave; SHEET.leave=null; try{f();}catch(e){} }
  if(SHEET.stack.length){
    const p=SHEET.stack.pop();
    SHEET.current=p.draw; SHEET.leave=p.leave;
    p.draw(); animBody("back");
  } else closeSheet();
}
async function closeSheet(){
  if(SHEET.leave){ const f=SHEET.leave; SHEET.leave=null; try{f();}catch(e){} }
  await flushTaskSave();
  sheet.classList.remove("on"); scrim.classList.remove("on");
  state.editing=null; state.draft=null; state.capDraft=null;
  SHEET.stack=[]; SHEET.current=null; SHEET.action=null;
  render();
}
scrim.addEventListener("click",()=>{ closeSheet(); });
$("#sheetBack").addEventListener("click",()=>{ sheetPop(); });
$("#sheetDone").addEventListener("click",async()=>{ if(SHEET.action) await SHEET.action(); });

/* autosave for the task detail sheet */
let _saveT=null,_dirty=false;
function queueTaskSave(){ if(!state.editing) return; _dirty=true;
  clearTimeout(_saveT); _saveT=setTimeout(flushTaskSave,300); }
async function flushTaskSave(){
  clearTimeout(_saveT);
  if(!_dirty) return; _dirty=false;
  const n=applyDraft(); if(n) await save(n);
}
const CLRX=(k,has)=>has?`<span class="clearx" data-clearx="${esc(k)}" role="button" aria-label="Clear">✕</span>`:"";

/* ---------- option picker (generic, stack-based) ---------- */
function openOptions(cfg){
  sheetPush(()=>drawOptions(cfg));
}
function drawOptions({title,options,current,onPick,allowNew,allowNone,stay}){
  const rows=(allowNone?[{v:null,l:"None"}]:[]).concat(options.map(o=>typeof o==="string"?{v:o,l:o}:o));
  showSheet(title,
    `<div class="group">${rows.map(r=>`<button class="pickrow" data-v="${r.v===null?"":esc(r.v)}">
        <span>${esc(r.l)}${r.note?`<span class="path">${esc(r.note)}</span>`:""}</span>${r.v===current?'<span class="tick">✓</span>':""}</button>`).join("")}</div>
     ${allowNew?`<div class="field" style="margin-top:18px"><div class="line">
        <input class="big" id="optNew" placeholder="Add a new one…" autocapitalize="words"></div>
        <button class="line accent" id="optAdd">Add</button></div>`:""}`,null);
  sheetBody.querySelectorAll("[data-v]").forEach(b=>b.addEventListener("click",async()=>{
    await onPick(b.dataset.v===""?null:b.dataset.v); if(!stay) sheetPop(); }));
  const add=$("#optAdd");
  if(add){ const go=async()=>{ const v=$("#optNew").value.trim(); if(!v) return;
      await onPick(v,true); if(!stay) sheetPop(); };
    add.addEventListener("click",go);
    $("#optNew").addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();go();} }); }
}

/* ---------- task detail sheet ---------- */
function openSheet(id){
  const n=byId(id); if(!n) return;
  if(n.kind==="group") return openGroupSheet(id);
  state.editing=id; state.draft=JSON.parse(JSON.stringify(n));
  sheetRoot(drawSheet);
}
function applyDraft(){
  const n=byId(state.editing), d=state.draft; if(!n||!d) return null;
  Object.assign(n,{title:(d.title||"").trim()||n.title,notes:d.notes,kind:d.kind,childMode:d.childMode,
    parentId:d.parentId,order:d.order,status:d.status,waitingOn:d.waitingOn,followUpDate:d.followUpDate,
    importance:d.importance,importanceOverridden:d.importanceOverridden,
    deadline:d.deadline,deadlineType:d.deadlineType,deadlineHasTime:!!d.deadlineHasTime,
    expiry:d.expiry,deferUntil:d.deferUntil,
    durationMode:d.fixedStart?"fixed":(d.estMaxMinutes!=null?"estimate":"none"),
    estMinMinutes:d.estMinMinutes,estMaxMinutes:d.estMaxMinutes,
    fixedStart:d.fixedStart,fixedEnd:d.fixedEnd,background:!!d.background,actualMinutes:d.actualMinutes,
    category:d.category,deliverable:d.deliverable,context:d.context,energy:d.energy,
    flagged:d.flagged,bumpCount:d.bumpCount,recurrence:d.recurrence,links:d.links,
    dependsOn:d.dependsOn||[],dependencyMode:d.dependencyMode||"none",
    timeframe:d.timeframe,icon:d.icon,color:d.color,notify:d.notify});
  return n;
}
function todayRank(id){
  const b=todayBands();
  const list=[...b.must,...b.should];
  const i=list.findIndex(x=>x.id===id);
  return i>=0?i+1:null;
}
function recurLabel(r){
  if(!r) return "Never";
  if(r.mode==="afterDone") return "Every "+(r.every||1)+"d after done";
  if(r.type==="days") return r.every===1?"Every day":"Every "+r.every+" days";
  if(r.type==="weekdays") return "Weekdays";
  if(r.type==="months") return r.every===1?"Every month":"Every "+r.every+" months";
  return "Custom";
}
function notifyValLabel(n,d){
  if(!state.settings.notif.master) return "Off (master switch)";
  if(d.notify) return d.notify.enabled?withOffsets(d.notify).offsets.map(offsetLabel).join(", "):"Off for this task";
  const eff=effNotify(Object.assign({},n,{notify:null,category:d.category,parentId:d.parentId}));
  return eff.enabled?"On · from group/category":"Off · from defaults";
}

function drawSheet(){
  const d=state.draft, n=byId(state.editing);
  if(!d||!n){ closeSheet(); return; }
  const src=importanceSource(n);
  const st=effStatus(n);
  const rank=todayRank(n.id);
  const deps=(d.dependsOn||[]).map(byId).filter(Boolean);
  const waitedBy=dependents(d.id);
  const cat=catByName(d.category);

  let h=`<div class="field">
    <div class="line"><input class="big" id="fTitle" value="${esc(d.title)}" placeholder="Title" autocapitalize="sentences"></div>
    <div class="line" style="align-items:flex-start;padding-top:12px"><textarea id="fNotes" placeholder="Notes">${esc(d.notes||"")}</textarea></div>
  </div>
  <div class="why">${esc(explain(n,rank))}</div>
  <div class="fieldnote" style="margin-top:-6px">Changes save as you make them.</div>`;

  /* WHAT IT IS */
  h+=secBig("What it is")+`<div class="field">
    <button class="line" data-pick="importance"><label>Importance</label><span class="val">${IMP_LABEL[effImportance(n)]}${src?" · from "+esc(src.title||"parent"):""}</span>${ICON_CHEV}</button>
    <button class="line" data-pick="category"><label>Category</label><span class="val${d.category?" set":""}">${cat&&cat.icon?esc(cat.icon)+" ":""}${esc(d.category||"None")}</span>${CLRX("category",!!d.category)}${ICON_CHEV}</button>
    <button class="line" data-pick="deliverable"><label>Deliverable</label><span class="val">${esc(d.deliverable||"None")}</span>${CLRX("deliverable",!!d.deliverable)}${ICON_CHEV}</button>
    <button class="line" id="fIcon"><label>Icon</label><span class="val">${d.icon?esc(d.icon):"None"}</span>${CLRX("icon",!!d.icon)}${ICON_CHEV}</button>
    <button class="line" id="fFlag"><label>Do today</label><span class="val"></span><span class="toggle${d.flagged?" on":""}"></span></button>
  </div>
  <div class="fieldnote">Category is a cross-cutting label (Health, Work) that follows the task anywhere in the tree. ${src?"Importance is inherited from the group; pick one here to override it for this item only.":""}</div>`;

  /* WHEN */
  const fixedVal=d.fixedStart?fmtDate(d.fixedStart)+" "+fmtTime(d.fixedStart)+(d.fixedEnd?"–"+fmtTime(d.fixedEnd):"")+(d.background?" ⟳":""):"None";
  h+=secBig("When")+`<div class="field">
    <div class="line"><label>Due</label><input type="date" id="fDeadline" value="${dateInput(d.deadline)}">${CLRX("deadline",!!d.deadline)}</div>
    ${d.deadline?`<div class="line"><label>…by</label><input type="time" id="fDlTime" value="${d.deadlineHasTime?timeInput(d.deadline):""}">${CLRX("dltime",!!d.deadlineHasTime)}</div>
    <button class="line" id="fDeadlineType"><label>How firm</label><span class="val">${d.deadlineType==="soft"?"Soft — self-set":"Hard — real consequence"}</span>${ICON_CHEV}</button>`:""}
    <button class="line" id="fFixed"><label>At a set time</label><span class="val${d.fixedStart?" set":""}">${esc(fixedVal)}</span>${CLRX("fixed",!!d.fixedStart)}${ICON_CHEV}</button>
  </div>
  <div class="fieldnote">Two simple ideas: <b>Due</b> is when it must be finished (no time picked = end of that day). <b>At a set time</b> pins it to the calendar like an appointment — and can be marked as running in the background. ✕ clears anything.</div>
  <div class="field"><button class="line" id="fMoreWhen"><label style="color:var(--accent)">More timing options</label><span class="val">${[d.timeframe?tfLabel(d.timeframe):null,d.deferUntil?"starts "+relDay(d.deferUntil):null,d.expiry?"moot "+relDay(d.expiry):null].filter(Boolean).join(" · ")||""}</span>${ICON_CHEV}</button>
  ${d._moreWhen?`
    ${!d.deadline?`<button class="line" id="fTimeframe"><label>Timeframe</label><span class="val${d.timeframe?" set":""}">${d.timeframe?esc(tfLabel(d.timeframe)):"None"}</span>${CLRX("timeframe",!!d.timeframe)}${ICON_CHEV}</button>`:""}
    <div class="line"><label>Start on or after</label><input type="date" id="fDefer" value="${dateInput(d.deferUntil)}">${CLRX("defer",!!d.deferUntil)}</div>
    <div class="line"><label>Moot after</label><input type="date" id="fExpiry" value="${dateInput(d.expiry)}">${CLRX("expiry",!!d.expiry)}</div>`:""}
  </div>
  ${d._moreWhen?`<div class="fieldnote">A timeframe ("sometime in March") is a commitment to a period, not a date. "Start on or after" hides it until then. "Moot after" means past that date it stops mattering and drops itself.</div>`:""}`;

  /* EFFORT — no modes to choose; just say roughly how long it takes */
  h+=secBig("Effort")+`<div class="field">
    <div class="line"><label>Takes about</label><input type="number" inputmode="numeric" id="fEstMin" value="${d.estMinMinutes??""}" placeholder="min"> <span class="val" style="flex:0 0 auto">to</span> <input type="number" inputmode="numeric" id="fEstMax" value="${d.estMaxMinutes??""}" placeholder="max"> <span class="unit">min</span></div>
    <button class="line" data-pick="energy"><label>Energy</label><span class="val">${d.energy?(d.energy==="deep"?"Deep focus":"Shallow"):"None"}</span>${CLRX("energy",!!d.energy)}${ICON_CHEV}</button>
    <button class="line" data-pick="context"><label>Context</label><span class="val">${esc(d.context||"None")}</span>${CLRX("context",!!d.context)}${ICON_CHEV}</button>
    ${n.status==="done"?`<div class="line"><label>Actually took</label><input type="number" inputmode="numeric" id="fActual" value="${d.actualMinutes??""}" placeholder="min"><span class="unit">min</span></div>`:""}
  </div>
  <div class="fieldnote">A rough range is enough — the plan uses the high end, quick wins the low end. Deep focus tasks are steered into your deep-focus windows from Settings. ${n.status==="done"?"Logging what it actually took feeds the monthly estimate-accuracy stat.":""}</div>`;

  /* DEPENDENCIES */
  const depNames=deps.map(x=>`<div class="line"><label style="font-weight:400">${esc(x.title||"Untitled")}</label>
    <span class="val">${x.status==="done"?"done ✓":statusLabel(effStatus(x)).toLowerCase()}</span>
    <button data-rmdep="${x.id}" style="color:var(--red);font-size:14px;flex:0 0 auto">Remove</button></div>`).join("");
  h+=secBig("Dependencies")+`<div class="seg" id="fDepMode">
      <button data-dm="none"${(d.dependencyMode||"none")==="none"?' class="on"':""}>None</button>
      <button data-dm="required"${d.dependencyMode==="required"?' class="on"':""}>Required</button>
      <button data-dm="soft"${d.dependencyMode==="soft"?' class="on"':""}>Soft</button></div>
  <div class="fieldnote">Required: this waits, shown as Blocked, until the tasks below are done. Soft: still doable now, but ranked lower and labeled "after …".</div>`;
  if(d.dependencyMode!=="none") h+=`<div class="field">${depNames}
      <button class="line accent" id="fAddDep">Add a task this waits on</button></div>`;
  if(waitedBy.length) h+=`<div class="field">${waitedBy.map(x=>
      `<button class="line" data-opennode="${x.id}"><label style="font-weight:400">${esc(x.title||"Untitled")}</label><span class="val">waits on this</span>${ICON_CHEV}</button>`).join("")}</div>`;

  /* NOTIFICATIONS */
  h+=secBig("Notifications")+`<div class="field">
    <button class="line" id="fNotify"><label>Alerts</label><span class="val${d.notify?" set":""}">${esc(notifyValLabel(n,d))}</span>${ICON_CHEV}</button>
  </div>
  <div class="fieldnote">Defaults come from this task's group, then its category. Set here to override for this task only. Alerts show as banners while the app is open; for lock-screen alerts, export to Apple Calendar from Settings › Notifications.</div>`;

  /* STATUS */
  h+=secBig("Status")+`<div class="field">
    <button class="line" data-pick="status"><label>State</label><span class="val">${statusLabel(d.status)}${st!==d.status?" · now "+statusLabel(st).toLowerCase():""}</span>${ICON_CHEV}</button>
    ${d.status==="waiting"?`<div class="line"><label>Waiting on</label><input class="big" id="fWaitOn" style="text-align:right" value="${esc(d.waitingOn||"")}" placeholder="who or what"></div>
      <div class="line"><label>Follow up</label><input type="date" id="fFollow" value="${dateInput(d.followUpDate)}">${CLRX("follow",!!d.followUpDate)}</div>`:""}
    <button class="line" data-pick="recurrence"><label>Repeats</label><span class="val">${recurLabel(d.recurrence)}</span>${CLRX("recur",!!d.recurrence)}${ICON_CHEV}</button>
    <button class="line" id="fMove"><label>In group</label><span class="val">${esc(pathLabel(d.parentId))}</span>${ICON_CHEV}</button>
    ${d.bumpCount?`<div class="line"><label>Pushed back</label><span class="val">${d.bumpCount}×</span></div>`:""}
    <div class="line"><label>Added</label><span class="val">${fmtDate(n.createdAt,{month:"short",day:"numeric",year:"numeric"})}</span></div>
  </div>
  <div class="fieldnote">Where a task lives is set only by moving it — "In group" is its place in the folder tree, not a label.</div>`;
  if(d.bumpCount>=4) h+=`<div class="fieldnote warn">Pushed back ${d.bumpCount} times. That usually means it is badly defined or you do not actually want it. Split it or drop it.</div>`;

  /* actions */
  h+=`<div class="field">
    ${n.status==="done"?`<button class="line accent" data-do="reopen">Mark not done</button>`
      :`<button class="line accent" data-do="done">Mark done</button>`}
    <button class="line accent" data-do="tomorrow">Push to tomorrow</button>
    ${n.status==="dropped"?`<button class="line accent" data-do="restore">Restore</button>`
      :`<button class="line accent" data-do="drop">Drop</button>`}
  </div>`;

  /* ADVANCED */
  h+=secBig("Advanced")+`<div class="field">
    <button class="line accent" data-do="addchild">Add steps inside</button>
    <button class="line accent" data-do="split">Split into several</button>
    <button class="line accent" data-do="duplicate">Duplicate</button>
    <button class="line accent" data-do="togroup">Convert to group</button>
  </div>
  <div class="field"><button class="line danger" data-do="delete">Delete permanently</button></div>
  <div class="fieldnote">Dropping keeps the record in your Log. Deleting does not.</div>`;

  showSheet("Task",h,null);
  wireDetail();
}

function wireDetail(){
  const d=state.draft, n=byId(state.editing);
  const on=(sel,ev,fn)=>{ const el=$(sel); if(el) el.addEventListener(ev,fn); };
  const Q=queueTaskSave;

  on("#fTitle","input",e=>{ d.title=e.target.value; Q(); });
  const nt=$("#fNotes");
  if(nt){ const grow=()=>{ nt.style.height="auto"; nt.style.height=Math.max(80,nt.scrollHeight)+"px"; };
    nt.addEventListener("input",e=>{ d.notes=e.target.value; grow(); Q(); }); grow(); }

  $$("#fDepMode button").forEach(b=>b.addEventListener("click",()=>{
    d.dependencyMode=b.dataset.dm; Q(); drawSheet(); }));

  /* IMPORTANT: date/time inputs are never redrawn on "change" — iOS fires
     change while the wheels are still open, and rebuilding the DOM then
     kicks the picker shut. State updates silently; the sheet redraws on blur. */
  on("#fDeadline","change",e=>{
    const t=d.deadlineHasTime?timeInput(d.deadline):"17:00";
    d.deadline=e.target.value?new Date(e.target.value+"T"+t+":00").toISOString():null;
    if(d.deadline&&!d.deadlineType) d.deadlineType="hard";
    if(!d.deadline){ d.deadlineType=null; d.deadlineHasTime=false; }
    if(d.deadline) d.timeframe=null; Q(); });
  on("#fDeadline","blur",()=>setTimeout(drawSheet,80));
  on("#fDlTime","change",e=>{
    if(!d.deadline) return;
    if(e.target.value){ d.deadline=new Date(dateInput(d.deadline)+"T"+e.target.value+":00").toISOString(); d.deadlineHasTime=true; }
    else { d.deadline=new Date(dateInput(d.deadline)+"T17:00:00").toISOString(); d.deadlineHasTime=false; }
    Q(); });
  on("#fDlTime","blur",()=>setTimeout(drawSheet,80));
  on("#fDeadlineType","click",()=>openOptions({title:"Deadline type",
    options:[{v:"hard",l:"Hard — real consequence"},{v:"soft",l:"Soft — self-set"}],
    current:d.deadlineType,onPick:v=>{ d.deadlineType=v; Q(); }}));
  on("#fTimeframe","click",()=>openTimeframe(d.timeframe,tf=>{ d.timeframe=tf; Q(); }));
  on("#fDefer","change",e=>{ d.deferUntil=e.target.value?new Date(e.target.value+"T00:00:00").toISOString():null; Q(); });
  on("#fExpiry","change",e=>{ d.expiry=e.target.value?new Date(e.target.value+"T23:59:00").toISOString():null; Q(); });
  on("#fEstMin","input",e=>{ d.estMinMinutes=e.target.value===""?null:Math.max(0,Number(e.target.value)); Q(); });
  on("#fEstMax","input",e=>{ d.estMaxMinutes=e.target.value===""?null:Math.max(0,Number(e.target.value)); Q(); });
  on("#fActual","input",e=>{ d.actualMinutes=e.target.value===""?null:Math.max(0,Number(e.target.value)); Q(); });
  on("#fFixed","click",()=>openFixedSheet(d,Q));
  on("#fMoreWhen","click",()=>{ d._moreWhen=!d._moreWhen; drawSheet(); });
  on("#fWaitOn","input",e=>{ d.waitingOn=e.target.value; Q(); });
  on("#fFollow","change",e=>{ d.followUpDate=e.target.value?new Date(e.target.value+"T09:00:00").toISOString():null; Q(); });
  on("#fFlag","click",()=>{ d.flagged=!d.flagged; Q(); drawSheet(); });
  on("#fMove","click",()=>openPicker(d,Q));
  on("#fIcon","click",()=>openIconPicker(TASK_ICONS,d.icon,v=>{ d.icon=v; Q(); }));
  on("#fNotify","click",()=>openNotifyEditor(d.notify,v=>{ d.notify=v; Q(); },
    "Overrides the group and category defaults for this task only."));
  on("#fAddDep","click",()=>openDepPicker(d,Q));
  sheetBody.querySelectorAll("[data-rmdep]").forEach(b=>b.addEventListener("click",()=>{
    d.dependsOn=(d.dependsOn||[]).filter(x=>x!==b.dataset.rmdep); Q(); drawSheet(); }));
  sheetBody.querySelectorAll("[data-opennode]").forEach(b=>b.addEventListener("click",async()=>{
    await flushTaskSave(); openSheet(b.dataset.opennode); }));
  sheetBody.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>pickField(b.dataset.pick,state.draft,Q)));
  sheetBody.querySelectorAll("[data-do]").forEach(b=>b.addEventListener("click",()=>detailAction(b.dataset.do)));
  sheetBody.querySelectorAll("[data-clearx]").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation();
    const k=b.dataset.clearx;
    if(k==="deadline"){ d.deadline=null; d.deadlineType=null; d.deadlineHasTime=false; }
    if(k==="dltime"){ d.deadline=new Date(dateInput(d.deadline)+"T17:00:00").toISOString(); d.deadlineHasTime=false; }
    if(k==="timeframe") d.timeframe=null;
    if(k==="defer") d.deferUntil=null;
    if(k==="expiry") d.expiry=null;
    if(k==="fixed"){ d.fixedStart=null; d.fixedEnd=null; d.background=false; d.durationMode=d.estMaxMinutes?"estimate":"none"; }
    if(k==="follow") d.followUpDate=null;
    if(k==="category") d.category=null;
    if(k==="deliverable") d.deliverable=null;
    if(k==="context") d.context=null;
    if(k==="energy") d.energy=null;
    if(k==="icon") d.icon=null;
    if(k==="recur") d.recurrence=null;
    Q(); drawSheet(); }));
}

/* searchable multi-select dependency picker with full group paths */
function openDepPicker(d,onChange){
  sheetPush(()=>drawDepPicker(d,onChange));
}
function drawDepPicker(d,onChange){
  const drawList=q=>{
    const cands=Array.from(state.nodes.values())
      .filter(x=>x.id!==d.id&&x.id!==UNSORTED&&x.kind==="task"&&!isDescendantOf(x.id,d.id)&&x.id!==d.parentId)
      .filter(x=>!q||(x.title||"").toLowerCase().includes(q.toLowerCase()))
      .sort((a,b)=>{ const ao=a.status==="done"||a.status==="dropped", bo=b.status==="done"||b.status==="dropped";
        if(ao!==bo) return ao?1:-1; return score(b)-score(a); }).slice(0,40);
    return cands.map(x=>{
      const onIt=(d.dependsOn||[]).includes(x.id);
      return `<button class="pickrow" data-dep="${x.id}"><span>${esc(x.title||"Untitled")}
        <span class="path">${esc(fullPath(x.parentId))}${x.status==="done"?" · done":""}</span></span>
        ${onIt?'<span class="tick">✓</span>':""}</button>`; }).join("")||`<div class="empty" style="padding:30px"><p>No matches.</p></div>`;
  };
  showSheet("Waits on",
    `<div class="searchwrap" style="margin-top:2px">${ICON_SEARCH}<input id="depSearch" type="search" placeholder="Search tasks" autocomplete="off"></div>
     <div class="fieldnote" style="margin:0 20px 12px">Tap to add or remove. Circular chains are refused. ‹ Back when you're done.</div>
     <div class="group" id="depList">${drawList("")}</div>`,null);
  const wire=()=>{ $("#depList").querySelectorAll("[data-dep]").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.dep;
    if((d.dependsOn||[]).includes(id)){ d.dependsOn=d.dependsOn.filter(x=>x!==id); }
    else{
      const cyc=findCycle(d.id,id);
      if(cyc){ const names=cyc.map(x=>byId(x)?byId(x).title||"Untitled":"?");
        toast("That loops: "+names.join(" → ")+" → this"); return; }
      d.dependsOn=(d.dependsOn||[]).concat(id);
      if(d.dependencyMode==="none") d.dependencyMode="required";
    }
    if(onChange) onChange();
    $("#depList").innerHTML=drawList($("#depSearch").value); wire();
  })); };
  wire();
  $("#depSearch").addEventListener("input",e=>{ $("#depList").innerHTML=drawList(e.target.value); wire(); });
}

/* timeframe picker */
function openTimeframe(cur,cb){
  sheetPush(()=>drawTimeframe(cur,cb));
}
function drawTimeframe(cur,cb){
  const now=new Date(), opts=[];
  for(let i=0;i<12;i++){ const d=new Date(now.getFullYear(),now.getMonth()+i,1);
    opts.push({v:"month|"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),
      l:d.toLocaleDateString(undefined,{month:"long",year:"numeric"}),g:"Month"}); }
  const seasons=["spring","summer","fall","winter"];
  let sy=now.getFullYear(), si=Math.floor(((now.getMonth()+1)%12)/3);
  for(let i=0;i<4;i++){ const s=seasons[(si+i)%4]; const y=sy+Math.floor((si+i)/4);
    opts.push({v:"season|"+y+"-"+s,l:SEASON_LABEL[s]+" "+y,g:"Season"}); }
  const q0=Math.floor(now.getMonth()/3);
  for(let i=0;i<4;i++){ const q=(q0+i)%4, y=now.getFullYear()+Math.floor((q0+i)/4);
    opts.push({v:"quarter|"+y+"-q"+(q+1),l:"Q"+(q+1)+" "+y,g:"Quarter"}); }
  opts.push({v:"year|"+now.getFullYear(),l:String(now.getFullYear()),g:"Year"});
  opts.push({v:"year|"+(now.getFullYear()+1),l:String(now.getFullYear()+1),g:"Year"});
  const curV=cur?cur.type+"|"+cur.value:null;
  let h=`<div class="fieldnote" style="margin:0 20px 12px">"Sometime in…" — a commitment to a period. It shows on the month banner and the weekly review, never on a day, until you give it a real date.</div>
    <div class="group"><button class="pickrow" data-tf=""><span>None</span>${!cur?'<span class="tick">✓</span>':""}</button></div>`;
  let g="";
  for(const o of opts){
    if(o.g!==g){ h+=(g?`</div>`:"")+sec(o.g)+`<div class="group">`; g=o.g; }
    h+=`<button class="pickrow" data-tf="${o.v}"><span>${esc(o.l)}</span>${o.v===curV?'<span class="tick">✓</span>':""}</button>`;
  }
  h+=`</div>`;
  showSheet("Timeframe",h,null);
  sheetBody.querySelectorAll("[data-tf]").forEach(b=>b.addEventListener("click",()=>{
    const v=b.dataset.tf;
    cb(v?{type:v.split("|")[0],value:v.split("|")[1]}:null);
    sheetPop();
  }));
}

/* one-tap "needs a date": convert a timeframe into a real deadline */
function openNeedsDate(id){
  const n=byId(id); if(!n) return;
  sheetRoot(()=>drawNeedsDate(n));
}
function drawNeedsDate(n){
  const s=tfStart(n.timeframe), e=tfEnd(n.timeframe);
  const def=s&&e?new Date((s.getTime()+e.getTime())/2):addDays(new Date(),14);
  showSheet("Pin a date",
    `<div class="fieldnote" style="margin:0 20px 14px">"${esc(n.title||"Untitled")}" is aimed at ${esc(tfLabel(n.timeframe))}. Give it a real deadline and it joins the calendar and the plan like everything else.</div>
     <div class="field"><div class="line"><label>Deadline</label><input type="date" id="ndDate" value="${dayKey(def)}"></div></div>
     <div class="seg" id="ndType"><button data-t="soft" class="on">Soft — self-set</button><button data-t="hard">Hard — real consequence</button></div>`,
    async()=>{
      const v=$("#ndDate").value; if(!v){ closeSheet(); return; }
      n.deadline=new Date(v+"T17:00:00").toISOString();
      n.deadlineType=$("#ndType .on").dataset.t; n.timeframe=null;
      await save(n); closeSheet(); toast("Dated — it now ranks like everything else");
    },"Set date");
  $$("#ndType button").forEach(b=>b.addEventListener("click",()=>{
    $$("#ndType button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); }));
}

/* notify override editor — applied automatically when you go back */
function openNotifyEditor(cur,cb,note){
  const cfg=cur?JSON.parse(JSON.stringify(cur)):{enabled:true,offsets:[],atTime:null};
  let cleared=false;
  sheetPush(()=>drawNotifyEditor(cfg,note,()=>{ cleared=true; cb(null); }));
  SHEET.leave=()=>{ if(!cleared) cb(cfg); };
}
function drawNotifyEditor(cfg,note,onClear){
  const allOffsets=[0,10,30,60,180,1440,2880,10080];
  showSheet("Alerts",
    `<div class="field"><button class="line" id="neOn"><label>Alerts for this</label><span class="val"></span><span class="toggle${cfg.enabled?" on":""}"></span></button></div>
     ${note?`<div class="fieldnote">${esc(note)}</div>`:""}
     ${cfg.enabled?sec("Lead times","<span>pick any</span>")+`<div class="group">${allOffsets.map(o=>
       `<button class="pickrow" data-off="${o}"><span>${esc(offsetLabel(o))}</span>${(cfg.offsets||[]).includes(o)?'<span class="tick">✓</span>':""}</button>`).join("")}</div>
     <div class="fieldnote" style="margin-top:10px">None picked = use the app default (${state.settings.notif.offsets.map(offsetLabel).join(", ")}).</div>
     <div class="field"><div class="line"><label>Day-level alerts at</label><input type="time" id="neAt" value="${cfg.atTime||state.settings.notif.atTime}"></div></div>
     <div class="fieldnote">Used for deadlines that are dates rather than times. Applied when you go back.</div>`:""}
     <div class="field" style="margin-top:8px"><button class="line accent" id="neClear">Use inherited default</button></div>`,
    null);
  $("#neOn").addEventListener("click",()=>{ cfg.enabled=!cfg.enabled; drawNotifyEditor(cfg,note,onClear); });

  sheetBody.querySelectorAll("[data-off]").forEach(b=>b.addEventListener("click",()=>{
