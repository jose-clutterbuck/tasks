function pickField(which,d,onChange){
  const Q=onChange||(()=>{});
  if(which==="importance") return openOptions({title:"Importance",
    options:[{v:"critical",l:"Critical — something breaks"},{v:"high",l:"High"},{v:"normal",l:"Normal"},{v:"low",l:"Low"}],
    current:d.importanceOverridden?d.importance:null,
    onPick:v=>{ d.importance=v; d.importanceOverridden=true; Q(); }});
  if(which==="category") return openOptions({title:"Category",
    options:state.settings.categories.map(c=>({v:c.name,l:(c.icon?c.icon+"  ":"")+c.name})),
    current:d.category,allowNew:true,allowNone:true,
    onPick:async(v,isNew)=>{ if(isNew&&v&&!catByName(v)){
        state.settings.categories.push({name:v,icon:CAT_ICONS[state.settings.categories.length%CAT_ICONS.length],color:PALETTE[state.settings.categories.length%PALETTE.length]});
        await saveSettings(); }
      d.category=v; Q(); }});
  if(which==="deliverable") return openOptions({title:"Deliverable",options:state.settings.deliverables,
    current:d.deliverable,allowNew:true,allowNone:true,
    onPick:async(v,isNew)=>{ if(isNew&&v&&!state.settings.deliverables.includes(v)){ state.settings.deliverables.push(v); await saveSettings(); }
      d.deliverable=v; Q(); }});
  if(which==="context") return openOptions({title:"Context",options:state.settings.contexts,
    current:d.context,allowNew:true,allowNone:true,
    onPick:async(v,isNew)=>{ if(isNew&&v&&!state.settings.contexts.includes(v)){ state.settings.contexts.push(v); await saveSettings(); }
      d.context=v; Q(); }});
  if(which==="energy") return openOptions({title:"Energy",
    options:[{v:"deep",l:"Deep focus"},{v:"shallow",l:"Shallow"}],current:d.energy,allowNone:true,
    onPick:v=>{ d.energy=v; Q(); }});
  if(which==="status") return openOptions({title:"State",
    options:[{v:"available",l:"Available"},{v:"waiting",l:"Waiting on someone"},
             {v:"someday",l:"Someday — not committed"},{v:"done",l:"Done"},{v:"dropped",l:"Dropped"}],
    current:d.status,onPick:v=>{ d.status=v; if(v==="done"&&!d.completedAt) d.completedAt=nowISO();
      if(v!=="done") d.completedAt=null; Q(); }});
  if(which==="recurrence") return openOptions({title:"Repeats",
    options:[{v:"none",l:"Never"},{v:"daily",l:"Every day"},{v:"weekdays",l:"Weekdays"},
             {v:"weekly",l:"Every 7 days"},{v:"monthly",l:"Every month"},{v:"after3",l:"3 days after I finish it"},
             {v:"after7",l:"7 days after I finish it"},{v:"after30",l:"30 days after I finish it"}],
    current:recurKey(d.recurrence),
    onPick:v=>{ d.recurrence=recurFrom(v); Q(); }});
}
function recurKey(r){ if(!r) return "none";
  if(r.mode==="afterDone") return "after"+r.every;
  if(r.type==="days") return r.every===1?"daily":"weekly";
  if(r.type==="weekdays") return "weekdays";
  if(r.type==="months") return "monthly"; return "none"; }
function recurFrom(v){
  if(v==="none") return null;
  if(v==="daily") return {type:"days",every:1};
  if(v==="weekly") return {type:"days",every:7};
  if(v==="weekdays") return {type:"weekdays",days:[1,2,3,4,5]};
  if(v==="monthly") return {type:"months",every:1};
  if(v&&v.indexOf("after")===0) return {mode:"afterDone",every:Number(v.slice(5))};
  return null;
}

async function detailAction(a){
  await flushTaskSave();
  const n=byId(state.editing); if(!n) return;
  if(a==="delete"){ if(!confirmDelete(n)) return; await purge(n.id); closeSheet(); toast("Deleted"); return; }
  if(a==="done"){ await setStatus(n,"done"); closeSheet(); toast("Completed"); return; }
  if(a==="reopen"){ n.status="available"; n.completedAt=null; await save(n); closeSheet(); toast("Reopened"); return; }
  if(a==="drop"){ await setStatus(n,"dropped"); closeSheet(); toast("Dropped"); return; }
  if(a==="restore"){ await setStatus(n,"available"); closeSheet(); toast("Restored"); return; }
  if(a==="tomorrow"){
    const t=addDays(new Date(),1);
    if(n.deadline){ const old=new Date(n.deadline); t.setHours(old.getHours(),old.getMinutes(),0,0); n.deadline=t.toISOString(); }
    else { t.setHours(17,0,0,0); n.deadline=t.toISOString(); n.deadlineType=n.deadlineType||"soft"; }
    n.bumpCount=(n.bumpCount||0)+1; n.flagged=false;
    await save(n); closeSheet();
    toast(n.bumpCount>=4?"Pushed to tomorrow — that is "+n.bumpCount+" times now":"Pushed to tomorrow"); return; }
  if(a==="duplicate"){
    await create(Object.assign({},n,{id:uid(),title:n.title+" (copy)",order:nextOrder(n.parentId),
      status:"available",completedAt:null,createdAt:nowISO(),touchedAt:nowISO(),bumpCount:0,dependsOn:[...(n.dependsOn||[])]}));
    closeSheet(); toast("Duplicated"); return; }
  if(a==="togroup"){ n.kind="group"; await save(n); openGroupSheet(n.id); return; }
  if(a==="addchild"){ openAddChild(n); return; }
  if(a==="split"){ openSplit(n); return; }
}

/* ---------- add child / split ---------- */
function openAddChild(n){ sheetPush(()=>drawAddChild(n)); }
function drawAddChild(n){
  showSheet("Steps inside",
    `<div class="fieldnote" style="margin:0 20px 14px">One per line. ${esc(n.title)} becomes a group holding them. The same shorthand works here — "call agent tomorrow 20m".</div>
     <div class="field"><div class="line" style="align-items:flex-start;padding-top:12px">
       <textarea id="bulk" style="min-height:200px" placeholder="Conduct neighborhood research&#10;Speak to leasing agents 30m&#10;Schedule a tour @phone"></textarea></div></div>`,
    async()=>{
      const lines=$("#bulk").value.split("\n").map(s=>s.trim()).filter(Boolean);
      if(!lines.length){ sheetPop(); return; }
      n.kind="group"; await save(n);
      let o=nextOrder(n.id);
      for(const l of lines){ const p=parseNL(l); await create(Object.assign({title:p.title||l,parentId:n.id,order:o+=1000},p.patch)); }
      closeSheet(); toast(lines.length+" step"+(lines.length===1?"":"s")+" added");
    },"Add");
  setTimeout(()=>{ const b=$("#bulk"); if(b) b.focus(); },350);
}
function openSplit(n){ sheetPush(()=>drawSplit(n)); }
function drawSplit(n){
  showSheet("Split",
    `<div class="fieldnote" style="margin:0 20px 14px">One per line. The original becomes a group and each line becomes a task inside it. Notes are kept on the group.</div>
     <div class="field"><div class="line" style="align-items:flex-start;padding-top:12px">
       <textarea id="bulk" style="min-height:180px">${esc(n.title)}</textarea></div></div>`,
    async()=>{
      const lines=$("#bulk").value.split("\n").map(s=>s.trim()).filter(Boolean);
      if(lines.length<2){ toast("Give it at least two lines"); return; }
      n.kind="group"; await save(n);
      let o=nextOrder(n.id);
      for(const l of lines){ const p=parseNL(l); await create(Object.assign({title:p.title||l,parentId:n.id,order:o+=1000,
        importance:n.importance,category:n.category,context:n.context},p.patch)); }
      closeSheet(); toast("Split into "+lines.length);
    },"Split");
}

/* ---------- "In group" picker ---------- */
function openPicker(d,onChange){ sheetPush(()=>drawPicker(d,onChange)); }
function drawPicker(d,onChange){
  const rows=[{id:null,label:"Browse (top level)",depth:0},{id:UNSORTED,label:"Unsorted",depth:0}];
  (function walk(p,depth){ for(const c of childrenOf(p)){ if(c.id===UNSORTED||c.kind!=="group") continue;
    rows.push({id:c.id,label:c.title||"Untitled",depth,icon:c.icon,color:c.color}); walk(c.id,depth+1); } })(null,1);
  showSheet("In group",
    `<div class="sechead"><span class="h">Move to</span></div>
     <div class="group">${rows.map(r=>{
       const bad=r.id===d.id||(r.id&&isDescendantOf(r.id,d.id));
       return `<button class="pickrow${bad?" disabled":""}" data-pick2="${r.id===null?"":r.id}" ${bad?"disabled":""}
         style="padding-left:${16+r.depth*18}px">${r.id===null||r.id===UNSORTED?"":(r.icon?`<span class="nodeicon">${esc(r.icon)}</span>`:ICON_FOLDER(r.color))}
         <span>${esc(r.label)}</span>${r.id===d.parentId?'<span class="tick">✓</span>':""}</button>`;}).join("")}</div>
     <div class="fieldnote" style="margin-top:18px">Where something lives is set only here, by moving it. Groups nest as deep as you need; nothing can move into itself.</div>`,null);
  sheetBody.querySelectorAll("[data-pick2]").forEach(b=>b.addEventListener("click",()=>{
    const v=b.dataset.pick2; d.parentId=v===""?null:v; d.order=nextOrder(d.parentId);
    if(onChange) onChange(); sheetPop(); }));
}

/* ===========================================================================
   GROUP SHEET — groups get their own surface. Existing groups save as you
   edit; a brand-new one is created with the Create button.
   =========================================================================== */
let _gSaveT=null;
function openGroupSheet(id){
  const isNew=!id;
  let g=id?byId(id):null;
  const d=g?JSON.parse(JSON.stringify(g)):newNode({kind:"group",parentId:
    (state.tab==="browse"&&state.browseMode==="groups"&&state.path.length)?state.path[state.path.length-1]:null});
  d.kind="group";
  const G=()=>{ if(!g) return;                       /* autosave for existing groups */
    Object.assign(g,d,{title:(d.title||"").trim()||g.title});
    clearTimeout(_gSaveT); _gSaveT=setTimeout(()=>save(g),300); };
  const draw=()=>{
    const kids=g?descendants(d.id):[];
    const prog=g?progressOf(d.id):null;
    const cat=catByName(d.category);
    const stalled=g&&isStalled(g);
    const gn=state.settings.notif.perGroup[d.id];
    showSheet(isNew?"New group":"Group",
    `<div class="field">
      <div class="line"><input class="big" id="gTitle" value="${esc(d.title)}" placeholder="Group name" autocapitalize="sentences"></div>
      <div class="line" style="align-items:flex-start;padding-top:12px"><textarea id="gNotes" placeholder="What this group is for (one line shows under its name)">${esc(d.notes||"")}</textarea></div>
    </div>
    ${isNew?"":`<div class="fieldnote" style="margin-top:-6px">Changes save as you make them.</div>`}
    ${stalled?`<div class="fieldnote warn">Stalled — nothing inside can be acted on. Add a next step or unblock one.</div>`:""}
    ${secBig("Looks")}
    <div class="field">
      <button class="line" id="gIcon"><label>Icon</label><span class="val">${d.icon?esc(d.icon):"Folder"}</span>${CLRX("gicon",!!d.icon)}${ICON_CHEV}</button>
      <button class="line" data-pick="category"><label>Category</label><span class="val${d.category?" set":""}">${cat&&cat.icon?esc(cat.icon)+" ":""}${esc(d.category||"None")}</span>${CLRX("gcat",!!d.category)}${ICON_CHEV}</button>
    </div>
    <div class="colorrow" id="gColors">${PALETTE.map(c=>`<button data-col="${c}" style="background:${c}"${d.color===c?' class="on"':""}></button>`).join("")}
      <button data-col="" style="background:var(--fill);color:var(--label2);font-size:11px;display:flex;align-items:center;justify-content:center"${!d.color?' class="on"':""}>none</button></div>
    <div class="fieldnote">Icon and color mark this group's folder and its tasks' pills everywhere.</div>
    ${secBig("How it works")}
    <div class="seg" id="gMode">
      <button data-mode="parallel"${d.childMode!=="sequential"?' class="on"':""}>Any order</button>
      <button data-mode="sequential"${d.childMode==="sequential"?' class="on"':""}>In order</button></div>
    <div class="fieldnote">In order means only the first unfinished step counts as available; the rest wait their turn.</div>
    <div class="field">
      <button class="line" data-pick="importance"><label>Importance</label><span class="val">${d.importanceOverridden?IMP_LABEL[d.importance]:"Not set"}</span>${ICON_CHEV}</button>
      <div class="line"><label>Deadline</label><input type="date" id="gDeadline" value="${dateInput(d.deadline)}">${CLRX("gdeadline",!!d.deadline)}</div>
      ${d.deadline?`<button class="line" id="gDeadlineType"><label>Type</label><span class="val">${d.deadlineType==="soft"?"Soft — self-set":"Hard — real consequence"}</span>${ICON_CHEV}</button>`:""}
    </div>
    <div class="fieldnote">Importance set on a group flows down to everything inside unless a task overrides it. A group deadline pulls its unfinished contents up the ranking as it nears.</div>
    ${secBig("Notifications")}
    <div class="field"><button class="line" id="gNotify"><label>Default for tasks here</label>
      <span class="val${gn?" set":""}">${gn?(gn.enabled?"On":"Off"):"Inherit"}</span>${ICON_CHEV}</button></div>
    <div class="fieldnote">Every task inside inherits this unless the task sets its own.</div>
    ${g?secBig("Status")+`<div class="field">
      <button class="line" id="gMove"><label>In group</label><span class="val">${esc(pathLabel(d.parentId))}</span>${ICON_CHEV}</button>
      <div class="line"><label>Contains</label><span class="val">${kids.length} item${kids.length===1?"":"s"}${prog?" · "+prog.done+"/"+prog.total+" done":""}</span></div>
      <div class="line"><label>Added</label><span class="val">${fmtDate(g.createdAt,{month:"short",day:"numeric",year:"numeric"})}</span></div>
    </div>`:""}
    ${g?`<div class="field">
      <button class="line accent" id="gOpen">Open contents</button>
      <button class="line accent" id="gAdd">Add steps inside</button>
      ${!kids.length?`<button class="line accent" id="gToTask">Convert to task</button>`:""}
      ${g.status!=="dropped"?`<button class="line accent" id="gDrop">Drop group</button>`:`<button class="line accent" id="gRestore">Restore</button>`}
    </div>
    <div class="field"><button class="line danger" id="gDelete">Delete permanently</button></div>
    <div class="fieldnote">Deleting removes everything inside it too.</div>`:""}`,
    isNew?async()=>{
      d.title=($("#gTitle").value||"").trim(); d.notes=$("#gNotes").value;
      if(!d.title){ toast("Give it a name"); $("#gTitle").focus(); return; }
      g=newNode(d); state.nodes.set(g.id,g); await save(g);
      closeSheet(); toast("Group created");
    }:null,"Create");
    const on=(sel,ev,fn)=>{ const el=$(sel); if(el) el.addEventListener(ev,fn); };
    on("#gTitle","input",e=>{ d.title=e.target.value; G(); });
    on("#gNotes","input",e=>{ d.notes=e.target.value; G(); });
    on("#gIcon","click",()=>openIconPicker(CAT_ICONS.concat(TASK_ICONS),d.icon,v=>{ d.icon=v; G(); }));
    $$("#gColors button").forEach(b=>b.addEventListener("click",()=>{ d.color=b.dataset.col||null; G(); draw(); }));
    $$("#gMode button").forEach(b=>b.addEventListener("click",()=>{ d.childMode=b.dataset.mode; G(); draw(); }));
    on("#gDeadline","change",e=>{ d.deadline=e.target.value?new Date(e.target.value+"T17:00:00").toISOString():null;
      if(d.deadline&&!d.deadlineType) d.deadlineType="hard"; if(!d.deadline) d.deadlineType=null; G(); });
    on("#gDeadline","blur",()=>setTimeout(draw,80));
    on("#gDeadlineType","click",()=>openOptions({title:"Deadline type",
      options:[{v:"hard",l:"Hard — real consequence"},{v:"soft",l:"Soft — self-set"}],
      current:d.deadlineType,onPick:v=>{ d.deadlineType=v; G(); }}));
    on("#gNotify","click",()=>openNotifyEditor(state.settings.notif.perGroup[d.id],async v=>{
      if(v) state.settings.notif.perGroup[d.id]=v; else delete state.settings.notif.perGroup[d.id];
      await saveSettings(); },"Default for every task inside this group."));
    on("#gMove","click",()=>openPicker(d,G));
    sheetBody.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>pickField(b.dataset.pick,d,G)));
    sheetBody.querySelectorAll("[data-clearx]").forEach(b=>b.addEventListener("click",e=>{
      e.stopPropagation(); const k=b.dataset.clearx;
      if(k==="gicon") d.icon=null;
      if(k==="gcat") d.category=null;
      if(k==="gdeadline"){ d.deadline=null; d.deadlineType=null; }
      G(); draw(); }));
    on("#gOpen","click",async()=>{ closeSheet(); state.tab="browse"; state.browseMode="groups"; state.path=buildPath(d.id); render(); });
    on("#gAdd","click",()=>{ if(g) openAddChild(g); });
    on("#gToTask","click",async()=>{ if(g){ g.kind="task"; await save(g); openSheet(g.id); } });
    on("#gDrop","click",async()=>{ if(g){ await setStatus(g,"dropped"); closeSheet(); toast("Dropped"); } });
    on("#gRestore","click",async()=>{ if(g){ await setStatus(g,"available"); closeSheet(); toast("Restored"); } });
    on("#gDelete","click",async()=>{ if(g&&confirmDelete(g)){ await purge(g.id); closeSheet(); toast("Deleted"); } });
    if(isNew) setTimeout(()=>{ const t=$("#gTitle"); if(t) t.focus(); },350);
  };
  sheetRoot(draw);
}

/* ===========================================================================
   QUICK-ENTRY PARSER — plain English in the title becomes structure.
   "Call dentist tomorrow at 3pm ~30m #Health @phone !" fills the fields.
   Everything it finds shows as a dismissible chip; explicit edits win.
   =========================================================================== */
const NL_DOWS={sun:0,mon:1,tue:2,tues:2,wed:3,thu:4,thur:4,thurs:4,fri:5,sat:6};
const NL_MONTHS={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
function parseNL(text){
  const src=String(text||"");
  const found={}; const spans=[];
  const claim=(key,s,e,data)=>{ if(found[key]) return false;
    for(const sp of spans) if(s<sp.e&&e>sp.s) return false;
    found[key]=data; spans.push({s,e,key}); return true; };
  const rx=(re)=>{ re.lastIndex=0; return re.exec(src); };
  let m;

  if((m=rx(/(^|\s)#([A-Za-z][\w&-]{1,24})/i))){
    const raw=m[2], hit=state.settings.categories.find(c=>c.name.toLowerCase()===raw.toLowerCase());
    claim("cat",m.index,m.index+m[0].length,{name:hit?hit.name:raw[0].toUpperCase()+raw.slice(1),isNew:!hit});
  }
  if((m=rx(/(^|\s)@([A-Za-z][\w-]{1,24})/i))){
    const raw="@"+m[2].toLowerCase(), hit=state.settings.contexts.find(c=>c.toLowerCase()===raw);
    claim("ctx",m.index,m.index+m[0].length,{name:hit||raw,isNew:!hit});
  }
  if((m=rx(/(^|\s)!(critical|high|normal|low)\b/i)))
    claim("imp",m.index,m.index+m[0].length,{v:m[2].toLowerCase()});
  else if((m=rx(/(^|\s)(!{1,2})(?=\s|$)/)))
    claim("imp",m.index,m.index+m[0].length,{v:m[2]==="!!"?"critical":"high"});

  if((m=rx(/(^|\s)\bsomeday\b/i))) claim("someday",m.index,m.index+m[0].length,{});

  /* recurrence before dates — "every friday" must not read as a deadline */
  if((m=rx(/(^|\s)(every\s?day|daily)\b/i))) claim("rec",m.index,m.index+m[0].length,{r:{type:"days",every:1},l:"every day"});
  else if((m=rx(/(^|\s)(weekdays)\b/i))) claim("rec",m.index,m.index+m[0].length,{r:{type:"weekdays",days:[1,2,3,4,5]},l:"weekdays"});
  else if((m=rx(/(^|\s)(every\s?week|weekly)\b/i))) claim("rec",m.index,m.index+m[0].length,{r:{type:"days",every:7},l:"weekly"});
  else if((m=rx(/(^|\s)(every\s?month|monthly)\b/i))) claim("rec",m.index,m.index+m[0].length,{r:{type:"months",every:1},l:"monthly"});
  else if((m=rx(/(^|\s)every\s+(sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)[a-z]*\b/i)))
    claim("rec",m.index,m.index+m[0].length,{r:{type:"weekdays",days:[NL_DOWS[m[2].toLowerCase()]]},l:"every "+m[2]});

  /* duration: a range, else a single figure */
  if((m=rx(/(^|\s)~?(\d{1,3})\s*(?:-|–|to\s+)\s*(\d{1,3})\s*(m|min|mins|minutes|h|hr|hrs|hours)\b/i))){
    const mult=/^h/i.test(m[4])?60:1;
    claim("dur",m.index,m.index+m[0].length,{min:+m[2]*mult,max:+m[3]*mult});
  } else if((m=rx(/(^|\s)~?(\d{1,3}(?:\.\d)?)\s*(m|min|mins|minutes|h|hr|hrs|hours)\b/i))){
    const mult=/^h/i.test(m[3])?60:1;
    claim("dur",m.index,m.index+m[0].length,{min:null,max:Math.round(+m[2]*mult)});
  }

  /* a time of day */
  if((m=rx(/(^|\s)(?:at\s+)?(\d{1,2}):(\d{2})\s*(am|pm)?\b/i))||(m=rx(/(^|\s)(?:at\s+)(\d{1,2})\s*(am|pm)?\b/i))||(m=rx(/(^|\s)(\d{1,2})\s*(am|pm)\b/i))){
    let h,mi,ap;
    if(m.length===5){ h=+m[2]; mi=+m[3]; ap=(m[4]||"").toLowerCase(); }
    else { h=+m[2]; mi=0; ap=(m[3]||"").toLowerCase(); }
    if(h<=24&&mi<60){
      if(ap==="pm"&&h<12) h+=12; if(ap==="am"&&h===12) h=0;
      if(!ap&&h<8) h+=12;                       /* "at 5" almost always means 5 in the evening */
      claim("time",m.index,m.index+m[0].length,{h,mi});
    }
  } else if((m=rx(/(^|\s)at\s+noon\b/i))||(m=rx(/(^|\s)noon\b/i))) claim("time",m.index,m.index+m[0].length,{h:12,mi:0});
  else if((m=rx(/(^|\s)midnight\b/i))) claim("time",m.index,m.index+m[0].length,{h:23,mi:59});

  /* a date */
  const today=startOfDay(new Date());
  const dateAt=(d)=>({d:startOfDay(d)});
  if((m=rx(/(^|\s)(?:by\s+|due\s+|on\s+)?(today|tonight)\b/i))) claim("due",m.index,m.index+m[0].length,dateAt(today));
  else if((m=rx(/(^|\s)(?:by\s+|due\s+|on\s+)?(tomorrow|tmrw|tmr)\b/i))) claim("due",m.index,m.index+m[0].length,dateAt(addDays(today,1)));
  else if((m=rx(/(^|\s)(?:by\s+|due\s+|on\s+)?(next\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)\b/i))){
    const dow=NL_DOWS[m[3].slice(0,m[3].length>4?3:m[3].length).toLowerCase()]??NL_DOWS[m[3].slice(0,3).toLowerCase()];
    if(dow!=null){ let ahead=(dow-today.getDay()+7)%7;
      if(m[2]) ahead+= (ahead===0?7:7); else if(ahead===0) ahead=0;
      claim("due",m.index,m.index+m[0].length,dateAt(addDays(today,ahead))); }
  }
  else if((m=rx(/(^|\s)(?:by\s+)?next\s+week\b/i))){
    const ahead=((1-today.getDay()+7)%7)||7;
    claim("due",m.index,m.index+m[0].length,dateAt(addDays(today,ahead)));
  }
  else if((m=rx(/(^|\s)(?:this\s+)?weekend\b/i))){
    let ahead=(6-today.getDay()+7)%7; claim("due",m.index,m.index+m[0].length,dateAt(addDays(today,ahead)));
  }
  else if((m=rx(/(^|\s)in\s+(\d{1,2})\s+(day|days|week|weeks)\b/i))){
    const n=+m[2]*(/week/i.test(m[3])?7:1);
    claim("due",m.index,m.index+m[0].length,dateAt(addDays(today,n)));
  }
  else if((m=rx(/(^|\s)(?:by\s+|due\s+|on\s+)?(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})\b/i))){
    const mo=NL_MONTHS[m[2].toLowerCase()], day=+m[3];
    if(day>=1&&day<=31){ let d=new Date(today.getFullYear(),mo,day);
      if(startOfDay(d)<today) d=new Date(today.getFullYear()+1,mo,day);
      claim("due",m.index,m.index+m[0].length,dateAt(d)); }
  }
  else if((m=rx(/(^|\s)(?:by\s+|due\s+|on\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/i))){
    const mo=+m[2]-1, day=+m[3];
    if(mo>=0&&mo<12&&day>=1&&day<=31){
      let y=m[4]?(+m[4]<100?2000+ +m[4]:+m[4]):today.getFullYear();
      let d=new Date(y,mo,day);
      if(!m[4]&&startOfDay(d)<today) d=new Date(y+1,mo,day);
      claim("due",m.index,m.index+m[0].length,dateAt(d)); }
  }

  /* assemble patch + chips */
  const patch={}, chips=[];
  if(found.due||found.time){
    let base=found.due?new Date(found.due.d):startOfDay(new Date());
    if(found.time){
      base.setHours(found.time.h,found.time.mi,0,0);
      if(!found.due&&base<new Date()) base=new Date(base.getTime()+DAY);
      patch.deadlineHasTime=true;
    } else base.setHours(17,0,0,0);
    patch.deadline=base.toISOString(); patch.deadlineType="soft";
    chips.push({key:found.due?"due":"time",label:"Due "+relDay(patch.deadline)+(found.time?" "+fmtTime(patch.deadline):""),
      both:!!(found.due&&found.time)});
  }
  if(found.dur){ patch.durationMode="estimate"; patch.estMinMinutes=found.dur.min; patch.estMaxMinutes=found.dur.max;
    chips.push({key:"dur",label:"~"+(found.dur.min?mins(found.dur.min)+"–":"")+mins(found.dur.max)}); }
  if(found.cat){ patch.category=found.cat.name; patch._newCat=found.cat.isNew;
    chips.push({key:"cat",label:"#"+found.cat.name+(found.cat.isNew?" (new)":"")}); }
  if(found.ctx){ patch.context=found.ctx.name; patch._newCtx=found.ctx.isNew;
    chips.push({key:"ctx",label:found.ctx.name}); }
  if(found.imp){ patch.importance=found.imp.v; patch.importanceOverridden=true;
    chips.push({key:"imp",label:IMP_LABEL[found.imp.v]+" priority"}); }
  if(found.rec){ patch.recurrence=found.rec.r; chips.push({key:"rec",label:"Repeats "+found.rec.l}); }
  if(found.someday){ patch.status="someday"; chips.push({key:"someday",label:"Someday"}); }

  /* the cleaned title: matched shorthand removed */
  const strip=(keys)=>{
    const drop=spans.filter(sp=>keys.has(sp.key)).sort((a,b)=>b.s-a.s);
    let t=src; for(const sp of drop) t=t.slice(0,sp.s)+" "+t.slice(sp.e);
    t=t.replace(/\s{2,}/g," ").replace(/\s+([,.;:])/g,"$1").trim();
    return t?t[0].toUpperCase()+t.slice(1):t;
  };
  const allKeys=new Set(spans.map(s=>s.key));
  return {title:strip(allKeys),patch,chips,strip,found};
}

/* ===========================================================================
   CAPTURE — the + button. Type naturally; the shorthand becomes chips.
   A title alone is still enough. Everything else folds below.
   =========================================================================== */
function captureDest(){
  if(state.tab==="browse"&&state.browseMode==="groups"&&state.path.length) return state.path[state.path.length-1];
  return UNSORTED;
}
$("#fab").addEventListener("click",()=>openCapture());

function openCapture(pre){
  pre=pre||{};
  const d=newNode({parentId:captureDest()});
  if(pre.deadlineDay){ d.deadline=new Date(pre.deadlineDay+"T17:00:00").toISOString(); d.deadlineType="soft"; }
  if(pre.fixedSlot){ d.durationMode="fixed"; d.fixedStart=new Date(pre.fixedSlot+":00").toISOString();
    d.fixedEnd=new Date(new Date(d.fixedStart).getTime()+60*MIN).toISOString(); }
  state.capDraft=d; state.capSubs=[]; state.capIgnore=new Set(); state.capSet=new Set();
  if(pre.deadlineDay) state.capSet.add("deadline");
  sheetRoot(drawCapture);
  setTimeout(()=>{ const t=$("#cTitle"); if(t) t.focus(); },380);
}
const CAP_OPEN={when:false,effort:false,organize:false,deps:false,alerts:false,repeat:false,notes:false,steps:false};
function capChipsHTML(){
  const d=state.capDraft;
  const p=parseNL(d.title||"");
  const chips=p.chips.filter(c=>!state.capIgnore.has(c.key));
  if(!chips.length) return "";
  return chips.map(c=>`<span class="chip"><b>${esc(c.label)}</b><span class="x" data-chipx="${esc(c.key)}">✕</span></span>`).join("");
}
function refreshChips(){
  const el=$("#capChips"); if(!el) return;
  el.innerHTML=capChipsHTML();
  el.style.display=el.innerHTML?"flex":"none";
  el.querySelectorAll("[data-chipx]").forEach(b=>b.addEventListener("click",()=>{
    state.capIgnore.add(b.dataset.chipx);
    if(b.dataset.chipx==="due"||b.dataset.chipx==="time"){ state.capIgnore.add("due"); state.capIgnore.add("time"); }
    refreshChips(); }));
}
function drawCapture(){
  const d=state.capDraft; if(!d) return;
  const cat=catByName(d.category);
  const capsec=(key,title,body,summary)=>`<div class="capsec${CAP_OPEN[key]?" open":""}" data-sec="${key}">
    <button class="caphd" data-sechd="${key}"><span class="arr">▶</span>${esc(title)}<span class="n">${esc(summary||"")}</span></button>
    <div class="capbd">${body}</div></div>`;

  const whenBody=`
    <div class="line"><label>Due</label><input type="date" id="cDeadline" value="${dateInput(d.deadline)}">${CLRX("cdeadline",!!d.deadline)}</div>
    ${d.deadline?`<div class="line"><label>…by</label><input type="time" id="cDlTime" value="${d.deadlineHasTime?timeInput(d.deadline):""}">${CLRX("cdltime",!!d.deadlineHasTime)}</div>
    <button class="line" id="cDlType"><label>How firm</label><span class="val">${d.deadlineType==="soft"?"Soft — self-set":"Hard — real consequence"}</span>${ICON_CHEV}</button>`:""}
    <button class="line" id="cFixed"><label>At a set time</label><span class="val${d.fixedStart?" set":""}">${d.fixedStart?esc(fmtDate(d.fixedStart)+" "+fmtTime(d.fixedStart))+(d.background?" ⟳":""):"None"}</span>${CLRX("cfixed",!!d.fixedStart)}${ICON_CHEV}</button>
    <div class="fieldnote inline"><b>Due</b> = must be finished by then (no time = end of day). <b>At a set time</b> = pinned to the calendar like an appointment, with an option to run in the background.</div>
    <button class="line" id="cMoreWhen" style="color:var(--accent)">More timing options ${d._moreWhen?"▴":"▾"}</button>
    ${d._moreWhen?`
    ${!d.deadline?`<button class="line" id="cTimeframe"><label>Timeframe</label><span class="val${d.timeframe?" set":""}">${d.timeframe?esc(tfLabel(d.timeframe)):"None"}</span>${CLRX("ctimeframe",!!d.timeframe)}${ICON_CHEV}</button>`:""}
    <div class="line"><label>Start on or after</label><input type="date" id="cDefer" value="${dateInput(d.deferUntil)}">${CLRX("cdefer",!!d.deferUntil)}</div>
    <div class="line"><label>Moot after</label><input type="date" id="cExpiry" value="${dateInput(d.expiry)}">${CLRX("cexpiry",!!d.expiry)}</div>
    <div class="fieldnote inline">A timeframe is "sometime in a period" with no date yet. "Start on or after" hides it until then. "Moot after" drops it once it stops mattering.</div>`:""}`;
  const whenSum=d.deadline?relDay(d.deadline)+(d.deadlineHasTime?" "+fmtTime(d.deadline):""):(d.timeframe?tfLabel(d.timeframe):(d.fixedStart?fmtDate(d.fixedStart):""));

  const effortBody=`
    <div class="line"><label>Takes about</label><input type="number" inputmode="numeric" id="cEstMin" value="${d.estMinMinutes??""}" placeholder="min"> <span class="val" style="flex:0 0 auto">to</span> <input type="number" inputmode="numeric" id="cEstMax" value="${d.estMaxMinutes??""}" placeholder="max"> <span class="unit">min</span></div>
    <button class="line" data-cpick="energy"><label>Energy</label><span class="val">${d.energy?(d.energy==="deep"?"Deep focus":"Shallow"):"None"}</span>${CLRX("cenergy",!!d.energy)}${ICON_CHEV}</button>
    <button class="line" data-cpick="context"><label>Context</label><span class="val">${esc(d.context||"None")}</span>${CLRX("cctx",!!d.context)}${ICON_CHEV}</button>
    <button class="line" data-cpick="deliverable"><label>Deliverable</label><span class="val">${esc(d.deliverable||"None")}</span>${CLRX("cdeliv",!!d.deliverable)}${ICON_CHEV}</button>
    <div class="fieldnote inline">A rough range is enough — capacity uses the high end, quick wins the low end.</div>`;
  const effortSum=d.estMaxMinutes?mins(d.estMaxMinutes):"";

  const orgBody=`
    <button class="line" data-cpick="category"><label>Category</label><span class="val${d.category?" set":""}">${cat&&cat.icon?esc(cat.icon)+" ":""}${esc(d.category||"None")}</span>${CLRX("ccat",!!d.category)}${ICON_CHEV}</button>
    <button class="line" data-cpick="importance"><label>Importance</label><span class="val">${d.importanceOverridden?IMP_LABEL[d.importance]:"Inherit"}</span>${ICON_CHEV}</button>
    <button class="line" id="cIcon"><label>Icon</label><span class="val">${d.icon?esc(d.icon):"None"}</span>${CLRX("cicon",!!d.icon)}${ICON_CHEV}</button>
    <button class="line" id="cFlagB"><label>Do today</label><span class="val"></span><span class="toggle${d.flagged?" on":""}"></span></button>`;
  const orgSum=[d.category,d.importanceOverridden?IMP_LABEL[d.importance]:null].filter(Boolean).join(" · ");

  const depSum=(d.dependsOn||[]).length?(d.dependsOn.length+" · "+(d.dependencyMode==="soft"?"soft":"required")):"";
  const depsBody=`
    <div class="seg" style="margin:12px 16px" id="cDepMode">
      <button data-dm="none"${(d.dependencyMode||"none")==="none"?' class="on"':""}>None</button>
      <button data-dm="required"${d.dependencyMode==="required"?' class="on"':""}>Required</button>
      <button data-dm="soft"${d.dependencyMode==="soft"?' class="on"':""}>Soft</button></div>
    ${(d.dependsOn||[]).map(x=>byId(x)).filter(Boolean).map(x=>`<div class="line"><label style="font-weight:400">${esc(x.title||"Untitled")}</label>
      <button data-crmdep="${x.id}" style="color:var(--red);font-size:14px;margin-left:auto">Remove</button></div>`).join("")}
    ${d.dependencyMode!=="none"?`<button class="line" id="cAddDep" style="color:var(--accent);justify-content:center">Add a task this waits on</button>`:""}
    <div class="fieldnote inline">Required: blocked until those are done. Soft: doable now, ranked lower.</div>`;

  const alertsSum=d.notify?(d.notify.enabled?"custom":"off"):"";
  const alertsBody=`<button class="line" id="cNotify"><label>Alerts</label><span class="val${d.notify?" set":""}">${d.notify?(d.notify.enabled?"Custom":"Off"):"Inherit from group/category"}</span>${ICON_CHEV}</button>
    <div class="fieldnote inline">Banners in-app; real lock-screen alerts come from the calendar export in Settings › Notifications.</div>`;

  const repeatBody=`<button class="line" data-cpick="recurrence"><label>Repeats</label><span class="val">${recurLabel(d.recurrence)}</span>${CLRX("crec",!!d.recurrence)}${ICON_CHEV}</button>`;
  const notesBody=`<div class="line" style="align-items:flex-start;padding-top:12px"><textarea id="cNotes" placeholder="Notes">${esc(d.notes||"")}</textarea></div>`;
  const stepsBody=`<div class="line" style="align-items:flex-start;padding-top:12px"><textarea id="cSteps" placeholder="One step per line — this task becomes a group holding them. The same shorthand works per line.">${esc(state.capSubs.join("\n"))}</textarea></div>`;

  showSheet("New task",`
    <div class="field" style="margin-bottom:4px">
      <div class="line"><input class="big" id="cTitle" value="${esc(d.title)}" placeholder="Renew passport by friday ~1h #Admin" autocapitalize="sentences" enterkeyhint="done"></div>
    </div>
    <div class="chips" id="capChips" style="display:none"></div>
    <div class="fieldnote" style="margin-top:6px">Just type — dates ("tomorrow", "sep 25 at 3pm"), effort ("~30m"), #category, @context and ! for priority become chips you can dismiss. Or set anything by hand below.</div>
    <div class="field" style="margin-bottom:12px">
      <button class="line" id="cGroup"><label>In group</label><span class="val${d.parentId!==UNSORTED?" set":""}">${esc(pathLabel(d.parentId))}</span>${ICON_CHEV}</button>
    </div>
    ${capsec("when","When",whenBody,whenSum)}
    ${capsec("effort","Effort",effortBody,effortSum)}
    ${capsec("organize","Organize",orgBody,orgSum)}
    ${capsec("deps","Dependencies",depsBody,depSum)}
    ${capsec("alerts","Alerts",alertsBody,alertsSum)}
    ${capsec("repeat","Repeat",repeatBody,d.recurrence?recurLabel(d.recurrence):"")}
    ${capsec("notes","Notes",notesBody,d.notes?"…":"")}
    ${capsec("steps","Steps inside",stepsBody,state.capSubs.filter(s=>s.trim()).length?state.capSubs.filter(s=>s.trim()).length+"":"")}
    <div class="field" style="margin-top:6px"><button class="line accent" id="cSaveMore">Add and start another</button></div>
    <div class="fieldnote">A title alone is enough — everything else can wait.</div>`,
    async()=>{ await commitCapture(false); },"Add");
  wireCapture();
  refreshChips();
}
function wireCapture(){
  const d=state.capDraft;
  const on=(sel,ev,fn)=>{ const el=$(sel); if(el) el.addEventListener(ev,fn); };
  const keepText=()=>{ const t=$("#cTitle"); if(t) d.title=t.value;
    const nn=$("#cNotes"); if(nn) d.notes=nn.value;
    const ss=$("#cSteps"); if(ss) state.capSubs=ss.value.split("\n"); };
  const S=k=>state.capSet.add(k);   /* explicit edits beat parsed values */
  sheetBody.querySelectorAll("[data-sechd]").forEach(b=>b.addEventListener("click",()=>{
    keepText(); CAP_OPEN[b.dataset.sechd]=!CAP_OPEN[b.dataset.sechd]; drawCapture(); }));
  let chipT=null;
  on("#cTitle","input",e=>{ d.title=e.target.value;
    clearTimeout(chipT); chipT=setTimeout(refreshChips,140); });
  on("#cTitle","keydown",async e=>{ if(e.key==="Enter"){ e.preventDefault(); await commitCapture(false); } });
  on("#cNotes","input",e=>{ d.notes=e.target.value; });
  on("#cSteps","input",e=>{ state.capSubs=e.target.value.split("\n"); });
  on("#cGroup","click",()=>{ keepText(); openPicker(d,null); });
  /* never redraw while a wheel picker is open — update state, redraw on blur */
  on("#cDeadline","change",e=>{ S("deadline");
    const t=d.deadlineHasTime?timeInput(d.deadline):"17:00";
    d.deadline=e.target.value?new Date(e.target.value+"T"+t+":00").toISOString():null;
    if(d.deadline&&!d.deadlineType) d.deadlineType="soft";
    if(!d.deadline){ d.deadlineType=null; d.deadlineHasTime=false; }
    if(d.deadline) d.timeframe=null; });
  on("#cDeadline","blur",()=>{ keepText(); setTimeout(drawCapture,80); });
  on("#cDlTime","change",e=>{ S("deadline");
    if(!d.deadline) return;
    if(e.target.value){ d.deadline=new Date(dateInput(d.deadline)+"T"+e.target.value+":00").toISOString(); d.deadlineHasTime=true; }
    else { d.deadline=new Date(dateInput(d.deadline)+"T17:00:00").toISOString(); d.deadlineHasTime=false; }});
  on("#cDlTime","blur",()=>{ keepText(); setTimeout(drawCapture,80); });
  on("#cMoreWhen","click",()=>{ keepText(); d._moreWhen=!d._moreWhen; drawCapture(); });
  on("#cDlType","click",()=>{ keepText(); openOptions({title:"Deadline type",
    options:[{v:"hard",l:"Hard — real consequence"},{v:"soft",l:"Soft — self-set"}],
    current:d.deadlineType,onPick:v=>{ d.deadlineType=v; S("deadline"); }}); });
  on("#cTimeframe","click",()=>{ keepText(); openTimeframe(d.timeframe,tf=>{ d.timeframe=tf; S("deadline"); }); });
  on("#cDefer","change",e=>{ d.deferUntil=e.target.value?new Date(e.target.value+"T00:00:00").toISOString():null; });
  on("#cExpiry","change",e=>{ d.expiry=e.target.value?new Date(e.target.value+"T23:59:00").toISOString():null; });
  on("#cEstMin","input",e=>{ S("dur"); d.estMinMinutes=e.target.value===""?null:Math.max(0,Number(e.target.value));
    if(d.estMaxMinutes!=null&&d.durationMode==="none") d.durationMode="estimate"; });
  on("#cEstMax","input",e=>{ S("dur"); d.estMaxMinutes=e.target.value===""?null:Math.max(0,Number(e.target.value));
    if(d.estMaxMinutes!=null) d.durationMode="estimate"; });
  on("#cFixed","click",()=>{ keepText(); openFixedSheet(d,null); });
  on("#cIcon","click",()=>{ keepText(); openIconPicker(TASK_ICONS,d.icon,v=>{ d.icon=v; }); });
  on("#cFlagB","click",()=>{ keepText(); d.flagged=!d.flagged; drawCapture(); });
  on("#cNotify","click",()=>{ keepText(); openNotifyEditor(d.notify,v=>{ d.notify=v; },
    "Overrides the group and category defaults for this task only."); });
  $$("#cDepMode button").forEach(b=>b.addEventListener("click",()=>{ keepText(); d.dependencyMode=b.dataset.dm; drawCapture(); }));
  on("#cAddDep","click",()=>{ keepText(); openDepPicker(d,null); });
  sheetBody.querySelectorAll("[data-crmdep]").forEach(b=>b.addEventListener("click",()=>{
    keepText(); d.dependsOn=(d.dependsOn||[]).filter(x=>x!==b.dataset.crmdep); drawCapture(); }));
  sheetBody.querySelectorAll("[data-cpick]").forEach(b=>b.addEventListener("click",()=>{
    keepText();
    const k=b.dataset.cpick;
    pickField(k,d,()=>{ if(k==="category") S("cat"); if(k==="context") S("ctx");
      if(k==="importance") S("imp"); if(k==="recurrence") S("rec"); }); }));
  sheetBody.querySelectorAll("[data-clearx]").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation(); keepText(); const k=b.dataset.clearx;
    if(k==="cdeadline"){ d.deadline=null; d.deadlineType=null; d.deadlineHasTime=false; S("deadline"); }
    if(k==="cdltime"){ if(d.deadline) d.deadline=new Date(dateInput(d.deadline)+"T17:00:00").toISOString(); d.deadlineHasTime=false; S("deadline"); }
    if(k==="ctimeframe"){ d.timeframe=null; S("deadline"); }
    if(k==="cdefer") d.deferUntil=null;
    if(k==="cexpiry") d.expiry=null;
    if(k==="cfixed"){ d.fixedStart=null; d.fixedEnd=null; d.background=false; if(d.durationMode==="fixed") d.durationMode=d.estMaxMinutes?"estimate":"none"; }
    if(k==="cenergy") d.energy=null;
    if(k==="cctx"){ d.context=null; S("ctx"); }
    if(k==="cdeliv") d.deliverable=null;
    if(k==="ccat"){ d.category=null; S("cat"); }
    if(k==="cicon") d.icon=null;
    if(k==="crec"){ d.recurrence=null; S("rec"); }
    drawCapture(); }));
  on("#cSaveMore","click",async()=>{ await commitCapture(true); });
}
function openFixedSheet(d,onChange){
  sheetPush(()=>drawFixedSheet(d,onChange));
}
function drawFixedSheet(d,onChange){
  showSheet("At a set time",
    `<div class="field">
      <div class="line"><label>Day</label><input type="date" id="xDay" value="${dateInput(d.fixedStart)||dayKey(new Date())}"></div>
      <div class="line"><label>Start</label><input type="time" id="xStart" value="${timeInput(d.fixedStart)}"></div>
      <div class="line"><label>End</label><input type="time" id="xEnd" value="${timeInput(d.fixedEnd)}"></div>
     </div>
     <div class="fieldnote">Sits at its time on the calendar and in the plan, like an appointment. Applied when you go back.</div>
     <div class="field"><button class="line" id="xBg"><label>Runs in the background</label><span class="val"></span><span class="toggle${d.background?" on":""}"></span></button></div>
     <div class="fieldnote">Laundry, the dishwasher, a download — it occupies the time slot but not you. It never blocks other work, other tasks can be planned right over it, and it doesn't count against your hours.</div>
     <div class="field"><button class="line accent" id="xClear">No set time</button></div>`,null);
  SHEET.leave=()=>{
    const day=$("#xDay"), st=$("#xStart"), e=$("#xEnd");
    if(day&&st&&day.value&&st.value){ d.fixedStart=new Date(day.value+"T"+st.value+":00").toISOString();
      d.fixedEnd=e&&e.value?new Date(day.value+"T"+e.value+":00").toISOString():null; d.durationMode="fixed";
      if(onChange) onChange(); }
  };
  $("#xBg").addEventListener("click",()=>{ d.background=!d.background;
    if(onChange) onChange(); drawFixedSheet(d,onChange); });
  $("#xClear").addEventListener("click",()=>{ d.fixedStart=null; d.fixedEnd=null; d.background=false;
    if(d.durationMode==="fixed") d.durationMode=d.estMaxMinutes?"estimate":"none";
    if(onChange) onChange(); SHEET.leave=null; sheetPop(); });
}
async function commitCapture(again){
  const d=state.capDraft; if(!d) return;
  const t=$("#cTitle"); if(t) d.title=t.value;
  const nn=$("#cNotes"); if(nn) d.notes=nn.value;
  const ss=$("#cSteps"); if(ss) state.capSubs=ss.value.split("\n");
  d.title=(d.title||"").trim();
  if(!d.title){ toast("Give it a title"); const t2=$("#cTitle"); if(t2) t2.focus(); return; }

  /* fold in what the parser found — unless dismissed or set by hand */
  const p=parseNL(d.title);
  const ig=state.capIgnore, st=state.capSet;
  const used=new Set();
  const want=k=>!ig.has(k)&&p.found[k];
  if((want("due")||want("time"))&&!st.has("deadline")&&!d.deadline&&!d.timeframe&&!d.fixedStart){
    d.deadline=p.patch.deadline; d.deadlineType=p.patch.deadlineType;
    d.deadlineHasTime=!!p.patch.deadlineHasTime;
    if(p.found.due) used.add("due"); if(p.found.time) used.add("time"); }
  if(want("dur")&&!st.has("dur")&&d.estMaxMinutes==null){
    d.durationMode="estimate"; d.estMinMinutes=p.patch.estMinMinutes; d.estMaxMinutes=p.patch.estMaxMinutes; used.add("dur"); }
  if(want("cat")&&!st.has("cat")&&!d.category){
    if(p.patch._newCat&&!catByName(p.patch.category)){
      state.settings.categories.push({name:p.patch.category,
        icon:CAT_ICONS[state.settings.categories.length%CAT_ICONS.length],
        color:PALETTE[state.settings.categories.length%PALETTE.length]});
      await saveSettings(); }
    d.category=p.patch.category; used.add("cat"); }
  if(want("ctx")&&!st.has("ctx")&&!d.context){
    if(p.patch._newCtx&&!state.settings.contexts.includes(p.patch.context)){
      state.settings.contexts.push(p.patch.context); await saveSettings(); }
    d.context=p.patch.context; used.add("ctx"); }
  if(want("imp")&&!st.has("imp")&&!d.importanceOverridden){
    d.importance=p.patch.importance; d.importanceOverridden=true; used.add("imp"); }
  if(want("rec")&&!st.has("rec")&&!d.recurrence){ d.recurrence=p.patch.recurrence; used.add("rec"); }
  if(want("someday")&&d.status==="available"){ d.status="someday"; used.add("someday"); }
  if(used.size) d.title=p.strip(used)||d.title;

  const subs=state.capSubs.map(s=>s.trim()).filter(Boolean);
  if(subs.length) d.kind="group";
  d.order=nextOrder(d.parentId);
  delete d._moreWhen;
  d.durationMode=d.fixedStart?"fixed":(d.estMaxMinutes!=null?"estimate":"none");
  const n=newNode(d); state.nodes.set(n.id,n); await putNode(n);
  let o=Date.now();
  for(const s of subs){ const sp=parseNL(s);
    await create(Object.assign({title:sp.title||s,parentId:n.id,order:o+=1000},
      Object.fromEntries(Object.entries(sp.patch).filter(([k])=>!k.startsWith("_"))))); }
  toast("Added to "+pathLabel(n.parentId));
  if(again){
    const keep=n.parentId;
    state.capDraft=newNode({parentId:keep}); state.capSubs=[]; state.capIgnore=new Set(); state.capSet=new Set();
    drawCapture(); const t3=$("#cTitle"); if(t3) t3.focus();
  } else { closeSheet(); }
  render();
}

const THEMES=[

  {id:"ocean",name:"Ocean",accL:"#0E7490",accD:"#40C8E0"},
  {id:"rose",name:"Rosé",accL:"#D6336C",accD:"#FF6482"}
];
function hexToRgb(h){ h=h.replace("#",""); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)].join(","); }
let darkMQ=null;
function applyTheme(){
  const t=state.settings.theme;
  const th=THEMES.find(x=>x.id===t.id)||THEMES[0];
  const wantDark = t.mode==="dark" || (t.mode==="auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  const root=document.documentElement;
  root.dataset.dark=wantDark?"1":"0";
  const acc=wantDark?th.accD:th.accL;
  root.style.setProperty("--accent",acc);
  root.style.setProperty("--accent-rgb",hexToRgb(acc));
  if(wantDark&&th.oled){ root.style.setProperty("--bg","#000000"); root.style.setProperty("--elev","#121214");
    root.style.setProperty("--press","#232326"); root.style.setProperty("--navbg","rgba(10,10,12,.85)"); }
  else{ root.style.removeProperty("--bg"); root.style.removeProperty("--elev");
    root.style.removeProperty("--press"); root.style.removeProperty("--navbg"); }
  const bgD="#000000", bgL="#F2F2F7";
  $("#metaThemeL").setAttribute("content",t.mode==="dark"?bgD:bgL);
  $("#metaThemeD").setAttribute("content",t.mode==="light"?bgL:bgD);
  document.documentElement.style.background=getComputedStyle(document.documentElement).getPropertyValue("--bg")||("");
  document.body.dataset.hasdark=wantDark?"1":"0";
  document.body.style.setProperty("--bgdim","rgba(0,0,0,"+(t.bgDim!=null?t.bgDim:.35)+")");
  if(!darkMQ){ darkMQ=window.matchMedia("(prefers-color-scheme: dark)");
    const h=()=>{ if(state.settings.theme.mode==="auto"){ applyTheme(); render(); } };
    if(darkMQ.addEventListener) darkMQ.addEventListener("change",h); else darkMQ.addListener(h); }
}

$("#bgFile").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const img=new Image();
  img.onload=async()=>{
    const max=1200, sc=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement("canvas");
    cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
    const cx=cv.getContext("2d"); cx.drawImage(img,0,0,cv.width,cv.height);
    /* sample average luminance to auto-set the readability scrim */
    const smp=cx.getImageData(0,0,cv.width,cv.height).data;
    let lum=0, cnt=0;
    for(let i=0;i<smp.length;i+=160){ lum+=0.2126*smp[i]+0.7152*smp[i+1]+0.0722*smp[i+2]; cnt++; }
    lum/=cnt*255;
    const t=state.settings.theme;
    t.bgDim=clamp(0.2+lum*0.5,0.2,0.65);   /* brighter photo → stronger scrim */
    const data=cv.toDataURL("image/jpeg",0.8);
    await putMeta("bgImage",data);
    t.hasBg=true; await saveSettings();
    applyTheme(); await applyBg(); render(); if(SHEET.current) SHEET.current(); toast("Background set");
    URL.revokeObjectURL(img.src);
  };
  img.src=URL.createObjectURL(f);
  e.target.value="";
});

/* ===========================================================================
   EXPORT / IMPORT — JSON round-trip, Markdown, CSV, ICS with alarms.
   =========================================================================== */
function toMarkdown(rootId){
  const lines=[];
  const walk=(p,depth)=>{
    for(const c of childrenOf(p)){
      const box=c.kind==="group"?"":(c.status==="done"?"[x] ":"[ ] ");
      const meta=[];
      if(c.deadline) meta.push("due "+fmtDate(c.deadline,{year:"numeric",month:"short",day:"numeric"}));
      if(c.timeframe&&!c.deadline) meta.push("sometime "+tfLabel(c.timeframe));
      if(c.estMaxMinutes) meta.push(mins(c.estMaxMinutes));
      if(c.category) meta.push(c.category);
      if(c.status==="waiting") meta.push("waiting"+(c.waitingOn?" on "+c.waitingOn:""));
      lines.push("  ".repeat(depth)+"- "+box+(c.title||"Untitled")+(meta.length?"  _("+meta.join(", ")+")_":""));
      if(c.notes) c.notes.split("\n").forEach(l=>lines.push("  ".repeat(depth+1)+"> "+l));
      walk(c.id,depth+1);
    }
  };
  const root=rootId===undefined?null:rootId;
  const title=rootId===undefined?"All tasks":(byId(rootId)?byId(rootId).title:"Tasks");
  lines.push("# "+title); lines.push(""); lines.push("_Exported "+new Date().toLocaleString()+"_"); lines.push("");
  walk(root,0);
  if(rootId===undefined){ lines.push(""); lines.push("## Unsorted"); walk(UNSORTED,0); }
  return lines.join("\n");
}
function toCSV(){
  const cols=["id","parentId","parentTitle","title","kind","status","effectiveStatus","importance",
    "effectiveImportance","deadline","deadlineType","deadlineHasTime","timeframe","deferUntil","expiry","durationMode","estMinMinutes",
    "estMaxMinutes","fixedStart","fixedEnd","actualMinutes","category","deliverable","context","energy","flagged",
    "bumpCount","dependsOn","dependencyMode","waitingOn","followUpDate","notes","createdAt","touchedAt","completedAt"];
  const q=v=>{ const s=v==null?"":String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const rows=[cols.join(",")];
  for(const n of state.nodes.values()){
    if(n.id===UNSORTED) continue;
    rows.push(cols.map(c=>{
      if(c==="parentTitle") return q(pathLabel(n.parentId));
      if(c==="effectiveStatus") return q(effStatus(n));
      if(c==="effectiveImportance") return q(effImportance(n));
      if(c==="timeframe") return q(n.timeframe?tfLabel(n.timeframe):"");
      if(c==="dependsOn") return q((n.dependsOn||[]).map(x=>byId(x)?byId(x).title:x).join("; "));
      return q(n[c]);
    }).join(","));
  }
  return rows.join("\n");
}
/* ICS: fixed blocks and deadlines as events, VALARMs from each item's
   effective notification config, plus the sleep block if opted in. */
function toICS(){
  const pad=n=>String(n).padStart(2,"0");
  const z=d=>{ const x=new Date(d); return x.getUTCFullYear()+pad(x.getUTCMonth()+1)+pad(x.getUTCDate())+
    "T"+pad(x.getUTCHours())+pad(x.getUTCMinutes())+"00Z"; };
  const esc2=s=>String(s||"").replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n");
  const nf=state.settings.notif;
  const alarms=cfg=>cfg.enabled?cfg.offsets.map(o=>
    ["BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Reminder","TRIGGER:-PT"+o+"M","END:VALARM"]).flat():[];
  const out=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Tasks//EN","CALSCALE:GREGORIAN"];
  for(const n of state.nodes.values()){
    if(n.status==="dropped") continue;
    const cfg=effNotify(n);
    if(n.fixedStart){
      const end=n.fixedEnd||new Date(new Date(n.fixedStart).getTime()+30*MIN).toISOString();
      out.push("BEGIN:VEVENT","UID:"+n.id+"@tasks","DTSTAMP:"+z(new Date()),
        "DTSTART:"+z(n.fixedStart),"DTEND:"+z(end),"SUMMARY:"+esc2(n.title));
      if(n.notes) out.push("DESCRIPTION:"+esc2(n.notes));
      out.push(...alarms(cfg));
      out.push("END:VEVENT");
    } else if(n.deadline&&n.status!=="done"){
      /* timed event at the day-level alert time so VALARMs can hang off it */
      let base=new Date(n.deadline);
      if(!n.deadlineHasTime){
        const [h,m]=(cfg.atTime||nf.atTime||"09:00").split(":"); base=new Date(base); base.setHours(+h,+m,0,0); }
      out.push("BEGIN:VEVENT","UID:dl-"+n.id+"@tasks","DTSTAMP:"+z(new Date()),
        "DTSTART:"+z(base),"DTEND:"+z(new Date(base.getTime()+30*MIN)),
        "SUMMARY:Due — "+esc2(n.title));
      out.push(...alarms(cfg));
      out.push("END:VEVENT");
    }
  }
  if(state.settings.sleep.ics){
    const s=state.settings.sleep;
    const d=new Date(); const [bh,bm]=s.bed.split(":"), [wh,wm]=s.wake.split(":");
    const st=new Date(d); st.setHours(+bh,+bm,0,0);
    const en=new Date(d); en.setHours(+wh,+wm,0,0); if(en<=st) en.setDate(en.getDate()+1);
    out.push("BEGIN:VEVENT","UID:sleep@tasks","DTSTAMP:"+z(new Date()),
      "DTSTART:"+z(st),"DTEND:"+z(en),"RRULE:FREQ=DAILY","SUMMARY:Sleep","TRANSP:OPAQUE","END:VEVENT");
  }
  out.push("END:VCALENDAR");
  return out.filter(Boolean).join("\r\n");
}
function download(name,text,mime){
  const blob=new Blob([text],{type:mime||"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=$("#dl"); a.href=url; a.download=name; a.removeAttribute("hidden"); a.click();
  a.setAttribute("hidden",""); setTimeout(()=>URL.revokeObjectURL(url),4000);
}
async function shareOrDownload(name,text,mime){
  try{
    if(navigator.share&&navigator.canShare){
      const file=new File([text],name,{type:mime||"text/plain"});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return; }
    }
  }catch(e){ /* fall through */ }
  download(name,text,mime);
}

  if(k==="ics")  await shareOrDownload("tasks-alerts-"+stamp+".ics",toICS(),"text/calendar");
  toast("Exported");
}

          setTimeout(()=>location.reload(),400); return; } }
    }
    const r=await fetch("index.html",{cache:"reload"});

  }
  await ensureInbox();
  const u=byId(UNSORTED); if(u.title!=="Unsorted"){ u.title="Unsorted"; await putNode(u); }
  await putMeta("schemaVersion",SCHEMA);

  applyTheme(); await applyBg();

  const expired=await sweepExpiry();
  try{ await takeSnapshots(); }catch(e){}
  render();
  if(expired) toast(expired+" expired task"+(expired===1?"":"s")+" dropped");

  if("serviceWorker" in navigator){
    try{ await navigator.serviceWorker.register("sw.js"); }catch(e){}
  }
  /* recompute urgency when the app comes back to the foreground — Today is
     never stale, no button needed */
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden){
    sweepExpiry().then(()=>{ render(); checkBanners(); }); } });
  /* live minute tick: banner check + now-line + Today refresh */
  setInterval(()=>{ checkBanners();
    if(document.hidden) return;
    if(state.tab==="calendar"&&state.calMode==="day"&&sameDay(state.calSel,new Date())) render();
  },30000);
})();
window.addEventListener("pagehide",()=>{ try{ putMeta("lastTab",state.tab); }catch(e){} });
</script>
</body>
</html>
