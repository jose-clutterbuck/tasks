        <div class="body"><div class="title" style="font-size:15px">${n.icon?esc(n.icon)+" ":""}${esc(n.title||"Untitled")}</div>
          ${n.background?`<div class="why">runs alongside</div>`:""}</div></div>`).join("")+`</div>`;
    if(pj.length) html+=sec("Planned work","<span>the even spread toward each due date</span>")+`<div class="plan">`+pj.map(p=>
      `<div class="planrow ghost" data-open="${p.node.id}">
        <div class="pt tnum"><b>${esc(mins(p.minutes))}</b></div>
        <div class="pbar"></div>
        <div class="body"><div class="title" style="font-size:15px">${esc(p.node.title||"Untitled")}</div>
          <div class="why">${p.over?"no room before it is due":"due "+esc(relDay(p.node.deadline))}</div></div></div>`).join("")+`</div>`;
    if(!dls.length&&!fx.length&&!pj.length) html+=emptyHTML("A clear day","Nothing due, nothing pinned, nothing planned for tomorrow yet.",null);
  }else{
    html+=dueStrip;
    const body=dayPlanListHTML(day,proj);
    html+= body?sec("The plan for tomorrow")+body
      : emptyHTML("A clear day","Nothing lands on tomorrow yet.",null);
  }
  html+=`<div style="height:8px"></div>`+capCard;
  return html;
}

/* the coming week: days stacked on top of each other, scroll down through it */
function weekPlanHTML(){
  const proj=projection();
  let html="";
  for(let i=0;i<7;i++){
    const day=addDays(new Date(),i);
    const k=dayKey(day);
    const load=loadOn(day,proj);
    const lbl=i===0?"Today":i===1?"Tomorrow":day.toLocaleDateString(undefined,{weekday:"long"});
    const right=day.toLocaleDateString(undefined,{month:"short",day:"numeric"})+(load?" · "+mins(Math.round(load)):"");
    html+=secBig(lbl,`<span>${esc(right)}</span>`);
    const dls=dueOn(day);
    if(state.todayView==="list"){
      let rows=dls.map(dueRowHTML).join("");
      if(i===0){
        /* Today in the week shows the same plan Today itself computes */
        for(const bk of planFor(day,proj).blocks){
          if(bk.unavail) continue;
          const n=bk.node;
          rows+=`<div class="planrow${bk.fixed?"":" ghost"}" data-open="${n.id}">
            <div class="pt tnum"><b>${esc(fmtTime(bk.start.toISOString()))}</b>${mins(bk.minutes)}</div>
            <div class="pbar"${nodeColor(n)?` style="--pc:${esc(nodeColor(n))}"`:""}></div>
            <div class="body"><div class="title" style="font-size:15px">${n.icon?esc(n.icon)+" ":""}${esc(n.title||"Untitled")}${catInline(n)}</div>
              ${bk.bg?`<div class="why">runs alongside</div>`:""}</div></div>`;
        }
      } else {
        const fx=fixedOn(day).filter(n=>n.status!=="done");
        const pj=proj[k]||[];
        for(const n of fx) rows+=`<div class="planrow" data-open="${n.id}">
          <div class="pt tnum"><b>${esc(fmtTime(n.fixedStart))}</b></div><div class="pbar"></div>
          <div class="body"><div class="title" style="font-size:15px">${n.icon?esc(n.icon)+" ":""}${esc(n.title||"Untitled")}${catInline(n)}</div>
            ${n.background?`<div class="why">runs alongside</div>`:""}</div></div>`;
        for(const p of pj) rows+=`<div class="planrow ghost" data-open="${p.node.id}">
          <div class="pt tnum"><b>${esc(mins(p.minutes))}</b></div><div class="pbar"${nodeColor(p.node)?` style="--pc:${esc(nodeColor(p.node))}"`:""}></div>
          <div class="body"><div class="title" style="font-size:15px">${esc(p.node.title||"Untitled")}${catInline(p.node)}</div>
            <div class="why">${p.over?"no room before it is due":"work toward "+esc(relDay(p.node.deadline))}</div></div></div>`;
      }
      html+= rows?`<div class="plan">${rows}</div>`
        :`<div class="plan"><div class="plannote">Nothing lands on this day.</div></div>`;
    }else{
      const dueStrip=dls.length?`<div class="plan" style="margin-bottom:8px">${dls.map(dueRowHTML).join("")}</div>`:"";
      const body=dayPlanListHTML(day,proj);
      html+= dueStrip+(body||(dls.length?"":`<div class="plan"><div class="plannote">Nothing lands on this day.</div></div>`));
    }
  }
  html+=`<div class="fieldnote" style="margin-top:12px">Each day shows what is pinned, what is due, and where the planned work lands so every deadline is met. It is worked out live and changes as you finish things.</div>`;
  return html;
}
function todayListOrder(ids){
  const saved=(state.todayOrder&&state.todayOrder.day===dayKey(new Date()))?state.todayOrder.ids:[];
  return ids.slice().sort((a,b)=>{
    const ia=saved.indexOf(a), ib=saved.indexOf(b);
    if(ia<0&&ib<0) return 0; if(ia<0) return 1; if(ib<0) return -1; return ia-ib; });
}
function wireTodayList(){
  const list=$("#todayList"); if(!list) return;
  let drag=null;
  list.querySelectorAll("[data-drag]").forEach(h=>{
    h.addEventListener("touchstart",e=>{ drag=h.closest(".planrow");
      drag.classList.add("dragging"); },{passive:true});
    h.addEventListener("touchmove",e=>{ if(!drag) return;
      e.preventDefault();
      const y=e.touches[0].clientY;
      const rows=[...list.querySelectorAll(".planrow")].filter(r=>r!==drag);
      for(const r of rows){ const b=r.getBoundingClientRect();
        if(y>b.top&&y<b.top+b.height/2){ list.insertBefore(drag,r); break; }
        if(y>b.top+b.height/2&&y<b.bottom){ list.insertBefore(drag,r.nextSibling); break; } }
    },{passive:false});
    h.addEventListener("touchend",async()=>{ if(!drag) return;
      drag.classList.remove("dragging"); drag=null;
      const ids=[...list.querySelectorAll(".planrow")].map(r=>r.dataset.open).filter(Boolean);
      state.todayOrder={day:dayKey(new Date()),ids};
      try{ await putMeta("todayOrder",state.todayOrder); }catch(e){}
    },{passive:true});
  });
}

function todayHTML(d){
  const b=todayBands();
  const capMin=hoursLeftToday()*60;
  const over=b.committed>capMin;
  const pct=clamp(b.committed/Math.max(capMin,1)*100,0,100);
  const seg1=Math.min(pct,100), seg2=over?clamp((b.committed-capMin)/Math.max(capMin,1)*100,0,100):0;
  const leftLbl=capMin>=60?(Math.round(capMin/60*10)/10)+"h left today":mins(Math.round(capMin))+" left today";
  const capCard=`<div class="cap">
    <div class="top"><span><b>${mins(Math.round(b.committed))}</b> lined up</span>
      <span style="color:${over?"var(--orange)":"var(--label2)"}">${over?"+"+mins(Math.round(b.committed-capMin))+" over · ":""}${leftLbl}</span></div>
    <div class="bar"><div class="seg1" style="width:${seg1}%"></div><div class="seg2" style="width:${seg2}%"></div></div></div>`;
  let html="";
  const dueToday=dueOn(d);
  const dueStrip=dueToday.length?sec("Due today")+`<div class="plan">${dueToday.map(dueRowHTML).join("")}</div>`:"";

  /* THE PLAN — the system's live proposal for the whole day, in order */
  const pl=planFor(d);
  const now=Date.now();
  if(state.todayView==="list"){
    const taskBlocks=pl.blocks.filter(b2=>!b2.unavail);
    const ids=todayListOrder([...new Set(taskBlocks.map(b2=>b2.node.id))]);
    const byIdBlock={}; taskBlocks.forEach(b2=>{ if(!byIdBlock[b2.node.id]) byIdBlock[b2.node.id]=b2; });
    html+=dueStrip;
    let lh=sec("Today's tasks","<span>hold ≡ to reorder</span>")+`<div class="plan" id="todayList">`;
    for(const id of ids){
      const bk=byIdBlock[id]; if(!bk) continue;
      const n=bk.node, col=nodeColor(n);
      const bits=taskBits(n,{block:bk.fixed?bk:null});
      lh+=`<div class="planrow" data-open="${n.id}">
        ${markHTML(n)}
        <div class="pbar"${col?` style="--pc:${esc(col)}"`:""}></div>
        <div class="body"><div class="title" style="font-size:15px">${n.icon?esc(n.icon)+" ":""}${esc(n.title||"Untitled")}</div>
          ${bits.length?`<div class="why">${bits.join(" · ")}</div>`:""}</div>
        <span class="draghandle" data-drag>≡</span>
      </div>`;
    }
    lh+=`</div>
    <div class="fieldnote">Reorder these however you like. The Schedule view follows your order; only real due times can still pull something earlier.</div>`;
    html+= taskBlocks.length?lh:emptyHTML("Nothing planned yet","Tap + to add something.",null);
    if(b.waiting.length) html+=sec("Waiting on")+listHTML(b.waiting,{showPath:true});
    if(b.doneToday.length) html+=sec("Done today",`<span>${b.doneToday.length}</span>`)+listHTML(b.doneToday,{hideNotes:true});
    html+=`<div style="height:8px"></div>`+capCard;
    return html;
  }
  html+=dueStrip;
  if(pl.blocks.length){
    html+=sec("The plan",`<span>${esc(fmtHM(sleepFor(d).wake))} to ${esc(fmtHM(sleepFor(d).bed))}</span>`)+`<div class="plan">`;
    for(const bk of pl.blocks){
      if(bk.unavail){
        html+=`<div class="planrow unavail">
          <div class="pt tnum"><b>${esc(fmtTime(bk.start.toISOString()))}</b>${mins(bk.minutes)}</div>
          <div class="pbar"></div>
          <div class="body"><div class="title" style="font-size:15px">${esc(bk.label)}</div>
            <div class="why">unavailable</div></div></div>`;
        continue;
      }
      const n=bk.node, past=bk.end.getTime()<now;
      const cls=(bk.fixed?"":(bk.fuzzy?"ghost fuzzy":"ghost"))+(bk.bg?" bg":"");
      const col=nodeColor(n);
      const bits=taskBits(n,{block:bk});
      html+=`<div class="planrow ${cls}${past?" past":""}" data-open="${n.id}">
        ${markHTML(n)}
        <div class="pt tnum"><b>${esc(fmtTime(bk.start.toISOString()))}</b>${mins(bk.minutes)}</div>
        <div class="pbar"${col?` style="--pc:${esc(col)}"`:""}></div>
        <div class="body"><div class="title" style="font-size:15px">${n.icon?esc(n.icon)+" ":""}${esc(n.title||"Untitled")}</div>
          ${bits.length?`<div class="why">${bits.join(" · ")}</div>`:""}</div>
      </div>`;
    }
    if(pl.unplaced.length) html+=`<div class="plannote">${pl.unplaced.length} more did not fit before your day ends: ${
      esc(pl.unplaced.slice(0,3).map(u=>u.node.title||"Untitled").join(", "))}${pl.unplaced.length>3?"…":""}. Trim estimates, push deadlines, or let them go.</div>`;
    html+=`</div>`;
  } else if(b.waiting.length||b.blocked.length||b.doneToday.length){
    html+=sec("The plan")+`<div class="plan"><div class="plannote">Nothing to place. Everything open is waiting, blocked, or done.</div></div>`;
  }

  if(b.waiting.length) html+=sec("Waiting on")+listHTML(b.waiting,{showPath:true});
  if(b.blocked.length) html+=sec("Blocked","<span>waiting on other tasks</span>")+listHTML(b.blocked,{showPath:true,hideNotes:true});
  if(b.quick.length) html+=sec("Quick wins","<span>10 minutes or less</span>")+listHTML(b.quick,{est:true});
  if(b.later&&b.later.length) html+=sec("Later","<span>more than fits in today's hours</span>")+listHTML(b.later,{est:true,showPath:true});
  if(b.doneToday.length) html+=sec("Done today",`<span>${b.doneToday.length}</span>`)+listHTML(b.doneToday,{hideNotes:true});
  html+=`<div style="height:8px"></div>`+capCard;

  if(!pl.blocks.length&&!b.waiting.length&&!b.blocked.length&&!b.quick.length&&!b.doneToday.length)
    html+=emptyHTML("Nothing planned yet","Tap + to add something, or open Browse and give a few things due dates so they can rank.",
      `<div style="margin-top:14px"><button class="line accent" style="display:inline-flex;border-radius:10px;background:var(--elev);padding:0 18px" data-act="seed">Show me with an example</button></div>`);
  return html;
}

function monthHTML(proj){
  const cur=state.calCursor;
  const first=new Date(cur.getFullYear(),cur.getMonth(),1);
  const lead=(first.getDay()+7)%7;
  const dows=["S","M","T","W","T","F","S"];
  let cells="";
  for(let i=0;i<42;i++){
    const d=new Date(cur.getFullYear(),cur.getMonth(),1-lead+i,12,0,0);
    const out=d.getMonth()!==cur.getMonth();
    const k=dayKey(d);
    const dls=Array.from(state.nodes.values()).filter(n=>n.deadline&&sameDay(n.deadline,d)&&n.status!=="done"&&n.status!=="dropped");
    const fx=fixedOn(d);
    const load=loadOn(d,proj), cap=hoursFor(d)*60;
    const ratio=cap?clamp(load/cap,0,1.35):0;
    const tint=ratio<=0?"transparent":ratio>1
      ? `rgba(255,149,0,${0.10+0.22*clamp(ratio-1,0,1)})`
      : `rgba(var(--accent-rgb),${0.05+0.16*ratio})`;
    let marks="";
    if(state.settings.layers.deadline) marks+=dls.slice(0,3).map(()=>`<span class="m dl"></span>`).join("");
    if(state.settings.layers.fixed&&fx.length) marks+=`<span class="m fx"></span>`;
    cells+=`<button class="cal${out?" out":""}${sameDay(d,new Date())?" today":""}${sameDay(d,state.calSel)?" sel":""}"
      data-day="${k}" style="background:${tint}">
      <span class="num tnum">${d.getDate()}</span><span class="marks">${marks}</span></button>`;
  }
  /* timeframe banner: fuzzy commitments aimed at this month, never at a day */
  const tfs=timeframeItems().filter(n=>tfInMonth(n.timeframe,cur.getFullYear(),cur.getMonth()));
  const banner=tfs.length?`<div class="tfbanner"><div class="t">Sometime this month</div>${
    tfs.map(n=>`<div class="tfitem"><span data-open="${n.id}" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${n.icon?esc(n.icon)+" ":""}${esc(n.title||"Untitled")}</span>
      <button class="needs" data-needsdate="${n.id}">Needs a date</button></div>`).join("")}</div>`:"";
  return calNav()+banner+`<div class="calhead">${dows.map(x=>`<div>${x}</div>`).join("")}</div>
    <div class="calgrid">${cells}</div>`+daySummaryHTML(state.calSel,proj);
}

/* compact selected-day summary under the month grid */

    `<div class="tlrow" data-open="${n.id}"><div class="tltime tnum">${esc(fmtTime(n.fixedStart))}</div>
      <div class="tlbar"></div><div class="body"><div class="title" style="font-size:15px">${esc(n.title)}</div>
      <div class="sub">${n.fixedEnd?esc("until "+fmtTime(n.fixedEnd)):""}</div></div></div>`).join("")+`</div>`;
  if(pj.length) html+=sec("Projected work")+`<div class="tl">`+

      </div></div>`).join("")+`</div>`;
  html+=`<div class="field" style="margin-top:14px"><button class="line accent" data-newon="${k}">Add a task on this day</button>
    <button class="line" data-caphours="${k}"><label>Hours available</label><span class="val">${Math.round(hoursFor(d)*10)/10}h</span></button></div>`;
  return html;
}

/* month overview: stats, deadlines, timeframe items, things needing a date */
function monthOverviewHTML(proj){
  const cur=state.calCursor, y=cur.getFullYear(), m=cur.getMonth();
  const inMonth=iso=>{ const d=new Date(iso); return d.getFullYear()===y&&d.getMonth()===m; };
  const dls=Array.from(state.nodes.values())
    .filter(n=>n.deadline&&inMonth(n.deadline)&&n.status!=="done"&&n.status!=="dropped")
    .sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));
  const fx=Array.from(state.nodes.values())
    .filter(n=>n.fixedStart&&inMonth(n.fixedStart)&&n.status!=="dropped")
    .sort((a,b)=>new Date(a.fixedStart)-new Date(b.fixedStart));
  const tfs=timeframeItems().filter(n=>tfInMonth(n.timeframe,y,m));
  let load=0,cap=0;
  const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate();
  for(let i=0;i<days;i++){ const d=addDays(first,i); load+=loadOn(d,proj); cap+=hoursFor(d)*60; }
  let html=secBig("Month overview")+`<div class="statcard">
    <div class="statrow"><span>Deadlines</span><span class="v tnum">${dls.length}</span></div>
    <div class="statrow"><span>Fixed blocks</span><span class="v tnum">${fx.length}</span></div>
    <div class="statrow"><span>Timeframe items</span><span class="v tnum">${tfs.length}</span></div>
    <div class="statrow"><span>Projected load</span><span class="v tnum">${mins(Math.round(load))} of ${Math.round(cap/60)}h</span></div></div>`;
  if(tfs.length) html+=sec("Sometime this month, needs a date")+`<div class="group">${tfs.map(n=>
    `<div class="row" data-row="${n.id}"><div class="rowin" data-open="${n.id}">
      <span class="mark">${n.icon?`<span class="nodeicon">${esc(n.icon)}</span>`:'<span class="circle"></span>'}</span>
      <div class="body"><div class="title">${esc(n.title||"Untitled")}</div>
        <div class="sub"><span class="pill blue">${esc(tfLabel(n.timeframe))}</span></div></div>
      <button class="trail" data-needsdate="${n.id}" style="color:var(--accent);font-size:14px">Set date</button>
    </div></div>`).join("")}</div>`;
  if(dls.length) html+=sec("Deadlines this month")+listHTML(dls.slice(0,12),{hideNotes:true,showPath:true});
  if(fx.length) html+=sec("Fixed blocks this month")+`<div class="tl">`+fx.slice(0,10).map(n=>
    `<div class="tlrow" data-open="${n.id}"><div class="tltime tnum">${esc(fmtDate(n.fixedStart))}</div>
      <div class="tlbar"></div><div class="body"><div class="title" style="font-size:15px">${esc(n.title)}</div>
      <div class="sub">${esc(fmtTime(n.fixedStart))}${n.fixedEnd?" to "+esc(fmtTime(n.fixedEnd)):""}</div></div></div>`).join("")+`</div>`;
  return html;
}

/* ---- week: seven columns with real time-of-day layout ---- */
function weekColsHTML(proj){
  const base=state.calSel;
  const start=addDays(base,-((base.getDay()+7)%7));
  const PPH=34, height=24*PPH+30;
  let cols="";
  for(let i=0;i<7;i++){
    const d=addDays(start,i);
    const k=dayKey(d);
    const sl=sleepFor(d);
    const wake=hmToMin(sl.wake), bed=hmToMin(sl.bed);
    let blocks="";
    blocks+=`<div class="wkblk sleepz" style="top:30px;height:${wake/60*PPH}px"></div>`;
    if(bed>wake) blocks+=`<div class="wkblk sleepz" style="top:${30+bed/60*PPH}px;height:${(1440-bed)/60*PPH}px"></div>`;
    const pl=planFor(d,proj);
    const vis=pl.blocks.filter(bk=>{
      if(bk.unavail) return true;
      if(bk.fixed&&!state.settings.layers.fixed) return false;
      if(!bk.fixed&&!bk.unavail&&!state.settings.layers.projected) return false;
      return true; });
    layoutLanes(vis);
    for(const bk of vis){
      const top=30+(bk.start.getHours()*60+bk.start.getMinutes())/60*PPH;
      const h=Math.max(13,(bk.end-bk.start)/HOUR*PPH);
      if(bk.unavail){
        blocks+=`<div class="wkblk unav" style="top:${top}px;height:${h}px;left:0;right:0">${esc(bk.label||"")}</div>`;
        continue; }
      const cls=(bk.fixed?"":(bk.fuzzy?" fuzzy":" plan2"))+(bk.bg?" bgtask":"");
      const L=bk.lanes||1, li=bk.lane||0;
      const pos=L>1?`left:calc(2px + (100% - 4px)*${li}/${L});width:calc((100% - 4px)/${L} - 2px);right:auto;`:"";
      const wc=bk.node.category&&catByName(bk.node.category);
      const wsub=h>=26?`<div class="bs">${esc(fmtTime(bk.start.toISOString()))}${wc?" · "+(wc.icon?esc(wc.icon):esc(wc.name)):""}${h>=40&&wc&&wc.icon?" "+esc(wc.name):""}</div>`:"";
      blocks+=`<div class="wkblk${cls}" data-open="${bk.node.id}" style="top:${top}px;height:${h}px;${pos}">${bk.bg?"⟳ ":""}${esc(bk.node.title||"")}${wsub}</div>`;
    }
    if(state.settings.layers.deadline){
      const dls=Array.from(state.nodes.values()).filter(n=>n.deadline&&sameDay(n.deadline,d)&&n.status!=="done"&&n.status!=="dropped");
      if(dls.length) blocks+=`<div style="position:absolute;top:16px;left:0;right:0;text-align:center;font-size:9px;color:var(--red)">●${dls.length>1?"×"+dls.length:""}</div>`;
    }
    cols+=`<div class="wkcol" style="height:${height}px" data-dayjump="${k}">
      <div class="wkhd${sameDay(d,new Date())?" today":""}">${d.toLocaleDateString(undefined,{weekday:"short"})}<b class="tnum">${d.getDate()}</b></div>
      ${blocks}</div>`;
  }
  let gutter=`<div class="wkgutter" style="height:${height}px">`;
  for(let h2=0;h2<24;h2++){ const t2=new Date(); t2.setHours(h2,0,0,0);
    gutter+=`<div class="wkhr tnum" style="top:${30+h2*PPH}px">${t2.toLocaleTimeString(undefined,{hour:"numeric"})}</div>`; }
  gutter+=`</div>`;
  return calNav()+`<div class="wkcolwrap"><div class="wkcols">${gutter}${cols}</div></div>
    <div class="fieldnote" style="margin-top:10px">Every task, placed. Solid blocks are fixed. Dashed blocks are the plan. Gradient edged blocks are on the day but not pinned to a length. Dimmed bands are sleep. Tap a header to open that day.</div>`;
}

/* ---- day: true hour-by-hour visual layout ---- */
function dayViewHTML(d,proj){
  const k=dayKey(d);
  const sl=sleepFor(d);
  const wake=hmToMin(sl.wake), bed=hmToMin(sl.bed);
  const PPH=56, height=24*PPH+16;
  let inner="";
  for(let h=0;h<24;h++){
    const t=new Date(d); t.setHours(h,0,0,0);
    inner+=`<div class="dayhour tnum" style="top:${h*PPH}px">${t.toLocaleTimeString(undefined,{hour:"numeric"})}</div>`;
  }
  inner+=`<div class="dayblock sleepz" style="top:0;height:${wake/60*PPH}px">Sleep · wake ${esc(fmtHM(sl.wake))}</div>`;
  if(bed>wake) inner+=`<div class="dayblock sleepz" style="top:${bed/60*PPH}px;height:${(1440-bed)/60*PPH}px">Sleep · bed ${esc(fmtHM(sl.bed))}</div>`;

  const pl=planFor(d,proj);
  const vis=pl.blocks.filter(bk=>{
    if(bk.unavail) return true;
    if(bk.fixed&&!state.settings.layers.fixed) return false;
    if(!bk.fixed&&!bk.unavail&&!state.settings.layers.projected) return false;
    return true; });
  const laned=vis.filter(bk=>!bk.unavail);
  layoutLanes(laned);
  for(const bk of vis){
    const top=(bk.start.getHours()*60+bk.start.getMinutes())/60*PPH;
    const h=Math.max(26,(bk.end-bk.start)/HOUR*PPH);
    if(bk.unavail){
      inner+=`<div class="dayblock unav" style="top:${top}px;height:${h}px">${esc(bk.label||"Unavailable")} · ${esc(fmtTime(bk.start.toISOString()))} to ${esc(fmtTime(bk.end.toISOString()))}</div>`;
      continue; }
    const cls=(bk.fixed?"":(bk.fuzzy?" fuzzy":" plan2"))+(bk.bg?" bgtask":"");
    const col=nodeColor(bk.node);
    const L=bk.lanes||1, li=bk.lane||0;
    const pos=L>1?`left:calc(56px + (100% - 66px)*${li}/${L});width:calc((100% - 66px)/${L} - 4px);right:auto;`:"";
    const cat2=bk.node.category&&catByName(bk.node.category);
    const catTxt=cat2?(cat2.icon?esc(cat2.icon)+" ":"")+esc(cat2.name):null;
    const sub=bk.fixed
      ? [(bk.bg?"⟳ runs alongside":null),
         esc(fmtTime(bk.node.fixedStart))+(bk.node.fixedEnd?" to "+esc(fmtTime(bk.node.fixedEnd)):" · open end"),
         catTxt].filter(Boolean).join(" · ")
      : [esc(fmtTime(bk.start.toISOString()))+", "+(bk.fuzzy?"~"+mins(bk.minutes)+" flexible":mins(bk.minutes)),
         bk.late?"⚠︎ after due time":(bk.dueBy?"due by "+esc(fmtTime(bk.node.deadline)):(bk.node.deadline?"due "+esc(relDay(bk.node.deadline)):null)),
         catTxt].filter(Boolean).join(" · ");
    inner+=`<div class="dayblock${cls}" data-open="${bk.node.id}" style="top:${top}px;height:${h}px;${pos}${col?"border-left-color:"+esc(col)+";":""}">
      <div class="bt">${esc(bk.node.title||"Untitled")}</div><div class="bs">${sub}</div></div>`;
  }
  /* due-time ticks: hard marks where something must be finished */
  if(state.settings.layers.deadline) for(const n of state.nodes.values()){
    if(!n.deadline||!n.deadlineHasTime||!sameDay(n.deadline,d)||n.status==="done"||n.status==="dropped") continue;
    const dl=new Date(n.deadline), top=(dl.getHours()*60+dl.getMinutes())/60*PPH;
    inner+=`<div class="dlTick" data-l="${esc((n.title||"due").slice(0,22))} · ${esc(fmtTime(n.deadline))}" style="top:${top}px"></div>`;
  }
  if(sameDay(d,new Date())){
    const now=new Date(), top=(now.getHours()*60+now.getMinutes())/60*PPH;
    inner+=`<div class="nowline" id="nowline" style="top:${top}px"></div>`;
  }
  for(let h=0;h<24;h++)
    inner+=`<div class="dayfree" data-slot="${k}T${String(h).padStart(2,"0")}:00" style="top:${h*PPH}px;height:${PPH}px"></div>`;

  const dls=state.settings.layers.deadline?Array.from(state.nodes.values())
    .filter(n=>n.deadline&&sameDay(n.deadline,d)&&n.status!=="done"&&n.status!=="dropped"):[];
  const unpl=pl.unplaced.length?`<div class="fieldnote warn" style="margin-top:10px">${pl.unplaced.length} task${pl.unplaced.length===1?"":"s"} didn’t fit this day: ${esc(pl.unplaced.slice(0,3).map(u=>u.node.title||"Untitled").join(", "))}${pl.unplaced.length>3?"…":""}</div>`:"";
  return calNav()
    +(dls.length?sec("Due this day")+listHTML(dls,{hideNotes:true}):"")
    +`<div class="caldate"><span>${d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</span>
       <span>${mins(Math.round(loadOn(d,proj)))} of ${Math.round(hoursFor(d)*10)/10}h</span></div>
     <div class="daywrap"><div class="dayaxis" style="height:${height}px">${inner}</div></div>`
    +unpl
    +`<div class="fieldnote" style="margin-top:10px">Solid blocks are fixed. Dashed blocks are the plan, drawn to scale. Gradient edged blocks are on the day but not pinned to a length. A red line marks a due time. Tap an empty slot to put a task there.</div>`;
}

/* ===========================================================================
   BROWSE — the complete view of everything in the system.
   All · Groups · Categories · Contexts · Flagged · Someday · saved filters.
   =========================================================================== */
function matchFilter(n,f){
  if(!f) return true;
  if(f.category&&n.category!==f.category) return false;
  if(f.deliverable&&n.deliverable!==f.deliverable) return false;
  if(f.context&&n.context!==f.context) return false;
  if(f.energy&&n.energy!==f.energy) return false;
  if(f.stakes&&effStakes(n)!==f.stakes) return false;
  if(f.status&&effStatus(n)!==f.status) return false;
  return true;
}
function matchSearch(n,q){
  if(!q) return true;
  q=q.toLowerCase();
  return (n.title||"").toLowerCase().includes(q)||(n.notes||"").toLowerCase().includes(q);
}
function selbarHTML(){
  const modes=[["all","All"],["foryou","Attention"],["groups","Groups"],["cats","Categories"],
    ["contexts","Contexts"],["flagged","Flagged"],["someday","Someday"],["ranked","Ranked"],["completed","Completed"]];
  const f=state.activeFilter;
  const fLbl=f?Object.entries(f).filter(([k,v])=>k!=="name"&&v).map(([k,v])=>k==="stakes"?STAKES_LABEL[v]:(k==="status"?statusLabel(v):v)).join(" · "):"";
  let h=`<div class="selbar"><button data-bmode="custom"${state.browseMode==="custom"?' class="on"':""}
    style="display:inline-flex;align-items:center;gap:5px">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M1.5 4h13M4 8h8M6.5 12h3"/></svg>${fLbl?esc(fLbl.slice(0,28)):"Filter"}</button>`;
  h+=modes.map(([m,l])=>
    `<button data-bmode="${m}"${state.browseMode===m?' class="on"':""}>${l}</button>`).join("");
  state.filters.forEach((f2,i)=>{ h+=`<button data-bmode="filter:${i}"${state.browseMode==="filter:"+i?' class="on"':""}>${esc(f2.name)}</button>`; });
  return h+`</div>`;
}
function searchHTML(ph){
  return `<div class="searchwrap">${ICON_SEARCH}<input id="searchIn" type="search" placeholder="${esc(ph||"Search titles and notes")}"
    value="${esc(state.search)}" autocomplete="off"></div>`;
}
/* the smart Browse landing: what needs attention, then the shape of everything */
function browseHomeHTML(){
  const now=new Date();
  const all=Array.from(state.nodes.values()).filter(n=>n.id!==UNSORTED);
  const open=all.filter(n=>n.status!=="done"&&n.status!=="dropped");
  const uns=childrenOf(UNSORTED).filter(n=>n.status!=="done"&&n.status!=="dropped");
  const stalled=open.filter(n=>n.kind==="group"&&isStalled(n));
  const bumped=open.filter(n=>n.kind==="task"&&n.bumpCount>=4);
  const expiring=open.filter(n=>n.expiry&&new Date(n.expiry)>now&&new Date(n.expiry)<addDays(now,7));
  const fups=open.filter(n=>n.status==="waiting"&&n.followUpDate&&new Date(n.followUpDate)<=now);
  const overdue=open.filter(n=>n.kind==="task"&&n.deadline&&startOfDay(n.deadline)<startOfDay(now)&&effStatus(n)==="available");
  const rows=[];
  const arow=(ico,bg,label,n,act)=>`<button class="arow" ${act}>
    <span class="aico" style="background:${bg}">${ico}</span><span>${label}</span>
    <span class="n tnum">${n}${ICON_CHEV}</span></button>`;
  if(uns.length) rows.push(arow("📥","rgba(var(--accent-rgb),.14)","Unsorted, still needs a home",uns.length,`data-open="${UNSORTED}"`));
  if(overdue.length) rows.push(arow("⏰","rgba(255,59,48,.14)","Overdue and still doable",overdue.length,`data-bmode="attn:overdue"`));
  if(fups.length) rows.push(arow("👋","rgba(255,149,0,.14)","Follow ups that are due",fups.length,`data-bmode="attn:fups"`));
  if(stalled.length) rows.push(arow("🧱","rgba(255,149,0,.14)","Stalled groups, nothing inside can move",stalled.length,`data-bmode="attn:stalled"`));
  if(bumped.length) rows.push(arow("↪️","rgba(255,149,0,.14)","Pushed back 4 or more times",bumped.length,`data-bmode="attn:bumped"`));
  if(expiring.length) rows.push(arow("⌛","rgba(142,142,147,.16)","Goes moot within a week",expiring.length,`data-bmode="attn:expiring"`));
  let html="";
  if(rows.length) html+=sec("Needs attention")+`<div class="attn">${rows.join("")}</div>`;
  const recent=open.filter(n=>n.kind==="task"&&!sameDay(n.touchedAt,now))
    .sort((a,b)=>(b.touchedAt||"").localeCompare(a.touchedAt||"")).slice(0,4);
  if(recent.length) html+=sec("Jump back in","<span>recently touched</span>")+listHTML(recent,{showPath:true,hideNotes:true});
  const groups=childrenOf(null).filter(n=>n.kind==="group"&&n.status!=="dropped");
  if(groups.length) html+=sec("Groups")+listHTML(groups,{forceIcons:true});
  return html;
}
function attnItems(key){
  const now=new Date();
  const open=Array.from(state.nodes.values()).filter(n=>n.id!==UNSORTED&&n.status!=="done"&&n.status!=="dropped");
  if(key==="overdue") return open.filter(n=>n.kind==="task"&&n.deadline&&startOfDay(n.deadline)<startOfDay(now)&&effStatus(n)==="available");
  if(key==="fups") return open.filter(n=>n.status==="waiting"&&n.followUpDate&&new Date(n.followUpDate)<=now);
  if(key==="stalled") return open.filter(n=>n.kind==="group"&&isStalled(n));
  if(key==="bumped") return open.filter(n=>n.kind==="task"&&n.bumpCount>=4);
  if(key==="expiring") return open.filter(n=>n.expiry&&new Date(n.expiry)>now&&new Date(n.expiry)<addDays(now,7));
  return [];
}
function renderBrowse(){
  const mode=state.browseMode;
  if(mode==="groups") return renderGroupsTree();
  if(mode==="cats") return renderCategories();
  setTitles("Browse","Browse",null);
  let html=selbarHTML()+searchHTML();
  let items=Array.from(state.nodes.values()).filter(n=>n.id!==UNSORTED);
  if(mode.startsWith("attn:")){
    const key=mode.slice(5);
    const label={overdue:"Overdue",fups:"Follow-ups due",stalled:"Stalled groups",bumped:"Pushed back 4+ times",expiring:"Goes moot soon"}[key]||"Attention";
    setTitles(label,label,"Attention");
    const its=attnItems(key).filter(n=>matchSearch(n,state.search)).sort((a,b)=>score(b)-score(a));
    content.innerHTML=searchHTML()+(its.length?listHTML(its,{showPath:true,est:true}):emptyHTML("All clear","Nothing in this list right now.",null));
    wireSearch(); return;
  }
  if(mode==="contexts") return renderContexts(html);
  if(mode==="foryou"){
    html+=browseHomeHTML();
    content.innerHTML=html; wireSearch(); return;
  }
  if(mode==="flagged") items=items.filter(n=>n.flagged&&n.status!=="done"&&n.status!=="dropped");
  if(mode==="someday") items=items.filter(n=>n.status==="someday");
  if(mode==="custom"){
    if(!state.activeFilter){
      html+=emptyHTML("No filter set","Combine category, deliverable, context, energy, stakes and state in Settings, then save it as a chip.",
        `<button data-act="editfilter">Build a filter</button>`);
      content.innerHTML=html; wireSearch(); return;
    }
    items=items.filter(n=>matchFilter(n,state.activeFilter));
    html+=`<div class="fieldnote" style="margin:0 20px 10px">Filtering by ${
      Object.entries(state.activeFilter).filter(([k,v])=>k!=="name"&&v).map(([k,v])=>k+" = "+(k==="stakes"?STAKES_LABEL[v]:v)).join(", ")
      } · <button data-act="editfilter" style="color:var(--accent)">change</button></div>`;
  }
  if(mode.startsWith("filter:")){ const f=state.filters[+mode.slice(7)];
    items=items.filter(n=>matchFilter(n,f)); }
  items=items.filter(n=>matchSearch(n,state.search));
  const open=items.filter(n=>n.status!=="done"&&n.status!=="dropped");
  const closed=items.filter(n=>n.status==="done"||n.status==="dropped")
    .sort((a,b)=>(b.completedAt||b.touchedAt).localeCompare(a.completedAt||a.touchedAt));
  if(mode==="completed"){
    content.innerHTML=html+(closed.length?sec("Completed",`<span>${closed.length}</span>`)+listHTML(closed,{showPath:true,hideNotes:true})
      :emptyHTML("Nothing finished yet","Completed and dropped items collect here.",null));
    wireSearch(); return;
  }
  if(mode==="ranked"){
    const rk=open.filter(n=>n.kind==="task").sort((a,b)=>score(b)-score(a));
    content.innerHTML=html+(rk.length?sec("Highest ranked right now",`<span>${rk.length}</span>`)+listHTML(rk,{est:true,showPath:true})
      :emptyHTML("Nothing to rank","Open tasks are ranked live from how close their deadlines are, their stakes, and how long they have sat.",null));
    wireSearch(); return;
  }
  if(mode==="all"){
    const flat=open.filter(n=>n.kind==="task")
      .sort((a,b)=>(a.title||"").localeCompare(b.title||"",undefined,{sensitivity:"base"}));
    content.innerHTML=html+(flat.length?sec("All open tasks",`<span>${flat.length}</span>`)+listHTML(flat,{est:true,showPath:true})
      :emptyHTML(state.search?"No matches":"Nothing here",
        state.search?"Nothing in titles or notes matches that.":"Tap + to capture your first task.",null));
    wireSearch(); return;
  }
  const openSorted=open.sort((a,b)=>score(b)-score(a));
  if(!openSorted.length&&!closed.length)
    html+=emptyHTML(state.search?"No matches":"Nothing here",
      state.search?"Nothing in titles or notes matches that.":"Tap + to capture your first task.",null);
  else{
    if(openSorted.length) html+=sec("Items",`<span>${openSorted.length}</span>`)+listHTML(openSorted,{est:true,showPath:true});
    if(closed.length&&state.showDone) html+=sec("Completed",`<span>${closed.length}</span>`)+listHTML(closed,{showPath:true,hideNotes:true});
  }
  content.innerHTML=html; wireSearch();
}
function renderGroupsTree(){

  if(cur&&!parent){ state.path=[]; return renderGroupsTree(); }
  setTitles(cur?(parent.title||"Untitled"):"Browse", cur?(parent.title||"Untitled"):"Browse",
    state.path.length?pathLabel(state.path.length>1?state.path[state.path.length-2]:null):null);
  if(state.path.length>1){
    const c=$("#crumbs"); c.hidden=false;

  }
  let html=cur?"":selbarHTML();

  if(parent&&parent.notes) html+=`<div class="sechead" style="padding-bottom:2px">${esc(parent.notes.split("\n")[0]).slice(0,160)}</div>`;

function wireSearch(){
  const el=$("#searchIn"); if(!el) return;
  el.addEventListener("input",()=>{ state.search=el.value;
    clearTimeout(wireSearch.t); wireSearch.t=setTimeout(()=>{ const pos=el.selectionStart;

function renderLog(){

  $("#navExtra").innerHTML=`<div class="seg mini">
    <button data-lmode="activity"${state.logMode==="activity"?' class="on"':""}>Activity</button>

    <button data-lmode="monthly"${state.logMode==="monthly"?' class="on"':""}>Monthly</button></div>`;
  if(state.logMode==="weekly") content.innerHTML=weeklyReviewHTML();
  else if(state.logMode==="monthly") content.innerHTML=monthlyReviewHTML();
  else content.innerHTML=activityHTML();
}
function activityHTML(){
  const items=Array.from(state.nodes.values())
    .filter(n=>n.status==="done"||n.status==="dropped")
    .sort((a,b)=>(b.completedAt||b.touchedAt).localeCompare(a.completedAt||a.touchedAt));
  if(!items.length) return emptyHTML("Nothing finished yet",
    "Completed and dropped work collects here so you can see what you got done.",null);
  const days=new Map();
  for(const n of items){ const key=new Date(n.completedAt||n.touchedAt).toDateString();
    if(!days.has(key)) days.set(key,[]); days.get(key).push(n); }
  const t=new Date().toDateString(), y=new Date(Date.now()-DAY).toDateString();
  const doneCount=items.filter(n=>n.status==="done").length;
  return `<div class="sechead"><span class="h">${doneCount} completed</span><span>${items.length-doneCount} dropped</span></div>`+
    Array.from(days.entries()).map(([key,ns])=>{
      const lbl=key===t?"Today":key===y?"Yesterday":new Date(key).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
      return sec(lbl,`<span>${ns.length}</span>`)+listHTML(ns,{showPath:true,hideNotes:true});
    }).join("");
}
function weeklyReviewHTML(){
  const all=Array.from(state.nodes.values()).filter(n=>n.id!==UNSORTED);
  const stalled=all.filter(n=>n.kind==="group"&&isStalled(n));
  const bumped=all.filter(n=>n.bumpCount>=4&&n.status!=="done"&&n.status!=="dropped");
  const stale=all.filter(n=>n.kind==="task"&&n.status!=="done"&&n.status!=="dropped"&&
    (Date.now()-new Date(n.touchedAt))/DAY>=14);
  const follow=all.filter(n=>n.status==="waiting"&&n.followUpDate&&new Date(n.followUpDate)<=new Date());
  const uns=childrenOf(UNSORTED).filter(n=>n.status!=="done"&&n.status!=="dropped");
  /* timeframe items whose window opens within ~3 weeks: time to pin a date */
  const tfSoon=timeframeItems().filter(n=>{ const s=tfStart(n.timeframe);
    return s&&(s-Date.now())/DAY<21; });
  const sect=(t2,ns,note,extra)=>ns.length
    ? sec(t2,`<span>${ns.length}</span>`)+`<div class="fieldnote" style="margin:2px 20px 8px">${esc(note)}</div>`+(extra||listHTML(ns,{showPath:true,hideNotes:true}))
    : "";
  const tfList=tfSoon.length?`<div class="group">${tfSoon.map(n=>
    `<div class="row"><div class="rowin" data-open="${n.id}">
      <span class="mark"><span class="circle"></span></span>
      <div class="body"><div class="title">${esc(n.title||"Untitled")}</div>
      <div class="sub"><span class="pill blue">${esc(tfLabel(n.timeframe))}</span></div></div>
      <button class="trail" data-needsdate="${n.id}" style="color:var(--accent);font-size:14px">Set date</button></div></div>`).join("")}</div>`:"";
  const body=sect("Timeframes to pin down",tfSoon,"Their window is under three weeks away. Give each a real date or push the window.",tfList)+
    sect("Stalled groups",stalled,"Nothing inside these can be acted on. Add a next step or mark one unblocked.")+
    sect("Pushed back repeatedly",bumped,"Four or more deferrals. Split, redefine, or drop.")+
    sect("Untouched 14 days",stale,"Still open, no movement. Decide if it is real.")+
    sect("Follow-ups due",follow,"You were waiting on someone. Time to chase.")+
    sect("Unsorted",uns,"Captured but never filed.");
  const backup=backupDue()?`<div class="tfbanner" style="background:rgba(255,149,0,.14)"><div class="t" style="color:var(--orange)">Backup overdue</div>
    <div class="tfitem"><span>No export in the last week. Snapshots on this phone will not survive losing the phone.</span></div>
    <div class="tfitem"><button class="needs" data-act="exportjson" style="padding-left:0">Export a backup now</button></div></div>`:"";
  return backup+(body||emptyHTML("Nothing to review","No stalled groups, no repeated deferrals, nothing going stale.",null));
}
function monthlyReviewHTML(){
  const cur=state.logMonth, y=cur.getFullYear(), m=cur.getMonth();
  const mStart=new Date(y,m,1), mEnd=new Date(y,m+1,0,23,59,59);
  const pStart=new Date(y,m-1,1), pEnd=new Date(y,m,0,23,59,59);
  const inRange=(iso,a,b)=>iso&&new Date(iso)>=a&&new Date(iso)<=b;
  const all=Array.from(state.nodes.values()).filter(n=>n.id!==UNSORTED&&n.kind==="task");
  const created=all.filter(n=>inRange(n.createdAt,mStart,mEnd));
  const completed=all.filter(n=>n.status==="done"&&inRange(n.completedAt,mStart,mEnd));
  const dropped=all.filter(n=>n.status==="dropped"&&inRange(n.touchedAt,mStart,mEnd));
  const pCreated=all.filter(n=>inRange(n.createdAt,pStart,pEnd)).length;
  const pCompleted=all.filter(n=>n.status==="done"&&inRange(n.completedAt,pStart,pEnd)).length;

  const nav=`<div style="display:flex;justify-content:space-between;padding:2px 16px 10px">
    <button class="navbtn" data-lm-move="-1">‹ Prev</button>
    <span style="align-self:center;font-weight:600">${cur.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</span>
    <button class="navbtn" data-lm-move="1">Next ›</button></div>`;
  if(!created.length&&!completed.length&&!dropped.length)
    return nav+emptyHTML("Quiet month","Nothing was created or finished in "+cur.toLocaleDateString(undefined,{month:"long"})+".",null);

  /* medians and accuracy */
  const med=a=>{ if(!a.length)return null; const s=[...a].sort((x,z)=>x-z);
    return s.length%2?s[(s.length-1)/2]:(s[s.length/2-1]+s[s.length/2])/2; };
  const cycleDays=med(completed.map(n=>(new Date(n.completedAt)-new Date(n.createdAt))/DAY));
  const accPairs=completed.filter(n=>n.actualMinutes&&n.estMaxMinutes);
  const accRatio=med(accPairs.map(n=>n.actualMinutes/n.estMaxMinutes));
  const rate=created.length?Math.round(all.filter(n=>inRange(n.createdAt,mStart,mEnd)&&n.status==="done").length/created.length*100):null;
  const dropRate=(completed.length+dropped.length)?Math.round(dropped.length/(completed.length+dropped.length)*100):0;

  /* per-day completions for the chart + busiest/lightest/streak */
  const days=new Date(y,m+1,0).getDate();
  const perDay=Array(days).fill(0);
  for(const n of completed) perDay[new Date(n.completedAt).getDate()-1]++;
  let busiest=0,bI=-1; perDay.forEach((v,i)=>{ if(v>busiest){busiest=v;bI=i;} });
  let streak=0,cur2=0; perDay.forEach(v=>{ cur2=v?cur2+1:0; streak=Math.max(streak,cur2); });

  /* category + group breakdown */
  const byCat={}; for(const n of completed){ const c=n.category||"Uncategorized"; byCat[c]=(byCat[c]||0)+1; }
  const byGroup={}; for(const n of completed){
    let top=n; const anc=ancestors(n.id); if(anc.length) top=anc[anc.length-1];
    const g=top.id===n.id?(n.parentId===UNSORTED?"Unsorted":"Loose"):(top.title||"Untitled");
    byGroup[g]=(byGroup[g]||0)+1; }
  const longestOpen=all.filter(n=>n.status!=="done"&&n.status!=="dropped")
    .sort((a,b)=>a.createdAt.localeCompare(b.createdAt)).slice(0,3);

  const dCr=created.length-pCreated, dCo=completed.length-pCompleted;
  const delta=v=>v===0?"unchanged":(v>0?"up "+v:"down "+Math.abs(v));
  let prose=`You finished <b>${completed.length}</b> task${completed.length===1?"":"s"} and created <b>${created.length}</b>. Completions ${delta(dCo)} and captures ${delta(dCr)} from last month. `;
  if(rate!=null) prose+=`Of what you created this month, ${rate}% is already done. `;
  if(cycleDays!=null) prose+=`Median time from capture to done: <b>${cycleDays<1?"under a day":Math.round(cycleDays)+" days"}</b>. `;
  if(accRatio!=null) prose+=`Where you logged actual time, work ran <b>${Math.round(accRatio*100)}%</b> of estimate. `;
  else prose+=`No actual times logged yet, so estimate accuracy cannot be measured. Log "actually took" when you finish something. `;
  if(dropped.length) prose+=`Drop rate ${dropRate}% (${dropped.length} dropped). `;
  if(bI>=0&&busiest) prose+=`Busiest day: the ${bI+1}${["st","nd","rd"][((bI+1)%10)-1]&&(bI+1)%100<11||((bI+1)%100)>13?["st","nd","rd"][((bI+1)%10)-1]||"th":"th"} with ${busiest} done. `;
  if(streak>1) prose+=`Longest streak: ${streak} consecutive days with at least one completion.`;

  const chartDays=svgBars(perDay,days,"completions per day");
  const catBars=svgHBars(Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,6));
  const grpBars=svgHBars(Object.entries(byGroup).sort((a,b)=>b[1]-a[1]).slice(0,6));

  return nav+`<div class="statcard"><h4>The month in one paragraph</h4><p>${prose}</p></div>
    <div class="statcard"><div style="display:flex;gap:24px">
      <div><div class="bignum tnum">${completed.length}</div><p>completed</p></div>
      <div><div class="bignum tnum">${created.length}</div><p>created</p></div>
      <div><div class="bignum tnum">${dropped.length}</div><p>dropped</p></div></div>
      ${chartDays}</div>
    ${Object.keys(byCat).length?`<div class="statcard"><h4>By category</h4>${catBars}</div>`:""}
    ${Object.keys(byGroup).length?`<div class="statcard"><h4>By group</h4>${grpBars}</div>`:""}
    ${longestOpen.length?sec("Longest open")+listHTML(longestOpen,{showPath:true,hideNotes:true}):""}`;
}
/* tiny inline SVG charts — no library */
function svgBars(vals,n,label){
  const W=320,H=84,max=Math.max(1,...vals);
  const bw=Math.max(2,Math.floor((W-4)/n)-2);
  let bars="";
  vals.forEach((v,i)=>{ const h=Math.round(v/max*(H-22));
    bars+=`<rect x="${2+i*(bw+2)}" y="${H-16-h}" width="${bw}" height="${Math.max(h,v?2:0)}" rx="1.5" fill="var(--accent)" opacity="${v?1:.18}"/>`;
    if(!v) bars+=`<rect x="${2+i*(bw+2)}" y="${H-18}" width="${bw}" height="2" rx="1" fill="var(--fill)"/>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${bars}
    <text x="2" y="${H-3}" font-size="9" fill="var(--label2)">1</text>
    <text x="${W-14}" y="${H-3}" font-size="9" fill="var(--label2)">${n}</text></svg>`;
}
function svgHBars(entries){
  const W=320,rh=22,H=entries.length*rh+2,max=Math.max(1,...entries.map(e=>e[1]));
  let out="";
  entries.forEach(([k,v],i)=>{ const w=Math.max(3,Math.round(v/max*(W-120)));
    out+=`<text x="0" y="${i*rh+14}" font-size="11" fill="var(--label)">${esc(k.length>14?k.slice(0,13)+"…":k)}</text>
      <rect x="104" y="${i*rh+5}" width="${w}" height="11" rx="3" fill="var(--accent)"/>
      <text x="${108+w}" y="${i*rh+14}" font-size="11" fill="var(--label2)">${v}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${out}</svg>`;
}

/* swipe — only engages on a real horizontal drag */
let sw=null;
function closeSwipe(){
  if(state.openSwipe){
    const r=document.querySelector(`[data-row="${state.openSwipe}"]`);
    if(r){ r.classList.remove("opened","swiping"); const i=r.querySelector(".rowin"); if(i) i.style.transform=""; }
    state.openSwipe=null;
  }
}
content.addEventListener("touchstart",e=>{
  const row=e.target.closest(".row");
  if(!row) return;
  if(state.openSwipe&&state.openSwipe!==row.dataset.row) closeSwipe();
  sw={row,inner:row.querySelector(".rowin"),x:e.touches[0].clientX,y:e.touches[0].clientY,
      open:state.openSwipe===row.dataset.row,lock:null};
  clearTimeout(state.pressTimer);
  state.pressTimer=setTimeout(()=>{ if(sw&&sw.lock===null){ row.classList.add("pressed"); } },90);
},{passive:true});
content.addEventListener("touchmove",e=>{
  if(!sw) return;
  const dx=e.touches[0].clientX-sw.x, dy=e.touches[0].clientY-sw.y;
  if(sw.lock===null){
    if(Math.abs(dx)<10&&Math.abs(dy)<10) return;
    clearTimeout(state.pressTimer); sw.row.classList.remove("pressed");
    sw.lock=(Math.abs(dx)>Math.abs(dy)*1.4)?"x":"y";
    if(sw.lock==="x"){ sw.inner.classList.add("dragging"); sw.row.classList.add("swiping"); }
    else { sw=null; return; }
  }
  if(sw.lock!=="x") return;
  const base=sw.open?-160:0;
  sw.inner.style.transform=`translateX(${Math.min(0,Math.max(-200,base+dx))}px)`;
},{passive:true});
function endSwipe(){
  clearTimeout(state.pressTimer);
  if(!sw){ $$(".row.pressed").forEach(r=>r.classList.remove("pressed")); return; }
  sw.row.classList.remove("pressed");
  const inner=sw.inner; inner.classList.remove("dragging");
  if(sw.lock==="x"){
    const m=/translateX\((-?[\d.]+)px\)/.exec(inner.style.transform);
    const t=m?parseFloat(m[1]):0;
    if(t<-56){ inner.style.transform="translateX(-160px)"; state.openSwipe=sw.row.dataset.row; sw.row.classList.add("opened"); }
    else { inner.style.transform=""; state.openSwipe=null; sw.row.classList.remove("swiping","opened"); }
  } else sw.row.classList.remove("swiping");
  sw=null;
}
content.addEventListener("touchend",endSwipe,{passive:true});
content.addEventListener("touchcancel",endSwipe,{passive:true});

function buildPath(id){ const chain=[]; let c=byId(id);

function confirmDelete(n){

                  :`Delete “${n.title}”? This cannot be undone.`);

/* ---------- status changes + recurrence (kept from v1) ---------- */
async function setStatus(n,status){
  if(status==="done"&&n.recurrence) return completeRecurring(n);
  n.status=status; n.completedAt=(status==="done")?nowISO():null; await save(n);
}
async function toggleDone(n){
  if(n.status==="done"){ n.status="available"; n.completedAt=null; await save(n); toast("Reopened"); }
  else { await setStatus(n,"done"); toast("Completed"); }
}
function nthWeekdayOf(y,m,nth,dow){
  if(nth===-1){ const last=new Date(y,m+1,0); const off=(last.getDay()-dow+7)%7;
    return new Date(y,m,last.getDate()-off); }
  const first=new Date(y,m,1); const off=(dow-first.getDay()+7)%7;
  const day=1+off+(nth-1)*7;
  const dim=new Date(y,m+1,0).getDate();
  return new Date(y,m,Math.min(day,dim));
}
function nextOccurrence(n,from){
  const r=n.recurrence; if(!r) return null;
  if(r.type==="months"&&r.nth!=null&&r.nthDow!=null){
    const src=new Date(n.deadline||n.fixedStart||startOfDay(from));
    const d=new Date(src.getFullYear(),src.getMonth()+(r.every||1),1);
    return startOfDay(nthWeekdayOf(d.getFullYear(),d.getMonth(),r.nth,r.nthDow));
  }
  const base=startOfDay(from);
  if(r.mode==="afterDone"||!n.deadline) return addDays(base,r.every||1);
  if(r.type==="days") return addDays(startOfDay(n.deadline),r.every||1);
  if(r.type==="weekdays"){
    const set=(r.days&&r.days.length)?r.days:[1,2,3,4,5];
    let d=addDays(startOfDay(n.deadline),1), g=0;
    while(!set.includes(d.getDay())&&g++<31) d=addDays(d,1);
    return d;
  }
  if(r.type==="weeks"){
    const set=(r.days&&r.days.length)?r.days:[startOfDay(n.deadline||base).getDay()];
    const ev=Math.max(1,r.every||1);
    const anchor=startOfDay(n.deadline||base);
    const ws=x=>addDays(x,-((x.getDay()+7)%7));
    const a0=ws(anchor);
    let d=addDays(anchor,1), g=0;
    while(g++<7*ev*3+21){
      if(set.includes(d.getDay())){
        const wk=Math.round((ws(d)-a0)/(7*DAY));
        if(wk%ev===0) return d;
      }
      d=addDays(d,1);
    }
    return d;
  }
  if(r.type==="months"){
    const src=new Date(n.deadline||base);
    const d=new Date(src); d.setDate(1); d.setMonth(d.getMonth()+(r.every||1));
    const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    d.setDate(Math.min(r.dayOfMonth||src.getDate(),dim));
    return startOfDay(d);
  }
  if(r.type==="years"){ const d=new Date(n.deadline||base); d.setFullYear(d.getFullYear()+(r.every||1)); return startOfDay(d); }
  return addDays(base,r.every||1);
}
async function completeRecurring(n){
  const r=n.recurrence;
  let next=nextOccurrence(n,new Date());
  let final=false;
  if(r&&r.until&&next&&startOfDay(next)>startOfDay(r.until)) final=true;
  if(r&&r.count){ r.left=(r.left!=null?r.left:r.count)-1; if(r.left<=0) final=true; }
  if(final||!next){
    n.recurrence=null; n.status="done"; n.completedAt=nowISO();
    await save(n); toast("Done. That was its last repeat"); return;
  }
  const archive=newNode(Object.assign({},n,{id:uid(),recurrence:null,status:"done",
    completedAt:nowISO(),createdAt:n.createdAt}));
  state.nodes.set(archive.id,archive); await putNode(archive);
  if(n.deadline&&next){ const t=new Date(n.deadline); const d=new Date(next);
    d.setHours(t.getHours(),t.getMinutes(),0,0); n.deadline=d.toISOString(); }
  else if(next) n.deadline=next.toISOString();
  if(n.fixedStart&&next){ const s=new Date(n.fixedStart), e2=n.fixedEnd?new Date(n.fixedEnd):null;
    const dur=e2?e2-s:0; const ns=new Date(next); ns.setHours(s.getHours(),s.getMinutes(),0,0);
    n.fixedStart=ns.toISOString(); n.fixedEnd=dur?new Date(ns.getTime()+dur).toISOString():null; }
  n.status="available"; n.completedAt=null; n.bumpCount=0;
  await save(n);
  toast("Done. The next one is set for "+relDay(n.deadline||next.toISOString()));
}

/* ===========================================================================
   SHEETS — iOS-style navigation stack.
   ‹ Back walks up; the root shows Close. Nothing needs a Save press:
   edits to an existing item persist as you make them (debounced write).
   The right-hand button exists only for true one-shot actions
   (Add a new task, Split, Set date).
   =========================================================================== */
const sheet=$("#sheet"), scrim=$("#scrim"), sheetBody=$("#sheetBody");
const SHEET={stack:[],current:null,leave:null,action:null};

function showSheet(title,html,onAction,actionLabel){
  const dock=$("#wizDock"); if(dock){ dock.hidden=true; dock.innerHTML=""; }
  const sameView=sheet.classList.contains("on")&&$("#sheetTitle").textContent===title;
  const keep=sameView?sheetBody.scrollTop:0;
  $("#sheetTitle").textContent=title;
  const done=$("#sheetDone");
  SHEET.action=onAction||null;
  if(onAction){ done.hidden=false; done.textContent=actionLabel||"Done"; }
  else done.hidden=true;
  sheetBody.innerHTML=html; sheetBody.scrollTop=keep;
  const lbl=$("#sheetBackLbl"), chev=$("#sheetBack svg");
  chev.style.display="";
  lbl.textContent=SHEET.stack.length?(SHEET.stack[SHEET.stack.length-1].title||""):"";
}
function animBody(dir){ sheetBody.classList.remove("fwd","back"); void sheetBody.offsetWidth;
  sheetBody.classList.add(dir); }
function sheetRoot(draw){
  SHEET.stack=[]; SHEET.current=draw; SHEET.leave=null;
  draw(); animBody("fwd");
  scrim.classList.add("on"); sheet.classList.add("on");
}
function sheetPush(draw){
  SHEET.stack.push({draw:SHEET.current,title:$("#sheetTitle").textContent,leave:SHEET.leave,scroll:sheetBody.scrollTop});
  SHEET.current=draw; SHEET.leave=null;
  draw(); animBody("fwd");
}
function sheetPop(){
  if(SHEET.leave){ const f=SHEET.leave; SHEET.leave=null; try{f();}catch(e){} }
  if(SHEET.stack.length){
    const p=SHEET.stack.pop();
    SHEET.current=p.draw; SHEET.leave=p.leave;
    p.draw(); animBody("back");
    sheetBody.scrollTop=p.scroll||0;
  } else closeSheet();
}
async function closeSheet(){
  if(SHEET.leave){ const f=SHEET.leave; SHEET.leave=null; try{f();}catch(e){} }
  await flushTaskSave();
  sheet.classList.remove("on"); scrim.classList.remove("on");
  state.editing=null; state.draft=null; state.capDraft=null; state.capWiz=null;
  SHEET.stack=[]; SHEET.current=null; SHEET.action=null;
  render();
}
scrim.addEventListener("click",()=>{ closeSheet(); });
(function(){
  let sx=0, sy=0, edge=false, target=null, active=false;
  const surface=()=>sheet.classList.contains("on")?sheetBody:content;
  const canGoBack=()=>sheet.classList.contains("on")||!$("#backBtn").hidden;
  document.addEventListener("touchstart",e=>{
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY;
    edge=sx<28&&canGoBack(); target=null; active=false;
  },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(!edge) return;
    const t=e.touches[0];
    const dx=t.clientX-sx, dy=Math.abs(t.clientY-sy);
    if(!active){ if(dx>12&&dx>dy){ active=true; target=surface();
        target.style.transition="none"; } else { if(dy>16) edge=false; return; } }
    target.style.transform="translateX("+Math.max(0,dx)+"px)";
    target.style.opacity=String(1-Math.min(0.35,dx/600));
  },{passive:true});
  document.addEventListener("touchend",e=>{
    if(!edge){ return; }
    edge=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-sx, dy=Math.abs(t.clientY-sy);
    const el=target;
    if(active&&el){
      if(dx>70&&dy<80){
        el.style.transition="transform .18s ease-out,opacity .18s ease-out";
        el.style.transform="translateX(100%)"; el.style.opacity="0.3";
        setTimeout(()=>{
          el.style.transition="none"; el.style.transform=""; el.style.opacity="";
          if(sheet.classList.contains("on")) sheetPop();
          else { const bb=$("#backBtn"); if(bb&&!bb.hidden) bb.click(); }
          setTimeout(()=>{ el.style.transition=""; },50);
        },180);
      } else {
        el.style.transition="transform .2s ease,opacity .2s ease";
        el.style.transform=""; el.style.opacity="";
        setTimeout(()=>{ el.style.transition=""; },220);
      }
    } else if(dx>70&&dy<60){
      if(sheet.classList.contains("on")) sheetPop();
      else { const bb=$("#backBtn"); if(bb&&!bb.hidden) bb.click(); }
    }
    target=null; active=false;
  },{passive:true});
})();

const DUR_OPTS=[5,10,15,20,25,30,40,45,60,75,90,120,150,180,240,300,360,480];
function durSelect(id,val){

function normalizeTiming(d){
  if(d.estMinMinutes!=null&&d.estMaxMinutes==null) d.estMaxMinutes=d.estMinMinutes;
  if(d.estMaxMinutes!=null&&d.estMinMinutes==null) d.estMinMinutes=d.estMaxMinutes;
  if(d.estMinMinutes!=null&&d.estMaxMinutes!=null&&d.estMinMinutes>d.estMaxMinutes){
    const t=d.estMinMinutes; d.estMinMinutes=d.estMaxMinutes; d.estMaxMinutes=t; }
  if(d.fixedStart&&d.fixedEnd&&new Date(d.fixedEnd)<=new Date(d.fixedStart))
    d.fixedEnd=new Date(new Date(d.fixedEnd).getTime()+DAY).toISOString();   /* it runs past midnight */
  if(d.deadline&&d.deferUntil&&startOfDay(d.deferUntil)>startOfDay(d.deadline))
    d.deferUntil=startOfDay(d.deadline).toISOString();
  if(d.deadline&&d.expiry&&new Date(d.expiry)<new Date(d.deadline))
    d.expiry=new Date(new Date(d.deadline).getTime()+59*MIN).toISOString();
  if(d.availableFrom){
    const a=d.availableFrom;
    if(a.mode==="absolute"&&!a.at) d.availableFrom=null;
    else if(a.mode==="beforeDue"&&!d.deadline) d.availableFrom=null;
    else if(a.mode==="absolute"&&d.deadline&&new Date(a.at)>new Date(d.deadline))
      d.availableFrom={mode:"absolute",at:startOfDay(d.deadline).toISOString(),leadDays:null};
  }
  if(d.aimWindow){
    const w=d.aimWindow;
    if(w.start&&w.end&&new Date(w.start)>new Date(w.end)) d.aimWindow={start:w.end,end:w.start};
    if(!w.start&&!w.end) d.aimWindow=null;
  }
  if(d.todWindow){
    const t=d.todWindow;
    if(t.after&&t.before&&hmToMin(t.after)>=hmToMin(t.before)) d.todWindow={after:t.after,before:null};
    if(!t.after&&!t.before) d.todWindow=null;
  }
  d.timePinned=!!d.fixedStart;
  d.durationMode=d.fixedStart?"fixed":(d.estMaxMinutes!=null?"estimate":"none");
}
function taskBits(n,opts={}){
  const bk=opts.block||null, bits=[], st=effStatus(n);
  if(bk&&bk.bg) bits.push("⟳ runs alongside");
  else if(n.background&&n.fixedStart) bits.push("⟳ background");
  else if(n.fixedStart) bits.push(fmtTime(n.fixedStart)+(n.fixedEnd?" to "+fmtTime(n.fixedEnd):""));
  if(bk&&bk.late) bits.push("⚠︎ after its due time");
  else if(bk&&bk.dueBy) bits.push("due by "+fmtTime(n.deadline));
  else if(n.deadline&&n.status!=="done"&&n.status!=="dropped"){
    const over=new Date(n.deadline)<new Date();
    bits.push(`<span style="color:${over?"var(--red)":"var(--orange)"}">due ${esc(relDay(n.deadline))}${n.deadlineHasTime?" "+esc(fmtTime(n.deadline)):""}</span>`);
  }
  if(n.timeframe&&!n.deadline&&n.status!=="done") bits.push(esc(tfLabel(n.timeframe)));
  if(n.estMaxMinutes&&!(bk&&bk.fixed)) bits.push("~"+mins(n.estMaxMinutes));
  if(bk&&bk.slice) bits.push("part of "+mins(n.estMaxMinutes));
  if(bk&&bk.fuzzy) bits.push("~"+mins(bk.minutes)+" guess");
  if(bk&&bk.part) bits.push("sitting "+bk.part+" of "+bk.parts);
  if(n.energy==="deep") bits.push("deep focus");
  if(n.flagged&&st!=="done") bits.push(`<span style="color:var(--accent);font-weight:600">Today</span>`);
  if(effStakes(n)==="protect") bits.push(`<span style="color:var(--red)">protect</span>`);
  else if(effStakes(n)==="flexible") bits.push("flexible");
  if(st==="waiting") bits.push("waiting"+(n.waitingOn?" · "+esc(n.waitingOn):""));
  if(st==="blocked") bits.push("blocked");
  if(st==="deferred") bits.push("opens "+esc(opensLabel(n)||"later"));
  if(st==="someday") bits.push("someday");
  if(n.bumpCount>=4) bits.push(`<span style="color:var(--orange)">pushed back ${n.bumpCount} times</span>`);
  if(n.recurrence) bits.push("repeats");
  if(n.context) bits.push(esc(n.context));
  if(n.deliverable) bits.push(esc(n.deliverable.toLowerCase()));
  const cat=n.category&&catByName(n.category);
  if(cat&&!opts.hideCat) bits.push(`<span style="color:${esc(cat.color||"var(--label2)")}">${cat.icon?esc(cat.icon)+" ":""}${esc(cat.name)}</span>`);
  if(opts.showPath&&n.parentId&&n.parentId!==UNSORTED) bits.push(esc(pathLabel(n.parentId)));
  return bits;
}

    <div class="fieldnote inline"><b>Due</b> means finished by then. The time next to the date is optional (blank means end of day). <b>Available from</b> keeps it out of the plan until it opens up, like an assignment that unlocks a week before it is due. <b>Aim to do it</b> is the stretch you want to work on it. Tap the small x to clear anything.</div>
    <button class="line" id="tMoreWhen" style="color:var(--accent)">More timing choices ${d._moreWhen?"▴":"▾"}</button>

    ${d.timeframe?`<button class="line" id="tTimeframe"><label>Aimed period</label><span class="val set">${esc(tfLabel(d.timeframe))}</span>${CLRX("timeframe",!!d.timeframe)}${ICON_CHEV}</button>`:""}

  :`

    <div class="fieldnote inline">An event or block sits at its time and the plan works around it. Repeats handles a class that meets on set days each week. Something that runs alongside, like laundry, never blocks other work.</div>`;
  const whenSum=[d.fixedStart?fmtDate(d.fixedStart)+" "+fmtTime(d.fixedStart):(d.deadline?relDay(d.deadline)+(d.deadlineHasTime?" "+fmtTime(d.deadline):""):(d.timeframe?tfLabel(d.timeframe):"")),

  const effortBody=`

    ${!isNew&&n.status==="done"?`<div class="line"><label>Actually took</label><input type="number" inputmode="numeric" id="tActual" value="${d.actualMinutes??""}" placeholder="min"><span class="unit">min</span></div>`:""}

  const effortSum=[d.estMaxMinutes?"about "+mins(d.estMaxMinutes):"",d.energy?(d.energy==="deep"?"deep":"shallow"):""].filter(Boolean).join(" · ");

  const orgBody=`

    ${isTodo?`<button class="line" data-pick="stakes"><label>Stakes</label><span class="val">${d.stakesOverridden?STAKES_LABEL[d.stakes||"normal"]:"Inherit"}</span>${ICON_CHEV}</button>`:""}
    <button class="line" data-pick="context"><label>Where</label><span class="val">${esc(d.context||"Anywhere")}</span>${CLRX("context",!!d.context)}${ICON_CHEV}</button>
    ${isTodo?`<button class="line" data-pick="deliverable"><label>Deliverable</label><span class="val">${esc(d.deliverable||"None")}</span>${CLRX("deliverable",!!d.deliverable)}${ICON_CHEV}</button>`:""}
    <button class="line" id="tIcon"><label>Icon</label><span class="val">${d.icon?esc(d.icon):"None"}</span>${CLRX("icon",!!d.icon)}${ICON_CHEV}</button>
    ${isTodo?`<div class="fieldnote inline">Stakes says what slipping would cost. Protect means real consequences, so it keeps full urgency. Flexible means it can slip when the day is full.</div>`:""}`;
  const orgSum=[d.category,isTodo&&d.stakesOverridden?STAKES_LABEL[d.stakes||"normal"]:null].filter(Boolean).join(" · ");

  const deps=(d.dependsOn||[]).map(byId).filter(Boolean);

  const depsBody=`
    <div class="seg" style="margin:12px 16px" id="tDepMode">
      <button data-dm="none"${(d.dependencyMode||"none")==="none"?' class="on"':""}>None</button>
      <button data-dm="required"${d.dependencyMode==="required"?' class="on"':""}>Required</button>

    ${deps.map(x=>`<div class="line"><label style="font-weight:400">${esc(x.title||"Untitled")}</label>

  const alertsSum=d.notify?(d.notify.enabled?"custom":"off"):"";
  const alertsBody=`<button class="line" id="tNotify"><label>Alerts</label><span class="val${d.notify?" set":""}">${d.notify?(d.notify.enabled?"Custom":"Off"):"Inherit from group/category"}</span>${ICON_CHEV}</button>

  const stepsBody=`<div class="line" style="align-items:flex-start;padding-top:12px"><textarea id="tSteps" placeholder="One per line. Each line becomes a subtask of this one. The same shorthand works per line.">${esc(state.capSubs.join("\n"))}</textarea></div>`;

  const st=isNew?null:effStatus(n);
  const statusBody=isNew?"":`

  const waitedBy=isNew?[]:dependents(d.id);

  let h=`

        `<button data-preset="${k}"${(k==="todo"&&isTodo&&!d.background)||(k==="event"&&!isTodo&&d.preset==="event")||(k==="block"&&!isTodo&&d.preset!=="event"&&d.preset!=="Sleep")||(k==="sleep"&&d.preset==="Sleep")||(k==="bgp"&&isTodo&&d.background)?' class="on"':""}>${l}</button>`).join("")}

    ${capsec("when","When",whenBody,whenSum)}

      :`<div class="field" style="margin-top:6px">
        ${n.status==="done"?`<button class="line accent" data-do="reopen">Mark not done</button>`:`<button class="line accent" data-do="done">Mark done</button>`}

function wireTaskSheet(){
  const {d,isNew}=taskCtx(); if(!d) return;
  const on=(sel,ev,fn)=>{ const el=$(sel); if(el) el.addEventListener(ev,fn); };
  const Q=isNew?()=>{}:queueTaskSave;
  const S=k=>{ if(isNew&&state.capSet) state.capSet.add(k); };
  const keepText=()=>{ const t=$("#tTitle"); if(t) d.title=t.value;
    const nn=$("#tNotes"); if(nn) d.notes=nn.value;
    const ss=$("#tSteps"); if(ss) state.capSubs=ss.value.split("\n"); };
  const redraw=()=>{ keepText(); drawTaskSheet(); };

  sheetBody.querySelectorAll("[data-sechd]").forEach(b=>b.addEventListener("click",()=>{
    keepText(); CAP_OPEN[b.dataset.sechd]=!CAP_OPEN[b.dataset.sechd]; drawTaskSheet(); }));
  sheetBody.querySelectorAll("#tType [data-tt]").forEach(b=>b.addEventListener("click",()=>{
    keepText(); applyTaskType(d,b.dataset.tt); Q(); drawTaskSheet(); }));
  sheetBody.querySelectorAll("#tPresets [data-preset]").forEach(b=>b.addEventListener("click",async()=>{
    keepText(); await applyCapturePreset(d,b.dataset.preset); }));

  let chipT=null;
  on("#tTitle","input",e=>{ d.title=e.target.value; Q();
    if(isNew){ clearTimeout(chipT); chipT=setTimeout(refreshChips,140); } });
  if(isNew) on("#tTitle","keydown",async e=>{ if(e.key==="Enter"){ e.preventDefault(); await commitCapture(false); } });
  const nt=$("#tNotes");
  if(nt){ const grow=()=>{ nt.style.height="auto"; nt.style.height=Math.max(64,nt.scrollHeight)+"px"; };
    nt.addEventListener("input",e=>{ d.notes=e.target.value; grow(); Q(); }); grow(); }
  on("#tSteps","input",e=>{ state.capSubs=e.target.value.split("\n"); });
  on("#tFlag","click",()=>{ d.flagged=!d.flagged; Q(); redraw(); });
  on("#tGroup","click",()=>{ keepText(); openPicker(d,Q); });

  on("#tDeadline","change",e=>{ S("deadline");
    const t=d.deadlineHasTime?timeInput(d.deadline):"17:00";
    d.deadline=e.target.value?new Date(e.target.value+"T"+t+":00").toISOString():null;
    if(!d.deadline) d.deadlineHasTime=false;
    if(d.deadline) d.timeframe=null; normalizeTiming(d); Q(); });
  on("#tDeadline","blur",()=>setTimeout(redraw,80));
  on("#tDlTime","change",e=>{ S("deadline");
    if(!d.deadline) return;
    if(e.target.value){ d.deadline=new Date(dateInput(d.deadline)+"T"+e.target.value+":00").toISOString(); d.deadlineHasTime=true; }
    else { d.deadline=new Date(dateInput(d.deadline)+"T17:00:00").toISOString(); d.deadlineHasTime=false; }
    normalizeTiming(d); Q(); });
  on("#tDlTime","blur",()=>setTimeout(redraw,80));
  on("#tAvail","click",()=>{ keepText(); openAvailSheet(d,()=>{ S("deadline"); Q(); }); });
  on("#tAim","click",()=>{ keepText(); openAimSheet(d,()=>{ S("deadline"); Q(); }); });
  on("#tTod","click",()=>{ keepText(); openTodSheet(d,()=>{ Q(); }); });
  on("#tBg","click",()=>{ d.background=!d.background; Q(); redraw(); });
  on("#tEstMin","change",e=>{ S("dur");
    d.estMinMinutes=e.target.value===""?null:Number(e.target.value);
    if(e.target.value==="") d.estMaxMinutes=null;
    normalizeTiming(d); Q(); redraw(); });
  on("#tEstMax","change",e=>{ S("dur");
    d.estMaxMinutes=e.target.value===""?null:Number(e.target.value);
    if(e.target.value==="") d.estMinMinutes=null;
    normalizeTiming(d); Q(); redraw(); });
  on("#tFixed","click",()=>{ keepText(); openFixedSheet(d,Q); });
  on("#tRepeat","click",()=>{ keepText(); openRepeatEditor(d,()=>{ S("rec"); Q(); }); });
  on("#tMoreWhen","click",()=>{ d._moreWhen=!d._moreWhen; redraw(); });
  on("#tTimeframe","click",()=>{ keepText(); openTimeframe(d.timeframe,tf=>{ d.timeframe=tf; S("deadline"); Q(); }); });
  on("#tExpiry","change",e=>{ d.expiry=e.target.value?new Date(e.target.value+"T23:59:00").toISOString():null; normalizeTiming(d); Q(); });
  on("#tActual","input",e=>{ d.actualMinutes=e.target.value===""?null:Math.max(0,Number(e.target.value)); Q(); });
  on("#tIcon","click",()=>{ keepText(); openIconPicker(TASK_ICONS,d.icon,v=>{ d.icon=v; Q(); }); });
  on("#tNotify","click",()=>{ keepText(); openNotifyEditor(d.notify,v=>{ d.notify=v; Q(); },
    "Overrides the group and category defaults for this task only."); });
  $$("#tDepMode button").forEach(b=>b.addEventListener("click",()=>{
    d.dependencyMode=b.dataset.dm; Q(); redraw(); }));
  on("#tAddDep","click",()=>{ keepText(); openDepPicker(d,Q); });
  sheetBody.querySelectorAll("[data-rmdep]").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation(); d.dependsOn=(d.dependsOn||[]).filter(x=>x!==b.dataset.rmdep); Q(); redraw(); }));
  sheetBody.querySelectorAll("[data-opennode]").forEach(b=>b.addEventListener("click",async()=>{
    await flushTaskSave(); openSheet(b.dataset.opennode); }));
  sheetBody.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>{
    keepText();
    const k=b.dataset.pick;
    pickField(k,d,()=>{ if(k==="category") S("cat"); if(k==="context") S("ctx");
      if(k==="stakes") S("imp"); Q(); }); }));
  sheetBody.querySelectorAll("[data-do]").forEach(b=>b.addEventListener("click",()=>detailAction(b.dataset.do)));
  on("#tWaitOn","input",e=>{ d.waitingOn=e.target.value; Q(); });
  on("#tFollow","change",e=>{ d.followUpDate=e.target.value?new Date(e.target.value+"T09:00:00").toISOString():null; Q(); });
  on("#tSaveMore","click",async()=>{ await commitCapture(true); });
  sheetBody.querySelectorAll("[data-clearx]").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation(); keepText();
    const k=b.dataset.clearx;
    if(k==="deadline"){ d.deadline=null; d.deadlineHasTime=false; S("deadline"); }
    if(k==="avail") d.availableFrom=null;
    if(k==="aim") d.aimWindow=null;
    if(k==="tod") d.todWindow=null;
    if(k==="dltime"){ if(d.deadline) d.deadline=new Date(dateInput(d.deadline)+"T17:00:00").toISOString(); d.deadlineHasTime=false; S("deadline"); }
    if(k==="est"){ d.estMinMinutes=null; d.estMaxMinutes=null; S("dur"); }
    if(k==="fixed"){ d.fixedStart=null; d.fixedEnd=null; d.background=false; d.durationMode=d.estMaxMinutes?"estimate":"none"; }
    if(k==="timeframe"){ d.timeframe=null; S("deadline"); }
    if(k==="defer") d.deferUntil=null;
    if(k==="expiry") d.expiry=null;
    if(k==="follow") d.followUpDate=null;
    if(k==="category"){ d.category=null; S("cat"); }
    if(k==="deliverable") d.deliverable=null;
    if(k==="context"){ d.context=null; S("ctx"); }
    if(k==="energy") d.energy=null;
    if(k==="icon") d.icon=null;
    if(k==="recur"){ d.recurrence=null; S("rec"); }
    Q(); drawTaskSheet(); }));
}

function applyTaskType(d,t){
  if(t==="todo"){ d.actionable=true; if(d.preset==="event"||d.preset==="block") d.preset=null; }
  if(t==="event"){ d.actionable=false; d.background=false; d.preset="event"; d.deadline=null; d.deadlineHasTime=false; d.availableFrom=null; d.aimWindow=null; d.todWindow=null; }
  if(t==="block"){ d.actionable=false; d.preset=d.preset&&d.preset!=="event"?d.preset:"block"; d.deadline=null; d.deadlineHasTime=false; d.availableFrom=null; d.aimWindow=null; d.todWindow=null; }
  normalizeTiming(d);
}
async function applyCapturePreset(d,k){
  if(k==="project"){ await closeSheet(); openGroupSheet(null); return; }
  if(k==="template"){ openTemplatePicker(); return; }
  if(k==="todo"){ applyTaskType(d,"todo"); d.background=false; }
  if(k==="event"){ applyTaskType(d,"event"); }
  if(k==="block"){ applyTaskType(d,"block"); }
  if(k==="sleep"){
    applyTaskType(d,"block"); d.preset="Sleep"; if(!d.title) d.title="Sleep";
    const sl=state.settings.sleep;
    const t0=new Date(); const [bh,bm]=(sl.bed||"23:00").split(":");
    t0.setHours(+bh,+bm,0,0);
    const t1=new Date(t0); const [wh,wm]=(sl.wake||"07:00").split(":");
    t1.setHours(+wh,+wm,0,0); if(t1<=t0) t1.setDate(t1.getDate()+1);
    d.fixedStart=t0.toISOString(); d.fixedEnd=t1.toISOString();
  }
  if(k==="bgp"){ applyTaskType(d,"todo"); d.background=true;
    if(!d.fixedStart){ const t=new Date(Math.ceil(Date.now()/(15*MIN))*(15*MIN));
      d.fixedStart=t.toISOString(); d.fixedEnd=new Date(t.getTime()+60*MIN).toISOString(); } }
  normalizeTiming(d);
  if(state.capWiz) drawWizard(); else drawTaskSheet();
}
function availLabel(af){
  const P=state.settings.plan;
  if(!af) return "From now";
  if(af.mode==="beforeDue") return (af.leadDays!=null?af.leadDays:P.leadDays)+" days before due";
  if(!af.at) return "From now";
  const dt=new Date(af.at);
  return fmtDate(af.at)+((dt.getHours()||dt.getMinutes())?" "+fmtTime(af.at):"");
}
/* Available from: an exact date, or days before the due date */
function openAvailSheet(d,onChange){ sheetPush(()=>drawAvailSheet(d,onChange)); }
function drawAvailSheet(d,onChange){
  const P=state.settings.plan;
  const af=d.availableFrom;
  showSheet("Available from",
    `<div class="fieldnote" style="margin:0 20px 12px">When this opens up for work. Until then it stays out of the plan and does not count against your day.</div>
     <div class="group">
       <button class="pickrow" data-am="none"><span>From now</span>${!af?'<span class="tick">✓</span>':""}</button>
       ${d.deadline?`<button class="pickrow" data-am="beforeDue"><span>Some days before it is due</span>${af&&af.mode==="beforeDue"?'<span class="tick">✓</span>':""}</button>`:""}
       <button class="pickrow" data-am="absolute"><span>On a date</span>${af&&af.mode==="absolute"?'<span class="tick">✓</span>':""}</button>
     </div>
     ${af&&af.mode==="beforeDue"?`<div class="field" style="margin-top:14px"><div class="line"><label>Days before due</label><input type="number" inputmode="numeric" min="0" max="365" id="afLead" value="${af.leadDays!=null?af.leadDays:P.leadDays}"></div></div>
     <div class="fieldnote">Made for assignments an instructor opens later in the term. ${P.leadDays} days is the app default, set in Settings.</div>`:""}
     ${af&&af.mode==="absolute"?`<div class="field" style="margin-top:14px">
       <div class="line"><label>Date</label><input type="date" id="afAt" value="${dateInput(af.at)}"></div>
       <div class="line"><label>Time</label><input type="time" id="afAtT" value="${af.at&&(new Date(af.at).getHours()||new Date(af.at).getMinutes())?timeInput(af.at):""}"></div>
     </div>
     <div class="fieldnote">A blank time means from the start of that day.</div>`:""}
     ${!d.deadline?`<div class="fieldnote">The days before due choice appears once this has a due date.</div>`:""}`,null);

/* ===========================================================================
   TEMPLATES
   A template is a saved shape for a task: the fields it presets, plus dates
   stored as offsets (due in N days, available N days before due) that get
   worked out fresh each time you apply it. Fields marked ask are the ones
   the apply screen asks you for.
   =========================================================================== */
function tplById(id){ return state.templates.find(t=>t.id===id)||null; }
function applyTemplate(tpl){
  const base=JSON.parse(JSON.stringify(tpl.data||{}));
  delete base.id; delete base.createdAt; delete base.touchedAt; delete base.completedAt;
  const d=newNode(base);
  if(base.parentId===undefined) d.parentId=captureDest();
  const rel=tpl.rel||{};
  if(rel.dueDays!=null){ const t=addDays(new Date(),rel.dueDays); t.setHours(17,0,0,0);
    d.deadline=t.toISOString(); }
  if(rel.leadDays!=null) d.availableFrom={mode:"beforeDue",at:null,leadDays:rel.leadDays};
  if(rel.aimStartDays!=null||rel.aimEndDays!=null) d.aimWindow={
    start:rel.aimStartDays!=null?startOfDay(addDays(new Date(),rel.aimStartDays)).toISOString():null,
    end:rel.aimEndDays!=null?startOfDay(addDays(new Date(),rel.aimEndDays)).toISOString():null};
  if(rel.expiryDaysAfterDue!=null&&d.deadline)
    d.expiry=new Date(new Date(d.deadline).getTime()+rel.expiryDaysAfterDue*DAY).toISOString();
  const ask=tpl.ask||[];
  if(ask.includes("title")) d.title=d.title||"";
  if(ask.includes("due")&&rel.dueDays==null) d.deadline=null;
  normalizeTiming(d);
  state.capDraft=d; state.capSubs=[]; state.capIgnore=new Set();
  state.capSet=new Set(["deadline","dur","cat","ctx","imp","rec"]);
  state.editing=null; state.draft=null;
  state.capWiz={i:1};
  sheetRoot(drawWizard);
  setTimeout(()=>{ const t=$("#wTitle"); if(t&&!t.value) t.focus(); },250);
}
async function saveAsTemplate(d){
  const data=JSON.parse(JSON.stringify(d));
  for(const k of ["id","createdAt","touchedAt","completedAt","status","bumpCount","order",
    "deadline","deadlineHasTime","expiry","deferUntil","aimWindow","_moreWhen","waitingOn","followUpDate","actualMinutes","links","dependsOn"]) delete data[k];
  const rel={};
  if(d.deadline){ const dd=Math.round((startOfDay(d.deadline)-startOfDay(new Date()))/DAY);
    if(dd>0) rel.dueDays=dd; }
  if(d.availableFrom&&d.availableFrom.mode==="beforeDue")
    rel.leadDays=d.availableFrom.leadDays!=null?d.availableFrom.leadDays:state.settings.plan.leadDays;
  delete data.availableFrom;
  const tpl={id:uid(),name:(d.title||"Template").trim()||"Template",icon:d.icon||null,
    data,rel,ask:["title","due"],createdAt:nowISO()};
  await putTpl(tpl); state.templates.push(tpl);
  toast("Saved as a template");
}
function openTemplatePicker(){ sheetPush(drawTemplatePicker); }
function drawTemplatePicker(){
  showSheet("From a template",
    `<div class="fieldnote" style="margin:0 20px 12px">A template fills a new task in for you. Dates stored as offsets, like due in 14 days or open one week before due, get worked out fresh from today.</div>
     ${state.templates.length?`<div class="group">${state.templates.map(t=>
       `<button class="pickrow" data-tapply="${t.id}"><span>${t.icon?esc(t.icon)+" ":""}${esc(t.name)}
         <span class="path">${tplSummary(t)}</span></span>${ICON_CHEV}</button>`).join("")}</div>`

function tplSummary(t){

      <div class="line"><label>Opens</label><input type="number" inputmode="numeric" min="0" max="365" id="tpLead" value="${rel.leadDays!=null?rel.leadDays:""}" placeholder="none"><span class="unit">days before due</span></div>

     <div class="field">
      ${askRow("title","Ask for the title")}
      ${askRow("due","Ask for the due date")}
      ${askRow("effort","Ask for the effort")}
      ${askRow("shape","Ask for category, group, and stakes")}
     </div>
     <div class="fieldnote">Asked sections open up when you apply the template. Everything else is filled in quietly.</div>
     <div class="field" style="margin-top:14px"><button class="line danger" id="tpDelete">Delete template</button></div>`,null);
  $("#tpName").addEventListener("input",e=>{ t.name=e.target.value; clearTimeout(drawTemplateEdit._t);
    drawTemplateEdit._t=setTimeout(T,400); });
  $("#tpDue").addEventListener("change",async e=>{ rel.dueDays=e.target.value===""?null:clamp(Number(e.target.value)||0,0,365); await T(); });
  $("#tpLead").addEventListener("change",async e=>{ rel.leadDays=e.target.value===""?null:clamp(Number(e.target.value)||0,0,365); await T(); });
  sheetBody.querySelectorAll("[data-task2]").forEach(b=>b.addEventListener("click",async()=>{

    await putTpl(t); drawTemplateEdit(t); }));
  $("#tpDelete").addEventListener("click",async()=>{

/* searchable multi-select dependency picker with full group paths */

      .filter(x=>x.id!==d.id&&x.id!==UNSORTED&&x.kind==="task"&&!isDescendantOf(x.id,d.id)&&x.id!==d.parentId)
